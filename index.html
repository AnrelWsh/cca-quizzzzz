["In an evacuation, communication between cabin crew coordinates:",["The evacuation order, usable exits and passenger flow","Meal service","Boarding","Fuel"],0,"Les informations cruciales vont au poste de pilotage selon l'urgence et le CRM. · C02 01 03 01 · p.16"],
["Passenger communication relies on:",["Briefings, demonstrations and announcements through direct speech, PA, safety card or megaphone with the required action clear","Written notes only","Silence","Gestures only"],0,"Les gestes deviennent le moyen principal si l'équipement est inutilisable. · C02 01 03 03 · p.20–23"]
]},
{n:"C04 – Passenger handling",s:"PDF p.7–63",q:[
["Cabin crew must make sure passengers have taken their allocated seats. If in doubt or in case of difficulty, they:",["Inform the Captain, who can decide to modify the load sheet","Move passengers themselves","Ignore it","Call ground staff only"],0,"La répartition des passagers doit correspondre au load sheet pour respecter les limites de centre de gravité. En cas de doute, c'est le commandant qui peut modifier le load sheet. · C04 01 01 01 · p.7"],
["Which is NOT listed as a special category of passenger (SCP)?",["Persons with reduced mobility","Infants and unaccompanied children","Deportees or persons in custody","A passenger with a business-class ticket"],3,"Les SCP sont ceux qui pourraient avoir des difficultés ou gêner une évacuation : PRM, sensoriels, âgés/fragiles, obèses, enfants/bébés, personnes escortées et passagers avec animaux. Le tarif du billet n'entre pas en jeu. · C04 01 01 02 · p.7"],
["Seat restrictions for SCPs mainly mean:",["Avoiding emergency exit rows and keeping access to aisles","Seating them at the back","Seating them in first class","No restriction"],0,"Un SCP ne doit pas occuper un siège donnant accès direct à une issue de secours ni gêner l'accès aux allées, afin de ne pas ralentir l'évacuation. · C04 01 01 02 · p.8"],
["A recognised assistance dog travelling in the cabin:",["Is secured with a harness provided by the owner during taxi, take-off, landing and turbulence","Is free to move at any time","Must always be muzzled by EASA rule","Must always sit at a window by EASA rule"],0,"Le propriétaire fournit un harnais adapté ; en croisière, un moindre maintien peut être accepté selon la procédure de la compagnie. L'EASA n'impose ni muselière ni siège hublot universels. · C04 01 01 03 · p.8"],
["Under CAT.OP.MPA.155(d), who must be notified in advance when SCPs are carried?",["The commander","The caterer","The purser only","The passengers"],0,"Le commandant doit être informé à l'avance de la présence de SCP à bord. · C04 01 02 · p.9"],
["Unaccompanied children require special attention from the crew:",["From boarding until they are handed over to the designated guardian or airport official","Only during take-off","Only during meals","Only in an emergency"],0,"La prise en charge couvre tout le vol, de l'embarquement jusqu'à la remise à la personne désignée. · C04 01 02 · p.10"],
["Deportees may require:",["Isolated seating away from other passengers","A seat at an emergency exit","Free upgrades","No special measure"],0,"Ils peuvent être accompagnés par des agents et nécessitent une coordination particulière pour la sécurité de tous. · C04 01 02 · p.10"],
["For an adult travelling with an infant, cabin crew must:",["Demonstrate the brace position for a lap-held infant, explain the loop belt, and tell the adult to put their own oxygen mask on first","Tell them to hold the infant tightly with no brace","Seat them at the exit","Give no information"],0,"L'adulte doit d'abord assurer sa propre protection (masque) avant d'aider le bébé ; on explique aussi la ceinture-boucle et l'évacuation avec un bébé. · C04 01 02 · p.11"],
["Briefing an unaccompanied child includes:",["Seat belt, oxygen mask, safety card, and asking an adult neighbor to help","Nothing, they are too young","Only the brace position","Only meals"],0,"Le neighbor adulte est informé pour aider l'enfant (masque, appel d'un PNC). · C04 01 02 · p.11"],
["When children aged 2 to under 12 are grouped together, there must be:",["At least one accompanying adult for every group of up to twelve children","One adult per child","No adult","One adult per two groups"],0,"S'ils sont dispersés, un adulte doit être assis près de chacun. Les deux règles peuvent s'appliquer sur un même vol. · C04 01 02 · p.13"],
["An accompanying passenger for children can be:",["A person 18 or older without responsibility for a child under 2","Any person over 12","A child of 16","A person over 70 only"],0,"Des membres d'équipage supplémentaires peuvent aussi jouer ce rôle. L'accompagnateur doit connaître consignes, issues et équipements. · C04 01 02 · p.13"],
["WCHR means a passenger who needs assistance:",["Up to the ramp of the aircraft, then walks up the stairs and to the seat unassisted","Up to the cabin seat","Only in the cabin","No assistance"],0,"WCHR = Ramp ; WCHS = Stairs (jusqu'à la porte de l'avion) ; WCHC = Cabin (jusqu'au siège). · C04 01 02 · p.14"],
["WCHC means:",["Wheelchair assistance up to the passenger's seat in the cabin","Wheelchair to the ramp","Wheelchair up the stairs","Blind passenger"],0,"C comme Cabin : le passager est accompagné jusqu'à son siège. · C04 01 02 · p.14"],
["Prisoners in custody are:",["Escorted at all times, restrained as necessary, seated away from exits","Seated at an emergency exit","Not escorted","Free to move"],0,"Les déportés sont assis séparément, les inadmissibles surveillés ; la sécurité est la priorité absolue pour les prisonniers. · C04 01 02 · p.16"],
["CAT.OP.MPA.230 requires procedures ensuring that exits and escape paths are clear:",["Before taxiing, take-off and landing","Only in cruise","Only at the gate","Only after landing"],0,"C'est la base réglementaire du maintien des allées et issues dégagées. · C04 01 03 · p.17"],
["During boarding, bulky items that cannot be safely stowed are:",["Tagged for gate check-in or placed in designated stowage areas","Left in the aisle","Placed at the exit","Taken by the passenger"],0,"On surveille le placement des bagages pour que rien ne dépasse dans l'allée. · C04 01 03 · p.17"],
["CAT.OP.MPA.160 requires that:",["Only hand baggage that can be adequately and securely stowed is taken into the cabin, and baggage that might cause injury or obstruct is stowed to prevent movement","All baggage is in the cargo hold","Passengers choose where to stow","No baggage is allowed"],0,"Deux exigences : bagages à main correctement arrimables, et tout objet dangereux ou gênant arrimé. · C04 02 01 02 · p.19"],
["Under-seat stowage is allowed only if:",["The seat has a restraint bar","The bag is small","The passenger agrees","Never"],0,"On ne met jamais d'objets dans les toilettes ni contre des cloisons non étiquetées. · C04 02 01 03 · p.20"],
["Stowage checks must be made:",["Before take-off, before landing and when the seat belt sign is on","Only at boarding","Only at the end of flight","Never"],0,"Des contrôles réguliers évitent les projectiles et les obstructions. · C04 02 01 03 · p.21"],
["In the passenger compartment, cargo carriage:",["Allows no dangerous goods, and only guide dogs and pets under 8 kg","Allows any pet","Allows dangerous goods in the aisle","Has no limit"],0,"Le fret ne doit pas dépasser les limites de charge du sol ou des sièges ni gêner issues ou vision de l'équipage. · C04 02 01 03 · p.21"],
["With a passenger who has drunk too much, the first reaction is to:",["Use a considerate and friendly tone, notify the purser and maintain discreet surveillance","Shout","Serve more alcohol","Ignore"],0,"L'alcool est interdit au passager, que l'on cherche à isoler en restant disponible mais autoritaire. · C04 03 01 · p.23"],
["With a psychiatric patient under drug influence, the crew should:",["Stay calm, be persuasive, inform the captain; physical restraint only as the ultimate resource","Use physical restraint immediately","Show fear","Leave him alone"],0,"Son agressivité est souvent une réaction impulsive à l'anxiété ; on évite toute action répressive. Une déviation peut être envisagée. · C04 03 02 · p.25"],
["Annex 17 to the Chicago Convention and the Tokyo Convention (1963) define disruptive passengers as people who:",["Fail to respect rules of conduct or follow instructions, disturbing good order and discipline","Pay late","Are late for boarding","Are children"],0,"Ils menacent l'ordre et la sécurité à bord. · C04 03 03 01 · p.28"],
["The single factor that triggers the majority of unruly passenger events is:",["Intoxication","Long queues","Noise","Baby crying"],0,"Parmi les causes (fatigue, anxiété, files d'attente, etc.), l'ivresse est la première. · C04 03 03 01 · p.29"],
["ICAO threat levels: Level 2 is:",["Physically abusive behavior","Verbal disruptive behavior","Life-threatening behavior","Breach of the flight crew compartment"],0,"Niveau 1 = verbal ; 2 = physique ; 3 = danger de mort ou arme ; 4 = tentative ou intrusion dans le cockpit. · C04 03 03 01 · p.29"],
["At threat levels 1 or 2 cabin crew should:",["Inform the passenger of the consequences, verbally or with a warning card, and that no more alcohol will be served","Restrain immediately","Land at once","Ignore the passenger"],0,"Le message demande de cesser sous peine de refus de transport ou de poursuites. · C04 03 03 01 · p.30"],
["Restraining devices are considered:",["Only when all conciliatory approaches have failed, and then stay on for the flight","As the first step","Never","Only on the ground"],0,"Toute intervention est documentée avec des témoignages. · C04 03 03 01 · p.30"],
["With passengers who ignore instructions, the 'demonstrative approach' means:",["Physically showing them, e.g. how to fasten a seat belt","Shouting","Calling security","Ignoring"],0,"Approche progressive : message poli, démonstration, ton ferme, intervention du chef de cabine ou du commandant, puis documentation. · C04 03 03 02 · p.32"],
["Passengers with a medical condition who informed the airline before the flight fall into:",["Advance notice conditions","In-flight emergent conditions","Unruly passengers","SCP with animals"],0,"Contrairement aux urgences en vol, qu'on ne peut pas préparer à l'avance. · C04 03 03 03 · p.33"],
["EASA's main PED precaution is to:",["Switch them off during critical phases such as take-off and landing","Use them freely","Charge them","Ban them all flight"],0,"Les appareils émettant des ondes radio sont interdits sauf s'ils sont approuvés pour l'avion. · C04 03 03 04 · p.34"],
["In moderate turbulence:",["Walking through the cabin is not recommended unless necessary","Walking is impossible","Nothing is felt","Liquids stay still"],0,"En sévère, on marche impossiblement et les objets deviennent des projectiles. · C04 05 01 · p.37"],
["The phrase for unexpected severe turbulence is:",["'HERE IS THE COCKPIT, cabin crew seated and fastened, severe turbulence'","'Cabin ready'","'Brace'","'Evacuate'"],0,"Les PNC informent vite les passagers, sécurisent le matériel (cafetières au sol) et s'attachent au siège le plus proche. · C04 05 01 · p.38"],
["After turbulence, the cabin crew return to duty:",["With the permission of the flight crew","Whenever they want","After 10 minutes","After landing"],0,"Ils attendent le feu vert du cockpit. · C04 05 01 · p.38"],
["During light turbulence:",["Service continues and the Purser reports to the flight crew","Service stops","Doors are armed","Passengers evacuate"],0,"Les PNC annoncent le port de la ceinture et vérifient aussi les toilettes. · C04 05 01 · p.38"],
["During night flights cabin crew must be especially vigilant to:",["Check the seat belts of sleeping passengers","Turn all lights on","Serve meals","Open doors"],0,"Le signal ceinture longtemps allumé peut provoquer de la négligence. · C04 05 02 · p.39"],
["Fire prevention duties include:",["Monitoring lavatories, checking ovens and galleys, enforcing no smoking","Opening doors","Serving drinks","Closing curtains"],0,"On reste attentif aux odeurs, bruits ou comportements anormaux des systèmes. · C04 05 02 01 · p.39"],
["In galleys, crew make sure that:",["No flammable materials such as napkins are left near or in heated equipment","Paper is stored in ovens","Ovens stay on","Circuit breakers are ignored"],0,"On surveille aussi les tableaux électriques et les disjoncteurs. · C04 05 02 01 · p.40"],
["A fire containment bag may be carried in case of:",["A mobile phone, laptop or power bank catching fire","An engine fire","A galley oven failure","Turbulence"],0,"On vérifie aussi que l'AED fonctionne (voyant fixe ou clignotant) et que l'ELT est armée avec antenne. · C04 05 02 02 · p.41"],
["If a baggage compartment malfunctions, the cabin crew:",["Report it to the captain","Ignore it","Leave it open","Remove it"],0,"Avant le décollage, tous les compartiments doivent être fermés et verrouillés. · C04 05 02 06 · p.44"],
["Before moving off stand, lavatories must be:",["Checked unoccupied, properly secured, with the 'occupied' sign off","Left occupied","Used by crew","Open"],0,"Tout dysfonctionnement est signalé au commandant. · C04 05 02 07 · p.45"],
["An able-bodied passenger (ABP) is chosen because he/she is:",["Physically and mentally capable, ideally with the same mother tongue as the crew and motivated","Any adult","A child","The first to board"],0,"Il se place en bas du toboggan comme point d'assistance. · C04 06 01 · p.46"],
["ABPs open exits in case of crew incapacitation only after:",["Checking the external conditions and on the order of the crew","Immediately","Without checking","Never"],0,"Son briefing porte d'abord sur la gestion du flux de passagers et la protection du PNC à l'ouverture. · C04 06 01 · p.47"],
["An aborted take-off is identified by:",["Sudden deceleration, variation in engine noise and possible yaws on the runway","Climb","Landing gear retraction","Seat belt sign off"],0,"Décision du commandant pour raison technique. · C04 06 02 · p.49"],
["During an aborted take-off, cabin crew:",["Go to station (alert phase), wait for the flight crew's instructions and prepare for a possible evacuation","Open doors","Stand in the aisle","Serve drinks"],0,"Ils observent l'extérieur pour déterminer les issues utilisables. · C04 06 02 · p.49"],
["The actions taken in the first minutes of cabin preparation for forced landing:",["Ensure the success or failure of the preparation (first 2 minutes)","Are optional","Are only for the Purser","Do not matter"],0,"Le Purser distribue les tâches par zone, puis informe les passagers (préparation psychologique). · C04 06 03 01 · p.51"],
["Assistance planned for passengers: how many persons for a disabled person who can only move with difficulty?",["2","1","3","0"],0,"1 personne par enfant, senior, femme enceinte, obèse ou handicapé mobile ; 2 pour celui qui se déplace difficilement. · C04 06 03 01 · p.52"],
["If no time to stow catering equipment before forced landing:",["Put everything in a blanket and place it in the toilets","Leave in the aisle","Throw it out","Hand it to passengers"],0,"On vérifie aussi que l'éclairage de secours est armé ou allumé et que les issues sont dégagées. · C04 06 03 01 · p.53"],
["The brace command is:",["Repeated by cabin crew until the aircraft has stopped","Said once","Silent","Given after landing"],0,"Chaque compagnie a sa phrase, précisée dans son manuel d'exploitation. · C04 06 03 01 · p.54"],
["Before opening a door in an evacuation, the crew must:",["Make sure there is no external danger and check the slide's armament","Open at once","Hold the handle during opening","Wait for ground staff only"],0,"Ne pas confondre la poignée de désaccouplement et la poignée de percussion d'urgence. · C04 06 03 02 · p.56"],
["The alert phase is the period between:",["'HERE IS THE COCKPIT, CABIN CREW AT STATION' and the start of evacuation or its cancellation","Boarding and take-off","Landing and gate","Engine start and taxi"],0,"Elle est déclenchée par le commandant, ou à la demande du Purser. · C04 06 03 03 · p.57"],
["The decision to launch an evacuation belongs to:",["The Captain, who says 'EVACUATION' three times and activates the evacuation alarm","The ground staff","Passengers","The caterer"],0,"Si le commandant est incapacité, le Purser ou un autre PNC peut l'ordonner en cas d'urgence évidente. · C04 06 03 03 · p.58"],
["Group panic is aggravated by:",["Fire, smoke, lack of clear instructions and contagion of panic","Calm briefing","A good safety demonstration","Uniforms"],0,"La panique positive est une fuite réflexe ; la négative est la sidération. L'assertivité du PNC (rassurant et autoritaire) permet de garder la coopération. · C04 06 04 · p.60"],
["During evacuation orders should be:",["Positive, very short, loud and with firm gestures","Negative and long","Whispered","Written"],0,"Le cerveau enregistre les mots : on dit 'go left' et non 'do not go right'. · C04 06 04 · p.61"],
["Airsickness is caused by:",["Conflicting messages received by the central nervous system (inner ear, eyes, muscles)","Cabin pressure only","Alcohol only","Heat"],0,"Fatigue, stress, anxiété, alcool et médicaments augmentent la sensibilité. · C05 03 01 · p.62"],
["For an airsick passenger, the manual advises to:",["Seat him in the center of the aircraft, open the aerator, close the blind and recline the seatback","Lay him on the aisle floor","Give coffee","Open the window blind"],0,"On réduit aussi les mouvements de tête et on propose un masque de repos. · C05 03 01 · p.63"],
["SCPs must not be allocated seats that permit direct access to emergency exits where their presence could:",["Impede crew duties, obstruct access to emergency equipment or impede evacuation","Reduce comfort","Delay boarding","Increase fuel burn"],0,"Ce sont les trois critères de CAT.OP.MPA.155(c) : gêner l'équipage, bloquer l'accès au matériel de secours ou freiner l'évacuation. · C04 01 02 · p.9"],
["A person with reduced mobility (PRM) can be reduced in mobility because of:",["Physical or intellectual disability, temporary or permanent, or age","Only a permanent disability","Only age","Only a broken leg"],0,"La définition est large : handicap physique, sensoriel, intellectuel, temporaire ou permanent, ou âge. · C04 01 02 · p.9"],
["For a physically disabled passenger (aided walking), the crew advises to:",["Leave the mobility aid behind during an emergency evacuation","Take the aid at all cost","Stay seated","Use the aid as a slide"],0,"Une aide à la mobilité ralentirait l'évacuation et encombrerait les issues. · C04 01 02 · p.11"],
["For a DEAF passenger, the crew offers:",["Accompaniment, individual needs met, and help from staff trained in sign language","A wheelchair only","Nothing","A seat at the exit"],0,"Pour un BLND, on accompagne aussi et on fournit un fauteuil sur demande. · C04 01 02 · p.12"],
["Every child must have:",["An individual seat equipped with a functional seat belt","A shared seat","A seat belt only for infants","A seat at the exit"],0,"Règle de base du transport des enfants. · C04 01 02 · p.13"],
["The presence of PRMs on board must be:",["Reported to the Captain","Hidden","Reported to passengers","Not reported"],0,"L'exploitant doit aussi avoir une procédure dans son manuel d'exploitation. · C04 01 02 · p.14"],
["DPNA covers passengers with:",["Intellectual or developmental disability needing assistance, e.g. dementia, Alzheimer's or Down's syndrome, traveling alone","A broken arm","A fear of flying","A pet"],0,"Ils sont accompagnés et leurs besoins individuels pris en compte. · C04 01 02 · p.15"],
["Inadmissible passengers are:",["Seated separately if possible and monitored, not necessarily escorted","Always handcuffed","Seated at the exit","Free of any briefing"],0,"Ils sont briefés séparément et les autorités du lieu d'arrivée sont informées discrètement. · C04 01 02 · p.16"],
["During descent and landing, the crew:",["Make an announcement to secure belongings and keep aisles and exits clear, then make a final cabin check","Serve a meal","Open the doors","Dim all lights"],0,"Le dernier contrôle de la cabine confirme que tout est conforme. · C04 01 03 · p.18"],
["CAT.OP.MPA.165 requires procedures so that passengers are seated:",["Where they can help and not impede an evacuation","As they like","Near the lavatories","In first class"],0,"Certains passagers (handicapés, âgés, obèses, enfants, escortés, avec animaux) ne doivent pas être placés à côté d'une issue. · C04 01 03 01 · p.18"],
["Why does unsecured cabin baggage matter?",["It can become a projectile in turbulence or sudden deceleration and block evacuation paths","It only looks untidy","It increases noise","It is only a service issue"],0,"Le manuel parle aussi d'équilibre de l'avion, car le poids doit être réparti correctement. · C04 02 01 03 · p.19"],
["Oversized or excessive hand baggage is:",["Flagged and stowed in the cargo area","Left in the aisle","Placed at an exit","Given to a passenger"],0,"Les charges maximales sont indiquées dans les coffres. · C04 02 01 03 · p.20"],
["For overhead compartments the manual advises:",["Placing heavier items at the bottom, securing compartments tightly and double-checking items like strollers or musical instruments","Placing heavy items at the top","Overfilling","Keeping doors open"],0,"Un coffre trop plein empêche la fermeture sûre des portes. · C04 02 01 03 · p.20"],
["Overstuffing lockers can cause:",["An inability to securely latch the doors","Better balance","Less turbulence","Faster boarding"],0,"On évite aussi de bloquer l'accès au matériel de secours. · C04 02 01 03 · p.21"],
["Unsecured service items such as meal carts can:",["Obstruct evacuation routes and become projectiles in turbulence","Improve service","Be left anywhere","Reduce noise"],0,"Ils doivent aussi rester accessibles quand on en a besoin. · C04 02 01 04 · p.22"],
["A bag blocking an emergency exit can:",["Delay its opening or damage its mechanism","Reduce noise","Help balance","Have no effect"],0,"Un objet près d'un extincteur peut le rendre inaccessible en cas de feu. · C04 02 01 05 · p.22"],
["On boarding, in the presence of a clearly pathological attitude:",["Regulations allow the passenger to be disembarked, with the captain and ground staff","Nothing can be done","He must be seated at the exit","He is served alcohol"],0,"C'est préférable à la gestion d'un incident en vol. · C04 03 01 · p.23"],
["A subject under cannabis intoxication typically shows:",["A simple exaltation of mood with euphoria, volubility and loss of inhibitions","Dangerous aggression","Unconsciousness","Fear"],0,"À distinguer des patients psychiatriques. Les amphétamines et hallucinogènes peuvent induire des troubles psychiatriques graves. · C04 03 02 · p.25"],
["Which is a task of cabin crew in managing passenger behavior?",["Effective communication, conflict resolution and continuous monitoring","Imposing penalties","Ignoring complaints","Leaving the cabin"],0,"Le PNC veille à ce que chacun se sente en sécurité et à l'aise. · C04 03 03 · p.27"],
["Refusing to fasten a seat belt or to turn off a PED is classed by IATA as:",["Refusal to comply with safety instructions","A medical issue","A service request","Normal behavior"],0,"La liste IATA inclut aussi menaces, agressions verbales ou physiques, harcèlement et comportement bruyant. · C04 03 03 01 · p.28"],
["Airlines should have a 'Zero Tolerance' SOP, which:",["Emphasizes awareness, early detection, intervention and employee training","Ignores minor behavior","Applies only to crew","Is optional"],0,"Elle inclut l'empêchement d'embarquer des passagers problématiques et l'encouragement aux poursuites. · C04 03 03 01 · p.29"],
["ICAO threat level 3 is:",["Life-threatening behavior or display of a weapon","Verbal abuse","Physical abuse","Attempted breach of the flight crew compartment"],0,"Niveau 4 = tentative ou intrusion dans le cockpit. · C04 03 03 01 · p.29"],
["Prevention of unruly incidents starts:",["At the point of origin: check-in, security, boarding gate, boarding observation","Only in flight","Only on landing","Only at the gate"],0,"Le gate surveille l'état d'ivresse, d'anxiété ou d'agitation. · C04 03 03 01 · p.30"],
["Signs of psychoactive substances include:",["Slurred speech, unsteady walk, dilated pupils, erratic behavior","Calm speech","A steady walk","Good humor"],0,"On approche avec prudence, calmement, sans ton accusateur, on limite la consommation et on demande de l'aide. · C04 03 03 02 · p.31"],
["With an aggressive passenger, crew should:",["Stay calm and confident, listen actively, seek support and use diversion","Respond with aggression","Ignore","Show fear"],0,"Les moyens de contrainte sont le dernier recours, et l'on avertit la sûreté à l'atterrissage. · C04 03 03 02 · p.31"],
["Before travel, acceptance of animals in the cabin depends on:",["National and operator procedures, not universal limits","One worldwide rule","No condition","Passenger preference"],0,"On confirme espèce, caisse, poids, documents et frais avant le voyage. · C04 04 01 · p.36"],
["In light turbulence:",["Unsecured objects remain at rest and walking is easy","Passengers are thrown","Walking is impossible","The aircraft is out of control"],0,"En sévère, les passagers sont projetés contre leur ceinture et l'avion peut être momentanément hors de contrôle. · C04 05 01 · p.37"],
["In expected moderate or severe turbulence the cabin crew:",["Stow catering equipment, check baggage, return to their structural seat and fasten belt and harness","Continue service","Open doors","Stand in the aisle"],0,"Ils informent ensuite l'équipage et attendent la permission pour reprendre. · C04 05 01 · p.38"],
["When the fasten seat belt sign stays on very long, crew must:",["Be very vigilant that the instruction is followed","Switch it off","Stop reminding","Ignore"],0,"Le Purser peut aussi prévenir le commandant des turbulences ressenties. · C04 05 02 · p.39"],
["Firefighting equipment checked before flight includes:",["PBE, fire gloves, BCF or halon extinguishers","Life rafts only","Seat belts only","Flashlights only"],0,"Chaque PNC a un PBE, une lampe et un gilet équipage près de son siège. · C04 05 02 02 · p.40"],
["Oxygen bottles are checked for:",["The pressure gauge being in the correct place and a valid date","Color","Weight","Noise"],0,"Elles servent en décompression ou en urgence médicale. · C04 05 02 02 · p.40"],
["First aid kits must be:",["Sealed and unused so all items are available","Opened","Empty","Used for training"],0,"L'AED doit fonctionner (voyant fixe ou clignotant). · C04 05 02 02 · p.41"],
["Safety equipment checks are done before every flight except:",["A turnaround where the same crew stays on the same aircraft","The first flight of the day","Night flights","Flights over water"],0,"Dans ce cas, le contrôle n'est pas refait. · C04 05 02 02 · p.41"],
["Security checks before boarding include:",["A visual inspection of the cabin and overhead compartments for prohibited items or suspicious activity","Checking tickets only","Cleaning","Refuelling"],0,"On vérifie aussi que portes et issues sont correctement sécurisées avant le décollage. · C04 05 02 04 · p.43"],
["Cabin readiness for moving off stand includes:",["Exits clear, lights and signs working, cabin temperature and pressurization set, masks and life vests in place","Serving meals","Opening doors","Cleaning"],0,"Puis une dernière inspection pour s'assurer que tous sont assis. · C04 05 02 05 · p.44"],
["ABPs near exits are valuable because they:",["Act swiftly without crossing a chaotic cabin and can assess external hazards like fire or water","Are comfortable","Serve food","Sell tickets"],0,"Si l'équipage est incapacité, l'ABP voisin de l'issue peut diriger l'évacuation. · C04 06 01 · p.46"],
["Other ABP tasks include:",["Assistance at the bottom of slides, in rafts, and helping passengers with disabilities, children or special needs","Piloting","Serving drinks","Closing doors"],0,"Ils occupent des places définies dans les manuels près des issues. · C04 06 01 · p.47"],
["In a forced landing preparation, the Captain:",["Turns on seat belt sign, calls the purser forward, gives the time available, and can brief passengers directly in extreme emergency","Waits","Leaves the cockpit","Opens doors"],0,"Phrase type : 'HERE IS THE COCKPIT, THE PURSER IS REQUESTED FORWARD'. · C04 06 03 01 · p.51"],
["The purpose of cabin preparation is to:",["Protect passengers, facilitate evacuation and prepare survival equipment","Serve meals","Save fuel","Delay landing"],0,"C'est une action préventive. · C04 06 03 01 · p.51"],
["During the pre-landing cabin check the crew ensure:",["Seatbacks and shelves up, belts tight, no one in washrooms, exits cleared, ABP in position, emergency light armed","Passengers stand","Service","Doors open"],0,"De nuit, on réduit l'éclairage ; en zone isolée, on donne de l'eau si possible. · C04 06 03 01 · p.53"],
["In the standard brace position the person:",["Places head against or close to the surface likely to strike, feet firmly on floor, hands on head or the seat in front","Stands","Lies flat","Covers eyes"],0,"Avec un enfant : on le berce d'un bras qui protège aussi sa tête. · C04 06 03 01 · p.53–54"],
["The silent checklist helps to:",["Mentally prepare and reduce reaction time and surprise in emergencies","Skip steps","Replace training","Save time at boarding"],0,"Elle combine gestes et mémorisation de l'emplacement du matériel. · C04 06 03 02 · p.55"],
["A fire on board:",["Doubles in intensity quickly if not controlled","Dies out","Stays constant","Is harmless"],0,"Un feu de four ou de toilettes mal maîtrisé peut mener à une descente d'urgence puis à une évacuation. · C04 06 03 02 · p.55"],
["In a ditching, massive movement of passengers:",["Compromises the aircraft's attitude","Helps balance","Has no effect","Speeds the landing"],0,"On vérifie aussi la ligne de flottaison avant d'ouvrir une porte. · C04 06 03 02 · p.56"],
["Evacuations can be:",["Predictable (after in-flight incident with preparation) or unpredictable (ground, take-off, landing)","Only predictable","Only unpredictable","Only at night"],0,"Pendant la phase d'alerte, le pilote peut annuler sans évacuer. · C04 06 03 03 · p.58"],
["Passenger confidence in cabin crew is earned by:",["Rigorous demonstrations, clear announcements, uniform, professional attitude and never leaving passengers without information","Staying silent","Avoiding contact","Using jargon"],0,"Sans information, ils se sentent abandonnés et n'obéissent plus. · C04 06 04 · p.60"],
["Nonverbal communication in an evacuation:",["Is as important as verbal; orders are accompanied by firm gestures","Is unimportant","Is forbidden","Is only for ground staff"],0,"La communication avec les secours augmente aussi les chances d'une évacuation efficace. · C04 06 04 · p.61"],
["In unexpected severe turbulence, what must a cabin crew member do first?",["Secure yourself immediately in the nearest suitable seat with the restraint fastened","Finish securing every trolley before sitting","Walk the cabin to check passengers","Call the Purser by phone"],0,"Ta propre protection passe avant tout : on ne retarde jamais l'assise pour finir un contrôle. Chariots, liquides chauds, cafetières et objets mobiles (futurs projectiles) sont sécurisés seulement tant que c'est possible. · C04 05 01 · p.37–38"],
["During severe turbulence, passenger checks are made:",["Only as far as it remains safe, with no cabin walk","By walking the aisles quickly","Only after landing","By all crew at once"],0,"En turbulence sévère, on ne se déplace pas dans la cabine. On donne la consigne courte aux passagers (retourner s'asseoir, ceinture serrée) et on vérifie seulement si c'est sans danger. · C04 05 01 · p.37–38"],
["After severe turbulence, the cabin crew report to the flight crew:",["Whether the cabin is secure or only partly checked, and move again only when authorised","Nothing, unless someone is injured","Only the number of passengers","After landing"],0,"Le rapport doit être précis (cabine sécurisée ou contrôle incomplet). On ne bouge à nouveau qu'avec l'accord du poste de pilotage. · C04 05 01 · p.38"],
["During unexpected severe turbulence, service is:",["Stopped or adapted, and trolleys, hot liquids and loose objects secured while safe","Continued normally","Only stopped in first class","Resumed at once"],0,"On arrête ou adapte le service selon la gravité et on sécurise ce qui peut devenir projectile (chariots, cafetières, liquides chauds), sans retarder sa propre protection. · C04 05 01 · p.38"],
["Continuous fire watch means vigilance for:",["Smoke alarms, unusual odours, heat, haze, noises and electrical or system faults","Only visible flames","Only the oven timer","Only passengers smoking"],0,"On surveille les toilettes, les galleys et la cabine, et on enquête sur le premier indice crédible sans attendre un diagnostic technique. · C04 05 02 · p.39–40"],
["To prevent a galley fire, flammable material such as paper napkins or towels must be:",["Kept away from ovens and other heated equipment","Stored inside the ovens","Left on the oven door","Kept near the extinguisher"],0,"S'ajoutent le contrôle des fours avant le vol, la surveillance fréquente des toilettes et le respect de l'interdiction de fumer. · C04 05 02 · p.39–40"],
["Fire-equipment readiness means knowing:",["The exact location, quantity, accessibility and serviceability of PBE, gloves and extinguishers, and reporting defects before departure","Only where the extinguisher is","Only the PBE colour","Nothing, ground staff check it"],0,"On vérifie scellés et état de marche, et on signale tout équipement manquant ou inutilisable avant le départ. · C04 05 02 02 · p.40–41"],
["On a credible indication of fire or smoke, the sequence is:",["Locate the source, alert cabin and flight crew early, use the approved procedure and equipment, then keep monitoring for re-ignition","Wait to see if it grows","Move passengers first, then alert later","Use the extinguisher without telling anybody"],0,"On protège les passagers et la zone, on utilise la procédure approuvée, puis on surveille et on met à jour jusqu'à ce que le risque soit maîtrisé. · C04 05 02 · p.39–41"],
["Which are criteria for selecting an ABP?",["An adult, physically and mentally capable, without mobility, sensory or cognitive limitation, and with no conflicting responsibility","Any seated passenger","A child with an adult","A passenger with a pet"],0,"Un passager qui s'occupe d'un enfant ou d'un animal a une autre responsabilité et ne peut pas aider. · C04 06 01 · p.46"],
["Besides capability, an ABP must be:",["Willing, motivated and able to understand the crew, ideally in a common language, confirmed by repeat-back or demonstration","Silent","Seated at the back","A frequent flyer"],0,"On vérifie la compréhension : le candidat répète la consigne ou la démontre. · C04 06 01 · p.46–47"],
["Where is an ABP placed?",["At the operator-defined position near the relevant exit, e.g. at the bottom of a usable slide","Anywhere in the cabin","In the galley","Next to the cockpit door"],0,"La position permet d'aider sans délai, par exemple au pied du toboggan ou avec un groupe de passagers précis. · C04 06 01 · p.46–47"],
["An ABP briefing includes:",["One task and position, a trigger, a stopping condition and a teach-back; an exit is opened only after checking outside conditions on crew order or defined crew incapacitation","Free choice of tasks","Opening any exit at once","Leaving the aircraft first"],0,"Une seule tâche claire, la démonstration de l'action sur cet avion, et la vérification de la compréhension. · C04 06 01 · p.47"],
["A rejected take-off is recognised by:",["Abrupt sustained braking or deceleration, a change in engine noise and possible yaw on the runway","A gentle climb","The landing gear retracting","The seat belt sign switching off"],0,"On anticipe aussi un dépassement de piste ou une position anormale de l'avion. · C04 06 02 · p.49"],
["During a rejected take-off the cabin crew:",["Remain secured at the station, face the cabin, listen for cockpit orders and treat it as an alert, not an automatic evacuation","Evacuate at once","Open the doors","Walk to the cockpit"],0,"L'événement déclenche la phase d'alerte : on reste à son poste et on attend les ordres. · C04 06 02 · p.49"],
["From the station, during a rejected take-off, crew assess:",["Fire, smoke, engines and aircraft position, to use or block the assigned exit if an evacuation is ordered","The menu","The passenger count","The fuel quantity"],0,"On observe l'extérieur et la cabine pour choisir les issues utilisables. · C04 06 02 · p.49"],
["Cabin crew act on their own during a rejected take-off only when:",["The aircraft has stopped, engines are shut down, danger is imminent or manifest, and communication or the pilot's capability prevents the normal command","They are bored","A passenger asks","The aircraft slows down"],0,"Sinon on attend les instructions du commandant et on se prépare à une éventuelle évacuation. · C04 06 02 · p.49"],
["In the forced-landing briefing, NITS stands for:",["Nature, Intention, Time, Special instructions (specificities)","Name, Incident, Timing, Security","Notice, Information, Tasks, Safety","Number, Item, Time, Station"],0,"Le commandant donne la situation d'urgence, son intention, le temps disponible et les instructions spécifiques. · C04 06 03 01 · p.51"],
["After the Captain's briefing, the Purser:",["Listens, confirms (reads back), then assigns cabin zones and tasks","Waits for passengers","Starts the evacuation","Calls the ground"],0,"Les deux premières minutes sont déterminantes : les priorités vitales sont organisées tout de suite. · C04 06 03 01 · p.51"],
["To protect passengers before a forced landing, the crew:",["Inform and prepare them psychologically, prohibit unnecessary movement, select and brief ABPs and plan help for children and PRMs","Let them move freely","Give no information","Ask them to leave their seats"],0,"On détecte les signes de panique (positive ou négative) et on organise l'aide pour enfants, PRM, femmes enceintes et personnes âgées. · C04 06 03 01 · p.51–54"],
["Brace and survival readiness before a forced landing include:",["Briefing and verifying the brace, reminding exit locations, preparing post-evacuation equipment and giving water if time allows in an isolated area","Only the brace","Only the life jackets","Nothing else"],0,"Eau, matériel de survie et gilets sont prévus selon le temps disponible, sans passer avant les priorités. · C04 06 03 01 · p.52–54"],
["Which two types of skills does the manual say are needed to react efficiently and quickly in an emergency?",["Technical skills in rapid equipment handling, and human factor skills (synergy, communication, risk management)","Medical and legal skills","Cooking and service skills","Language and marketing skills"],0,"Être efficace, c'est traiter vite l'information, prendre la bonne décision et exécuter correctement. · C04 06 03 02 · p.55"],
["What does the silent checklist do?",["It lets crew mentally rehearse their station (restraint, outside hazards, exit, commands, ABP, equipment within reach), shortening reaction time and surprise","It replaces training","It is read aloud to passengers","It is only for the Purser"],0,"Elle prépare mentalement à l'urgence et réduit le temps de surprise. · C04 06 03 02 · p.55"],
["Which door-use decisions does the manual list?",["Check no external danger before opening, check slide armament, remember the emergency inflation handle, do not confuse the uncoupling and percussion handles, do not hold the handle when opening, check the waterline for ditching","Open at once and hold the handle","Open only on the ground","Always use the nearest door"],0,"Chaque décision d'ouverture est une prise de risque : il faut comprendre la situation avant d'agir. · C04 06 03 02 · p.56"],
["A predictable evacuation follows:",["An in-flight incident (fire, smoke, technical problem) leading to a planned forced landing or ditching, with time for cabin preparation","A sudden take-off event","A rejected take-off with fire","A taxi collision"],0,"À l'inverse, l'évacuation imprévisible résulte d'un événement soudain au sol, au roulage, au décollage ou à l'atterrissage. · C04 06 03 03 · p.57–58"],
["An unpredictable evacuation is:",["A sudden ground, taxi, take-off or landing event with little or no preparation time","An evacuation planned for hours","An evacuation at the gate","Only a ditching"],0,"Exemples : décollage interrompu, feu évident, danger manifeste. · C04 06 03 03 · p.57–58"],
["The alert phase begins with:",["The Captain's 'cabin crew at stations' message and ends with evacuation or cancellation","The seat belt sign","A passenger alarm","Engine start"],0,"Les PNC se sécurisent, évaluent intérieur et extérieur, peuvent briefer un ABP et n'ouvrent pas l'issue prématurément. · C04 06 03 03 · p.57"],
["Who orders an evacuation, and when may cabin crew do it?",["The Captain normally; cabin crew only if danger is manifest and urgent and pilot incapacitation or no communication prevents the command","The Purser always","Any passenger","Ground staff"],0,"Dans ce cas, chaque issue est évaluée avant d'être utilisée. · C04 06 03 03 · p.58"],
["Assertive and reassuring leadership means:",["Showing determination, confidence and authority, staying reassuring and repeating instructions continuously","Staying silent","Shouting different orders each time","Leaving the cabin"],0,"Les passagers ne doivent jamais se sentir abandonnés. · C04 06 04 · p.60"],
["Which commands suit crowd management?",["Positive, very short, loud, rhythmic and repeated, such as 'COME THIS WAY', 'LEAVE EVERYTHING', 'MOVE'","Long negative sentences","Whispered requests","One single announcement"],0,"On dit 'go left' plutôt que 'don't go right'. · C04 06 04 · p.61"],
["Non-verbal direction in an evacuation means:",["Firm arm and hand gestures synchronised with the voice, eye contact, forward posture and an authoritative face, facing the flow","Looking at the floor","Turning your back","Standing still"],0,"Les gestes renforcent l'ordre et restent lisibles dans le bruit. · C04 06 04 · p.61"],
["Directing passengers to exits means:",["Using only usable exits, blocking and redirecting from an unsafe exit, keeping the flow moving without baggage, and sharing exit status with crew and rescue teams","Using any exit","Letting passengers choose","Stopping the flow to collect bags"],0,"Le leadership continue après l'évacuation (regroupement, mise à l'écart). · C04 06 04 · p.61"],
["A pet accepted in the cabin must be:",["Non-dangerous, without strong odour, within the 8 kg limit and accepted by operator and route conditions","Any size","Free in the cabin","Held on the lap"],0,"Il faut d'abord identifier la catégorie : animal de compagnie, chien d'assistance reconnu ou autre animal de soutien. · C04 04 · p.35–36"],
["The carrier for a cabin pet must be:",["Suitable, closed, ventilated and within cabin-baggage dimensions, with health, vaccination, route and quarantine rules checked","Open at the top","Any box","Placed in the aisle"],0,"Les règles dépendent du pays et de l'exploitant. · C04 04 · p.35–36"],
["A cabin pet normally stays:",["In its carrier under the seat in front, never in an overhead locker or the aisle, restrained during take-off, landing and turbulence","On the passenger's lap","In the overhead locker","In the aisle"],0,"Sinon, option soute : conteneur agréé de la compagnie et remise contrôlée. · C04 04 · p.35–36"],
["If cabin conditions for a pet are not met:",["Use the approved hold container with a controlled handover, or refuse the cabin arrangement","Improvise a place","Let the passenger decide","Put it in an exit row"],0,"Aucun animal, caisse ou harnais ne doit gêner l'accès à une issue, une allée ou le matériel de secours. · C04 04 · p.35–36"],
["A recognised assistance dog is:",["Task-trained, travelling with its passenger under advance notification and the operator's procedure, and not subject to the 8 kg pet limit","A pet under 8 kg","Any dog with a prescription","A dog in a carrier"],0,"Il est distingué d'un animal de compagnie. · C04 04 · p.35–36"],
["The course example for a dog too large for a pet carrier is:",["A window seat, harnessed (and muzzled), subject to the actual operator and national procedure","An aisle seat","An exit row","The cargo hold only"],0,"L'EASA n'impose pas de règle universelle sur le siège hublot ou la muselière : c'est l'exploitant et la réglementation nationale qui précisent. · C04 04 · p.35–36"],
["An emotional-support dog with a doctor's prescription:",["Is not automatically a recognised assistance dog and needs explicit operator and destination acceptance and documents","Is always accepted","Always travels in the cabin","Is exempt from rules"],0,"Son statut est séparé de celui du chien d'assistance. · C04 04 · p.35–36"],
["Whatever the animal's status, its position or restraint must not:",["Obstruct an aisle, direct exit access, an escape route, emergency equipment or crew action","Be visible","Be near the window","Be near the owner"],0,"Le passager et l'équipage conviennent de la manière de garder le contrôle. · C04 04 · p.35–36"],
["With a passenger showing a clearly pathological attitude at boarding, airline procedures allow:",["Refusing carriage or disembarking, coordinated with the Captain and ground staff, based on observable behaviour and not a medical diagnosis","Treating them as a patient","Ignoring it","Seating them at an exit"],0,"On reste calme, on protège les autres passagers, on évite la confrontation et on consigne les faits. · C04 03 01 · p.23"],
["Approaching a passenger who drank too much, the crew should be:",["Considerate, friendly and calm, stop further alcohol, isolate or relocate if appropriate, and stay available but authoritative","Aggressive","Silent","Generous with drinks"],0,"On observe les signes réels avant d'agir. · C04 03 01 · p.23"],
["After alcohol is stopped, the crew:",["Notify the Purser and maintain discreet surveillance, escalating proportionately with one coordinated crew response","Hide the problem","Let the passenger roam","Serve water only"],0,"Si la situation monte : informer le poste selon le niveau de menace, prévoir un besoin médical, ne recourir qu'à des mesures autorisées et proportionnées. · C04 03 01 · p.23"],
["With an aggressive passenger on drugs, the crew first:",["Observe aggression, speech, balance, consciousness and breathing, without guessing the substance","Name the drug","Restrain at once","Argue"],0,"On distingue les besoins de sécurité immédiats et médicaux. · C04 03 02 · p.25"],
["De-escalation with a drug-intoxicated passenger means:",["Staying calm, showing no fear, avoiding repressive confrontation, using persuasion as an ally but firm, and informing the Captain early with medical help","Mirroring aggression","Threatening","Ignoring"],0,"Le passager doit sentir un allié ferme, à bonne distance. · C04 03 02 · p.25"],
["Physical restraint is:",["Exceptional and the last authorised resort after conciliatory measures fail; diversion may be considered","The first reaction","Forbidden","Used by passengers"],0,"Aucune contention improvisée. · C04 03 02 · p.25"],
["The ICAO definition of a disruptive passenger is a person who:",["Fails to respect rules of conduct at an airport or aboard an aircraft, or to follow staff or crew instructions, thereby disturbing good order and discipline","Is anxious","Is loud once","Complains"],0,"L'anxiété seule ne suffit pas : il faut l'effet sur l'ordre et la discipline, avec une menace possible pour la sécurité. · C04 03 03 · p.28"],
["Which is an IATA example of unruly behaviour?",["Refusal to comply with safety instructions, such as seat belt, no smoking or PED rules","Asking for water","Reading","Sleeping"],0,"Autres exemples : stupéfiants illégaux, confrontations verbales ou physiques, gêner l'équipage, menaces, abus sexuels ou harcèlement. · C04 03 03 · p.28"],
["Kicking seat backs or banging tray tables is classed as:",["Other riotous behaviour","A safety instruction refusal","A medical issue","An uncooperative boarding"],0,"Avec crier ou les comportements gênants répétés. · C04 03 03 · p.28"],
["A company policy on unruly passengers starts with:",["A preventive SOP, awareness, staff education and a zero-tolerance approach","Only punishment","Nothing","Passenger surveys"],0,"On prévient par la détection précoce et l'éducation du personnel. · C04 03 03 · p.29–30"],
["Early detection must cover:",["The whole journey from check-in and security to the gate, boarding and flight, including monitoring groups and preventing unsuitable passengers from boarding","Only the flight","Only the gate","Only check-in"],0,"Les informations sont partagées entre les équipes. · C04 03 03 · p.29–30"],
["Intervention procedures include:",["Clear warnings, stopping alcohol, defusing levels 1–2, crew and Captain coordination, and restraint only after conciliatory approaches fail","Immediate restraint","Ignoring level 1","Public humiliation"],0,"Avertissement verbal ou carte d'avertissement. · C04 03 03 · p.29–30"],
["Employee support in the policy includes:",["Empowering and supporting crew, conflict and aftermath training, lawful follow-up, and full incident documentation with witness statements","Blaming crew","No training","No records"],0,"La trace factuelle est indispensable. · C04 03 03 · p.29–30"],
["The operator must ensure weight and balance stay:",["Within the CG limits of the approved flight manual, or the operations manual if more restrictive, in all operations and flight phases","Within any limits","Only at take-off","Only in cruise"],0,"Cela passe par un load sheet fidèle à la réalité. · C04 01 01 · p.7"],
["The load sheet distribution must:",["Match the passengers' actual positions in the cabin","Be approximate","Be ignored","Be changed by passengers"],0,"Les PNC veillent à ce que chacun occupe son siège attribué. · C04 01 01 · p.7"],
["An apparently empty seat is:",["Not automatically available to passengers","Free to use","Reserved for crew","Always for children"],0,"Tout changement important est signalé au commandant pour corriger le load sheet. · C04 01 01 · p.7"],
["For a PRM, the individual safety briefing covers:",["Seat belt, oxygen mask, life jacket, nearest suitable exit and crew assistance, adapted to be understood and checked","Only the seat belt","Nothing","A written leaflet only"],0,"Le briefing est adapté et on vérifie la compréhension. · C04 01 02 · p.11–12"],
["Assistance to PRMs is planned:",["From boarding to disembarkation according to the passenger's actual mobility and needs (WCHR, WCHS, WCHC)","Only at the gate","Only in an emergency","By the passenger alone"],0,"Le code seul ne décrit pas les besoins réels. · C04 01 02 · p.9–15"],
["The PRM emergency plan includes:",["Evacuation without blocking the main flow, mobility aids possibly left behind, and capable passengers or companions given defined assistance tasks","Carrying everything out","Leaving them last in the aisle","No plan"],0,"L'équipage reste informé de la situation. · C04 01 02 · p.9–15"],
["Cabin surveillance is:",["A structured scan of passengers, bins, equipment, aisles and exits, galleys, lavatories and the cabin environment","An automatic walk-through","Only a seat belt check","A ground task"],0,"Elle change avec chaque phase de vol. · C04 01 03 · p.17–18"],
["Before taxi, take-off and landing the crew verify:",["Clear aisles and exits, secured baggage, suitable exit-row occupants and accessible emergency equipment","Only the menu","Only the doors","Only the lights"],0,"La surveillance continue en croisière et au débarquement. · C04 01 03 · p.17–18"],
["A surveillance finding is reported with:",["Exact location, observable facts, immediate risk, action taken and updates, through the crew chain to the flight deck","A rumour","Only 'something is wrong'","Nothing until landing"],0,"Boucle fermée : le poste de pilotage et la cabine coordonnent la réponse. · C04 01 03 · p.17–18"]
]},
{n:"C05 – Aero-medical & first aid",s:"PDF p.7–105",q:[
["In-flight medical emergencies are broadly divided into:",["Injury-related and health-related situations","Minor and major only","Crew and passenger only","Ground and flight only"],0,"Blessures : turbulences, chute de bagages, brûlures par liquides chauds ou fours. Problèmes de santé : malaise, allergie, AVC, infarctus, décès. · C05 01 · p.7"],
["The first flight attendant at the scene of a medical emergency normally:",["Takes charge of the patient, alerts the other crew and advises the Captain","Waits for a doctor","Leaves to find the purser","Calls ground staff"],0,"Il garde le patient, demande de l'aide pour le matériel d'urgence et informe le commandant des changements d'état. · C05 01 · p.7"],
["For anything other than a very minor complaint, the Purser:",["Makes a PA announcement asking for a doctor or other medical professional","Moves the patient","Asks the patient to leave","Ignores it"],0,"En l'absence de médecin, beaucoup de compagnies ont un contrat avec un service médical (type MedLink) joignable par radio, satellite ou ACARS. · C05 01 · p.8"],
["Who decides whether to continue to the destination or divert in a medical emergency?",["The Captain","The doctor","The purser","The airline's catering"],0,"Il s'appuie sur les informations du PNC, du médecin à bord ou du service médical. Le choix tient compte de l'urgence médicale, de l'exploitation et du commercial. · C05 01 · p.8–9"],
["The atmosphere contains approximately what % of oxygen at all heights?",["21%","50%","10%","78%"],0,"C'est la pression partielle qui chute avec l'altitude, pas le pourcentage. La cabine est pressurisée à l'équivalent de 8 000 ft maximum. · C05 02 02 · p.11"],
["Signs of sudden decompression include:",["A loud bang, flying debris and unsecured items ejected near the breach","A warm breeze","Silence","Slow noise"],0,"Une fuite lente laisse au pilote le temps de descendre d'urgence vers 8 000–10 000 ft. · C05 02 02 · p.12"],
["The Eustachian tube equalizes ear pressure when you:",["Swallow or yawn","Hold your breath","Cough","Lie down"],0,"Le barotraumatisme de l'oreille vient d'un déséquilibre de pression entre l'oreille moyenne et la cabine, surtout en montée et en descente. · C05 02 03 · p.13–14"],
["Airsickness is caused by:",["Conflicting messages to the central nervous system (inner ear, eyes, muscles)","Only dehydration","Only altitude","Cabin pressure only"],0,"Elle est plus fréquente chez les femmes (règles, grossesse), les jeunes enfants et ceux sensibles à d'autres formes de mal des transports. · C05 03 01 · p.17–18"],
["Signs of SEVERE abdominal pain include:",["Signs of shock, a hard belly and high fever","A mild ache","Hiccups","A full stomach"],0,"Péritonite : choc, douleur diffuse, ventre dur, fièvre 40 °C. Appendicite : douleur permanente fosse iliaque droite. · C05 03 02 · p.20"],
["For severe abdominal pain the cabin crew:",["Do not give food or drink, install an analgesic position, inform the captain, give oxygen","Give a large meal","Make them walk","Give coffee"],0,"Position antalgique : souvent sur le côté ou tête basse, jambes relevées ; possible vessie de glace ; appel d'un médecin et surveillance des constantes. · C05 03 02 · p.21"],
["For hyperventilation the crew should NOT:",["Give oxygen","Reassure","Leave the passenger half-seated","Speak to them"],0,"On fait respirer dans un sac en papier ou un sac de vomissement pour récupérer le CO2, mais avec prudence : asthme ou infarctus peuvent être confondus et la méthode peut être dangereuse. · C05 03 03 · p.23–24"],
["Tetany is characterized by:",["Tingling of fingers, feet and mouth, and muscle contraction especially of the hands","Fever","A rash","Bleeding"],0,"Elle suit une hyperventilation liée à l'anxiété : la baisse de CO2 provoque des contractions musculaires. · C05 03 03 · p.24"],
["The severity of a burn depends on:",["Extent, depth, location and age of the victim","Only the cause","Only the color","Only the time"],0,"Localisations les plus graves : visage, organes génitaux, fesses, articulations. Les âges extrêmes sont plus fragiles. · C05 03 04 · p.25"],
["A third-degree burn may be painless because:",["Nerve damage is extensive","The skin is thick","It is minor","It is cold"],0,"C'est le plus grave (blanc cireux, carbonisé, cuir). Ne pas croire qu'il est forcément le plus douloureux. · C05 03 04 · p.26"],
["Wallace rule of nines: the head represents:",["9% in adults and 18% in children","18% in adults","1% in adults","9% in children"],0,"Chaque bras 9 %, thorax 9 %, abdomen 9 %, dos 18 %, chaque jambe 18 % chez l'adulte (13,5 % chez l'enfant), périnée 1 %. · C05 03 04 · p.27"],
["First-degree burn: first aid includes:",["Cooling with water for 10 to 15 minutes","Piercing blisters","Applying butter","Rubbing it"],0,"Puis pansement occlusif, antalgique, surveillance locale et rapport. · C05 03 04 · p.28"],
["With second-degree burn blisters:",["Be careful not to pierce them","Pierce them","Remove them","Rub them"],0,"Refroidir environ 10 min, déshabiller, pansement occlusif. Si brûlure étendue : risque de choc hypovolémique et possible déroutement. · C05 03 04 · p.28"],
["For a chemical burn the crew:",["Remove clothing promptly and rinse for 10 to 15 minutes; do NOT induce vomiting for ingestion","Leave the clothes","Rub it","Induce vomiting"],0,"Puis pansement stérile, surveillance et information du commandant. · C05 03 04 · p.28"],
["With an electric burn, first:",["Make sure the power is turned off before touching the victim","Touch the victim","Cool with water","Give a drink"],0,"Les lésions profondes peuvent toucher cœur, reins et muscles : risque d'arrêt cardiorespiratoire, d'où surveillance et RCP si besoin. · C05 03 04 · p.28"],
["For an open wound, minor bleeding is controlled by:",["Gentle continuous pressure for 20 to 30 minutes with gloves on","Washing it first","Rubbing","Ignoring"],0,"Gants d'abord, puis nettoyer du centre vers l'extérieur, couvrir avec un pansement, et rédiger un rapport. · C05 03 05 · p.30–31"],

const DESC={
"In straight and level flight at constant speed, the aircraft is in equilibrium":"Les 4 forces s'équilibrent deux à deux : la poussée (Thrust, vers l'avant) compense la traînée (Drag, qui freine) et la portance (Lift, vers le haut) compense le poids (Weight, vers le bas). Piège : Thrust > Drag signifierait que l'avion accélère, donc pas d'équilibre.",
"What share of total lift":"La portance vient surtout de la dépression au-dessus de l'aile : 75 %. Les 25 % restants viennent de l'impact de l'air sous l'aile. À retenir : 3/4 dessus, 1/4 dessous.",
"Which surface controls roll":"Trois axes, trois gouvernes : ailerons = roulis (axe longitudinal, nez-queue) ; elevators = tangage (axe latéral, bout d'aile à bout d'aile) ; rudder = lacet (axe vertical). Les ailerons travaillent en opposition, les elevators ensemble.",
"The rudder moves the aircraft":"Le rudder, articulé à l'arrière de la dérive (vertical stabilizer), fait pivoter le nez de gauche à droite : c'est le lacet (yaw) autour de l'axe vertical. Ne le confonds pas avec les ailerons (roulis) ni les elevators (tangage).",
"Plates on the upper wing surface":"Les spoilers sont des plaques sur le dessus de l'aile qui se relèvent dans le flux d'air pour le perturber et freiner. Slats = bord d'attaque, flaps = bord de fuite (augmentent la portance), trims = petites surfaces sur le bord de fuite d'une grande gouverne.",
"Slats are located on the":"Slats = bord d'attaque (leading edge, à l'avant de l'aile) : sortis, ils permettent à l'aile de voler à plus forte incidence. Mnémo : Slats à l'avant, Flaps à l'arrière.",
"The Protective Breathing Equipment":"Le PBE est une cagoule anti-fumée autonome en circuit fermé : l'oxygène arrive automatiquement dès qu'on l'enfile et le CO2 expiré est neutralisé par une cartouche de chaux sodée. Durée garantie : 15 minutes.",
"How is oxygen produced by most":"Pour les passagers, l'oxygène vient d'un générateur chimique (PSU) : tirer le masque retire une goupille de percussion qui lance une réaction chimique produisant de l'oxygène. Ce ne sont pas des bouteilles dans les sièges ni de l'air des moteurs.",
"Standard atmosphere at sea level":"Atmosphère standard au niveau de la mer : 1013,25 hPa et 15 °C. Ensuite -2 °C par 1000 ft (6,5 °C par 1000 m), jusqu'à -56,5 °C minimum. La pression ne baisse pas linéairement car l'air est compressible.",
"As altitude increases, gas in a closed space":"Loi de Boyle : la pression baisse avec l'altitude, donc le volume d'un gaz enfermé augmente (jusqu'à +20 % à 8 000 ft dans le corps humain). Exemple du manuel : un ballon de 1 L au sol fait 4 L à 35 000 ft.",
"Middle-level clouds form between":"Trois étages : hauts > 20 000 ft (cirro/cirrus, cristaux de glace) ; moyens 6 500–20 000 ft (préfixe alto) ; bas < 6 500 ft (stratus). Les nuages à développement vertical portent le mot cumulus (le Cb en fait partie).",
"Which is NOT required for Cb formation":"Un Cb se forme avec : une couche épaisse d'air instable, de l'air chaud et humide, et un déclencheur (chauffage du sol, relief, front). Un air stable, froid et sec est l'inverse de ces conditions.",
"Clear Air Turbulence mostly occurs":"La CAT survient hors des nuages (donc invisible), au-dessus de 15 000 ft, à cause des forts cisaillements de vent dans le jet stream (vents d'ouest en est). Ne la confonds pas avec la turbulence de Cb ou de montagne.",
"Wingtip vortices can persist":"Les tourbillons de bout d'aile sont stables et durent jusqu'à 3 minutes après le passage de l'avion. Le jetwash (gaz d'échappement) est très turbulent mais très bref.",
"Volcanic ash in the engines":"Les cendres sont avalées par les réacteurs, fondent puis se collent aux composants internes : risque de panne moteur. Elles abîment aussi le pare-brise. Cas cité : KLM 867 (1989, Mont Redoubt), quatre moteurs perdus.",
"De-icing fluid protection time":"Le liquide (glycol + eau, avec colorant) protège de 2 minutes à 2 heures selon le liquide, la température et la météo. Le dégivrage se fait à la porte, après repoussage sur l'aire, ou sur une zone dédiée.",
"Cabin crew training on surface contamination":"Le PNC n'applique pas le liquide et ne décide pas du décollage : il doit connaître les effets de la contamination des surfaces et signaler au pilote toute observation (glace ou givre visible depuis un hublot).",
"'Wilco' means":"Roger = reçu/compris ; Wilco (will comply) = je vais l'exécuter. Affirmative = oui ; Negative = non ; Standby = attendez. Roger ne dit pas qu'on va agir, juste qu'on a reçu.",
"'PAN-PAN' indicates":"PAN-PAN = urgence mais pas de danger vital immédiat (problème avec l'avion ou ses occupants). MAYDAY = détresse, danger de mort. Les deux se disent trois fois.",
"'MAYDAY' is":"MAYDAY est l'appel de détresse international (danger de mort), dit trois fois, et il passe avant tous les autres messages. PAN PAN signale une urgence moins grave.",
"Unexpected turbulence without the seat belt sign on":"Si on ressent des turbulences alors que le signal ceinture n'est pas allumé, c'est le Purser qui informe le poste de pilotage. Phrase type : 'Here's the cockpit, cabin crew turbulence'.",
"Which message has the highest priority":"Ordre de priorité : distress (mayday) > emergency (pan pan) > messages ATC (clearances) > informations de vol > messages compagnie-équipage (ACARS).",
"A PA system is required if":"Chiffres à retenir : PA obligatoire au-delà de 19 sièges ; mégaphones au-delà de 60 sièges (1 pour 61–99 sièges, 2 à partir de 100, par pont) ; PA utilisable en 10 secondes maximum.",
"Portable megaphones are required above":"Mégaphones : au-delà de 60 sièges. Ne confonds pas avec le PA, obligatoire au-delà de 19 sièges.",
"Megaphones required for 100+":"Par pont passagers : 61 à 99 sièges = 1 mégaphone ; 100 sièges et plus = 2.",
"The three types of passenger announcements":"Commerciales (bienvenue, progression, services), opérations normales (embarquement, décollage, descente) et urgence (turbulence, descente d'urgence, évacuation, urgence médicale).",
"An occurrence report differs":"Incident report = événement qui pourrait menacer la sécurité sans blessure ni dommage important (urgence médicale, passager perturbateur, panne). Occurrence report = événement plus grave avec blessure ou dommage (accident, feu, forte turbulence), pour chercher les causes racines.",
"'INOP' on the tech log":"INOP = inoperative : un système ou une pièce ne fonctionne pas comme prévu. Le commandant signe le tech log et l'avion peut partir si le défaut est réparé ou toléré par la MEL.",
"Gesture 'Recommend stop'":"Gestes avec les pompiers : stop = bras croisés aux poignets devant la tête ; feu = main droite en éventail de l'épaule au genou et main gauche qui pointe le feu ; emergency contained = bras à 45° qui se croisent sous la taille ; recommend evacuation = bras horizontal, main levée, mouvement d'appel vers l'arrière. De nuit : pareil avec des bâtons lumineux.",
"Which is NOT a reason cabin crew hesitate":"Trois raisons de réticence à parler au cockpit : doute sur l'importance de l'information, peur d'être remis à sa place ou renvoyé, crainte de violer la règle du sterile cockpit. D'où l'intérêt du CRM.",
"Below 29,000 ft, minimum vertical separation":"Séparation verticale minimale : 1 000 ft en dessous de 29 000 ft ; 2 000 ft (600 m) au-dessus, sauf en espace RVSM.",
"INCERFA is the":"Trois phases SAR, de la moins grave à la plus grave : INCERFA (incertitude), ALERFA (alerte), DETRESFA (détresse). ALERFA est le deuxième niveau, pas le premier.",
"Minimum age for a cabin crew attestation":"CC.GEN.020 : 18 ans minimum. L'attestation est de durée illimitée mais devient invalide si les privilèges ne sont pas exercés pendant 60 mois sur un type d'avion.",
"Cabin crew medical checks are required":"Contrôle médical avant de commencer, puis tous les 5 ans (MED.C.005(b)), uniquement par des professionnels qualifiés. Après chaque contrôle, un rapport médical est remis à la compagnie.",
"A passenger is considered an adult":"Adulte dès 12 ans ; enfant de 2 à 12 ans ; bébé (infant) avant 2 ans. Un siège ne peut être occupé que par une personne, sauf un adulte avec un bébé.",
"Exit row seats may be occupied by":"Un ABP est un passager valide, assez fort et apte à aider à l'évacuation. Interdits en rangée d'issue : enfants de moins de 12 ans, PMR, passagers ne comprenant pas les instructions, personnes avec animaux, personnes escortées.",
"A refuelling 'clear area'":"Une zone dégagée fait au moins 4 x 11 m. L'escape route minimale peut être : un moyen d'embarquement + une zone, deux moyens, ou deux zones (portes fermées seulement).",
"The sterile cockpit threshold":"Sterile cockpit : sous FL100 (10 000 ft) en montée comme en descente, pas de communications ni d'activités non essentielles. Le PNC ne contacte le cockpit que pour une urgence de sécurité.",
"Alcohol: crew should not drink":"Pas d'alcool moins de 8 h avant la prise de service ; taux ≤ 0,2 pour mille en début de service ; aucun alcool pendant le service ni en astreinte. Après un don de sang ou une plongée, attendre au moins 24 h.",
"The maximum basic daily FDP":"FDP de base : 13 h, réduit de 30 min par secteur à partir du 3e (2 h de réduction maximum). Équipage renforcé : 16 h (4 atterrissages max) ; double équipage : 18 h (6 atterrissages max).",
"The reporting time before the first off-block":"Présentation 60 min avant le premier off-block, 90 min s'il y a un secteur ETOPS. Les 30 min de tâches après vol comptent dans le FDP.",
"Rest before an FDP":"Repos avant un FDP : au moins la durée du service précédent ou 12 h à la base (10 h hors base), la plus longue des deux.",
"Cumulative duty hours must not exceed 60":"Limites cumulées : 60 h en 7 jours, 190 h en 28 jours, 1800 h en 12 mois (2000 h pour ceux avec une part importante de travail de bureau).",
"Signs of rapid decompression":"Décompression rapide : bruit fort, froid intense, débris, brouillard dense (condensation, qui peut déclencher les détecteurs de fumée). Réaction du PNC : masque le plus proche, le mettre de façon démonstrative, s'asseoir.",
"The evacuation command is":"Le commandant ordonne 'EVACUATE' trois fois et active le signal d'évacuation. Si rien ne vient du cockpit mais que l'évacuation est évidente, le Purser la déclenche. 'Remain seated' signifie le contraire."
};
const dsc=t=>{for(const k in DESC)if(t.startsWith(k))return DESC[k];return''};
const LET="ABCD",K="ccaquiz.v2";

const $=id=>document.getElementById(id),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ref=e=>{const m=e.match(/^(.*) · (C0\d [\d ]*\d) · (p\.[^·]+)$/);return m?{t:m[1],r:m[2]+" · "+m[3]}:{t:e,r:""}};
let cp=0,Q=null,len=25,used=P.map(()=>new Set());
const mk=i=>{const q=P[cp].q[i];return{i,q:q[0],o:sh(q[1].map((t,j)=>({t,c:j==q[2]}))),e:q[3],d:dsc(q[0])}};
function home(){Q=null;const tot=P.reduce((a,p)=>a+p.q.length,0);
$("app").innerHTML=`<p class="mu" style="margin:0 0 12px">${tot} questions réparties en ${P.length} manuels. Choisis un manuel pour commencer.</p><div class="grid">`+P.map((p,i)=>{const s=ST[i]||{},c=p.n.split(" – ");return `<button class="pass" onclick="setup(${i})"><div class="main"><div class="code">${c[0]}</div><div class="name">${c[1]||""}</div><div class="meta">${p.q.length} questions · ${p.s}</div></div><div class="stub"><b>${used[i].size}</b><span>tirées</span></div></button>`}).join("")+`</div>`;scrollTo(0,0)}
function setup(i){if(i!=null)cp=i;Q=null;const p=P[cp],n=p.q.length,s=ST[cp]||{},u=used[cp].size,k=Math.min(len,n);
$("app").innerHTML=`<button class="back" onclick="home()">‹ Tous les manuels</button><section class="card" style="margin-top:0"><h2>${p.n}</h2><p class="mu" style="margin:0">${p.s}</p><div class="facts"><div><b>${n}</b><span>questions</span></div><div><b>${u}</b><span>déjà tirées</span></div><div><b>${s.best!=null?s.best+"%":"–"}</b><span>meilleur score</span></div><div><b>${s.plays||0}</b><span>quiz terminés</span></div></div><div class="lbl">Nombre de questions</div><div class="seg">${[10,25,50].map(v=>`<button class="${v==len?"on":""}" onclick="len=${v};setup()">${v}</button>`).join("")}</div><button class="btn" onclick="start()">Lancer le quiz (${k} questions)</button>${u?`<button class="btn ghost" onclick="used[cp].clear();setup()">Remettre toutes les questions en jeu</button>`:""}</section>`;scrollTo(0,0)}
function start(ids){const p=P[cp];let l;if(ids)l=ids;else{let pool=p.q.map((_,i)=>i).filter(i=>!used[cp].has(i));const k=Math.min(len,p.q.length);if(pool.length<k){used[cp].clear();pool=p.q.map((_,i)=>i)}l=sh(pool).slice(0,k);l.forEach(i=>used[cp].add(i))}
Q={l:l.map(mk),i:0,s:0,a:null,w:[],done:false};show()}

document.querySelector(".nextbar").scrollIntoView({block:"nearest",behavior:"smooth"})}
function nx(){Q.a=null;Q.i++;Q.i<Q.l.length?show():fin()}
function quit(){if($("dlg"))return;const d=document.createElement("div");d.id="dlg";d.className="dlg";d.innerHTML='<div class="box" role="alertdialog" aria-label="Quitter le quiz"><h3>Quitter ce quiz ?</h3><p class="mu">Ta progression sera perdue.</p><button class="btn" onclick="closeDlg()">Continuer le quiz</button><button class="btn ghost" onclick="closeDlg();setup()">Quitter</button></div>';document.body.appendChild(d)}
function closeDlg(){const d=$("dlg");if(d)d.remove()}
function fin(){Q.done=true;const n=Q.l.length,pc=Math.round(Q.s/n*100),s=ST[cp]||{best:null,plays:0};s.plays++;if(s.best==null||pc>s.best)s.best=pc;ST[cp]=s;save();
const msg=pc>=90?"Excellent":pc>=75?"Très bien":pc>=50?"Pas mal, continue":"À retravailler",C=2*Math.PI*52;
$("app").innerHTML=`<section class="card res" style="margin-top:4px"><svg viewBox="0 0 120 120" class="ring" role="img" aria-label="${pc}%"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="val" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/><text x="60" y="68" text-anchor="middle">${pc}%</text></svg><h2>${Q.s} sur ${n}</h2><p class="mu">${msg} · ${P[cp].n}</p><button class="btn" onclick="start()">Nouveau quiz avec d'autres questions</button>${Q.w.length?`<button class="btn alt" onclick="start(Q.w.map(w=>w.i))">Refaire mes ${Q.w.length} erreurs</button>`:""}<button class="btn ghost" onclick="setup()">Retour au manuel</button></section>`+(Q.w.length?`<section class="card"><h3>À revoir (${Q.w.length})</h3>`+Q.w.map(w=>{const r=ref(w.e);return `<details class="rv"><summary>${w.q}</summary><p>Ta réponse : <s>${w.m}</s></p><p>Bonne réponse : <b>${w.g}</b></p><p>${r.t}</p>${w.d?`<p class="tip">💡 ${w.d}</p>`:""}${r.r?`<span class="src">${r.r}</span>`:""}</details>`}).join("")+`</section>`:"");scrollTo(0,0)}
addEventListener("keydown",e=>{if(!Q||Q.done||$("dlg"))return;if(Q.a===null){const k="1234abcd".indexOf(e.key.toLowerCase());if(k>=0&&k%4<Q.l[Q.i].o.length)ans(k%4)}else if(e.key=="Enter"||e.key==" "){e.preventDefault();nx()}});
home();
