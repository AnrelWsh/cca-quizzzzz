["Privileges of a valid attestation:",["May be exercised only while Part-CC conditions are met, and stop if suspended, revoked or invalid (e.g. 60 months without exercising)","May be exercised without a medical, if training and the exam are valid, and stop only if revoked","Apply on any aircraft type for life and stop only after 60 months without a medical","May be exercised while Part-CC conditions are met, and stop only after the attestation is revoked"],0,"Il faut aussi tenir à jour les enregistrements de formation et de contrôle. · C01 02 01 05 · p.87–90"],
["A Flight Information Region is:",["A defined portion of airspace assigned to a controlling authority responsible for air traffic services","A defined airport zone assigned to airport authorities responsible for runway maintenance","A published airline route assigned to a single operator for flight planning and fuel management","A portion of airspace assigned to meteorological offices responsible for weather forecasts only"],0,"Elle peut couvrir terre ou océan et varier en taille. · C01 02 01 04 · p.79–80"],
["Within an FIR, services include:",["Flight information, alerting and, where applicable, air traffic control and coordination","Weather forecasts, ticketing and, where applicable, airport slot coordination","Flight information, aircraft maintenance and, where applicable, airport ground handling","Alerting, fuel supply and, where applicable, baggage and passenger handling"],0,"L'alerte déclenche si besoin les recherches et le sauvetage. · C01 02 01 04 · p.79–80","Aircraft flying in uncontrolled airspace are not mandated to take air traffic control services but can call on them if and when required (e.g. flight information, alerting and distress services). (p.80)"],
["An FIR can be split vertically into:",["A lower FIR and an Upper Information Region (UIR)","A higher FIR and an Upper Information Region (UIR)","Two FIRs of equal size","A SID and a STAR"],0,"La classification de l'espace donne le statut contrôlé ou non. · C01 02 01 04 · p.80–81","The lower section remains referred to as a FIR, but the upper portion is referred to as an Upper Information Region (or UIR). (p.80)"],
["In controlled airspace:",["ATC clearances and instructions apply; in uncontrolled airspace they are not required, but information and alerting remain available","ATC clearances are optional, and in uncontrolled airspace pilots must request them before entering","ATC instructions apply in both, but in uncontrolled airspace separation is guaranteed by ATC","Pilots decide alone, and ATC services are provided only on request in controlled airspace"],0,"La séparation est assurée par les contrôleurs en espace contrôlé. · C01 02 01 04 · p.80–81"],
["A flight plan includes:",["Aircraft identification, departure, destination, time, route, flight level, flight rules, flight type, aircraft type and wake category, and equipment","Aircraft identification, passengers' names, number on board, fuel price, route and catering requirements","Departure, destination, crew roster, route, flight level and the weight of the cargo","Aircraft identification, departure, destination, the airline's route charges, meals and the passengers' seat numbers"],0,"Elle donne aux unités ATS les données de l'intention de vol. · C01 02 01 04 · p.82","It includes information like: - Aircraft identification - Departure airport, destination, time, route, Flight level, etc… - Flight rules (IFR or VFR flights) - Type of flight (eg General or military) - Number, type of aircraft and wake turbulence category - Equipment and capacity (p.82)"],
["Flight-plan accuracy matters because:",["It supports safe separation, routing and controller decisions, and changes must be passed on","It supports safe separation, routing and controller decisions, and changes must not be passed on","Only for paperwork","Only for military"],0,"Une donnée obsolète nuit à la sécurité. · C01 02 01 04 · p.82"],
["Flight-plan information also supports:",["Coordination and handovers between ATS units, and alerting or SAR if the flight becomes overdue","Weather forecasts for the destination and the ticket pricing, with no role in alerting or SAR","Crew scheduling and airport slot payments, but not coordination between ATS units","Fuel price negotiation and passenger meal planning, without the handover between ATS units"],0,"C'est son rôle de coordination et d'alerte. · C01 02 01 04 · p.82"],
["INCERFA is the phase of:",["Uncertainty about safety, e.g. missing communication or overdue arrival","Grave and imminent danger, e.g. insufficient fuel or a forced landing","Rescue completed, e.g. the aircraft has been located","Search ended, e.g. the aircraft has landed safely"],0,"Elle précède l'alerte puis la détresse. · C01 02 01 03 · p.77"],
["ALERFA is the phase of:",["Apprehension about safety, e.g. continued failed contact, failure to land after clearance, impaired operation or unlawful interference","Uncertainty about safety, e.g. no communication within the expected time or an overdue arrival","Grave and imminent danger, e.g. insufficient fuel, an expected forced landing or a MAYDAY message","Confirmation that the aircraft has landed safely, e.g. contact re-established after a delay"],0,"Elle est plus grave que l'incertitude. · C01 02 01 03 · p.77"],
["DETRESFA is the phase of:",["Grave and imminent danger requiring immediate assistance, e.g. insufficient fuel, expected forced landing or a MAYDAY","Grave and imminent danger requiring immediate assistance, e.g. insufficient fuel, expected forced take-off or a MAYDAY","Search planning","Light concern"],0,"C'est le niveau le plus grave. · C01 02 01 03 · p.77"],
["PAN PAN and MAYDAY differ because:",["PAN PAN signals urgency without immediate assistance; MAYDAY signals grave and imminent danger needing immediate assistance; both repeated three times","PAN PAN signals grave and imminent danger needing immediate assistance; MAYDAY signals urgency without immediate assistance","PAN PAN is said once and MAYDAY three times, but both signal the same level of danger","PAN PAN signals grave danger and is repeated three times; MAYDAY signals urgency and is said only once"],0,"La phraséologie standard communique gravité et priorité sans ambiguïté. · C01 02 01 03 · p.77"],
["Standard distress phraseology matters because it:",["Prompts the right ATS and SAR response and rapid coordination","Prompts the left ATS and SAR response and rapid coordination","Replaces the radio","Is only for pilots"],0,"MAYDAY est une preuve directe de détresse. · C01 02 01 03 · p.77–78"],
["IATA is:",["An international airline industry association coordinating common commercial and financial processes and standards","An international association of States coordinating air navigation and safety rules","An international body of airports coordinating runway slots and security standards","A regional association of air traffic controllers coordinating airspace and clearances"],0,"Elle réduit le nombre d'accords bilatéraux nécessaires. · C01 02 01 01 · p.73"],
["BSP and CASS are:",["IATA settlement systems: BSP for airline–travel-agent invoicing, CASS for airline–freight-agent settlement","ICAO systems for sharing airspace information, BSP for air traffic services and CASS for search and rescue","IATA reservation systems, BSP for seat allocation and CASS for baggage tracing","EASA certification schemes, BSP for aircraft maintenance and CASS for crew attestations"],0,"Ils simplifient la facturation entre compagnies et agents. · C01 02 01 01 · p.73","The main activity of IATA is the simplification of invoicing between airlines and travel agents (BSP), or freight forwarders/agents (CASS). (p.73)"],
["ICAO's implementation support includes:",["Coordinating global plans, assistance and capacity building, monitoring performance and auditing State oversight","Coordinating airline fares, assisting States with ticketing and monitoring route performance","Developing aircraft, assisting airports with funding and auditing airline safety management","Coordinating global plans for States, monitoring traffic volumes and auditing airline safety management"],0,"Objectifs : une aviation sûre, sécurisée, efficace, durable et responsable pour l'environnement. · C01 02 01 02 · p.75–76"],
["Aircraft type specific and operator conversion training must be completed before a cabin crew member is:",["First assigned to operate, or assigned to another aircraft type","Allowed to work night flights on the same aircraft type","Promoted to Purser, on any aircraft type","Given a first recurrent training, on the same aircraft type"],0,"ORO.CC.125(a) : formation spécifique au type et conversion compagnie, avec les contrôles associés. · C01 04 01 · p.129","(1) first assigned by the operator to operate as a cabin crew member; or (2) assigned by that operator to operate on another aircraft type. (p.129)"],
["Aircraft type specific training must involve:",["Training and practice on a representative training device or on the actual aircraft","Training on a representative training device only, since practice on the actual aircraft is not allowed","Classroom training and video demonstrations, with practice left to the first line flights","Practice on the actual aircraft, but only for pursers, with other crew trained in classroom"],0,"ORO.CC.125(c)(1). · C01 04 01 · p.129","(1) involve training and practice on a representative training device or on the actual aircraft; and (2) cover at least the following aircraft type specific training elements: (p.129)"],
["Which element is part of the aircraft type specific training?",["Operation and actual opening by each crew member of each type of normal and emergency door and exit, in normal and emergency modes","Watching a trainer open doors and exits in normal mode, with emergency mode covered in theory","Opening only the main passenger doors by each crew member, with other exits shown on slides","Operation of the doors by the Purser only, and by other crew only if they are assigned to that exit"],0,"S'y ajoutent description de l'avion, équipements de sécurité, autres issues dont les fenêtres du cockpit, équipements anti-feu et fumée, toboggans et équipement lié à l'incapacité d'un pilote. · C01 04 01 · p.129"],
["Differences training is required before assignment to:",["A variant of an aircraft type, or a type with different safety equipment, equipment locations or normal and emergency procedures","A new airport with a longer runway or a different arrival procedure, whatever the equipment","A new company uniform, new cabin layout names or a new catering supplier","A different cabin class configuration only, even if equipment and procedures are identical"],0,"ORO.CC.130 : on compare avec la formation déjà suivie. · C01 04 01 · p.134"],
["Familiarisation flights for a new entrant are performed:",["In addition to the minimum number of cabin crew required, under the supervision of the senior cabin crew member","In addition to the maximum number of cabin crew required, under the supervision of the senior cabin crew member","Instead of a crew member","Without supervision"],0,"Un nouvel entrant fait aussi une visite d'aéronef. · C01 04 01 · p.135","(b) Familiarisation flights (1) During familiarisation flights, the cabin crew member should be assigned in addition to the minimum number of cabin crew required in accordance with ORO.CC.100 and if applicable ORO.CC.200. (p.135)"],
["An aircraft familiarisation visit emphasises:",["Interphone and PA, evacuation alarm, emergency lighting, smoke detection, safety equipment, crew stations, lavatories, galleys and water shut-off, circuit breaker panels, doors and exits","Seat colours and materials, uniform locations, cargo compartments, cockpit instruments and engine controls","Cockpit controls, fuel panels, landing gear levers and passenger entertainment systems, without the safety equipment","Crew rest areas, galley menus, seat configurations and cargo loading, with no focus on exits or alarms"],0,"La visite peut être combinée avec la formation de type. · C01 04 01 · p.136"],
["Refresher training may be replaced by recurrent training if:",["Flying duties restart within the validity period of the last recurrent training and checking","After the Captain's approval, whatever the time away","The crew member asks, and the operator agrees","After one month of absence, with a check flight"],0,"Sinon, seule la formation de type et la conversion peuvent la remplacer. · C01 04 01 · p.137","(c) The operator may elect to replace refresher training by recurrent training if the reinstatement of the cabin crew member’s flying duties commences within the validity period of the last recurrent training and checking. (p.137)"],
["Fire and smoke training must include:",["Extinguishing an actual aircraft-interior-type fire (an alternative agent may replace halon) and using PBE in an enclosed simulated smoke-filled environment","Reading about firefighting procedures and watching a demonstration, with PBE tested in a normal, smoke-free room","Extinguishing a small simulated fire on a screen, with PBE worn only once to check the fit","Extinguishing an actual fire with halon only, with PBE use left to the operator's recurrent training"],0,"On y apprend à identifier la source du feu et de la fumée. · C01 04 01 · p.133"],
["Pilot incapacitation procedure training is given to each cabin crew member:",["Unless the minimum flight crew is more than two","Unless the maximum flight crew is more than two","Unless the minimum flight crew is less than two","Only to the Purser"],0,"Les check-lists du poste de pilotage sont montrées par démonstration pratique si l'exploitant l'exige. · C01 04 01 · p.133","(g) Pilot incapacitation procedures Unless the minimum flight crew is more than two, each cabin crew member should be trained in the procedure for pilot incapacitation. (p.133)"],
["CRM training in conversion must be conducted by:",["At least one cabin crew CRM instructor","Any passenger who is a trained pilot","Ground staff with a CRM certificate","A caterer with first-aid training"],0,"Avec les éléments applicables du tableau 1 de l'AMC1 ORO.CC.115(e). · C01 04 01 · p.133","(2) The operator's CRM training and the CRM training covered during the operator aircraft type conversion training should be conducted by at least one cabin crew CRM instructor. (p.133)"],
["Evacuation training covers:",["Planned and unplanned evacuations on land and water, and recognising unusable doors or unserviceable evacuation equipment","Planned evacuations on land only, and recognising usable doors but not unserviceable equipment","Unplanned evacuations on water only, with planned land evacuations covered in theory","Planned and unplanned evacuations on land and water, but without recognising unusable doors"],0,"Elle inclut les actions supplémentaires du PNC responsable d'une paire de portes. · C01 04 01 · p.133"],
["Realistic training on safety equipment covers:",["Life jackets, oxygen, extinguishers and PBE, crash axe, emergency lights, megaphones, raft survival packs, pyrotechnics and first-aid kits","Life jackets, extinguishers and PBE only, with oxygen, crash axe and raft packs covered in classroom theory","Life jackets, oxygen, extinguishers and megaphones, with PBE and pyrotechnics covered in the operator's recurrent training only","Extinguishers, PBE, crash axe and first-aid kits, with life jackets and raft survival packs excluded"],0,"Chaque membre apprend l'emplacement et l'usage de tout l'équipement transporté. · C01 04 01 · p.132"],
["Training on communication with flight crew includes:",["The difficulties of coordination in a smoke-filled environment","Only phone numbers and emails of the flight crew","Only email addresses and the cockpit door code","Nothing, since communication is covered in the operator's manual"],0,"C'est un élément de la formation gestion des passagers et des foules. · C01 04 01 · p.132"],
["A crew member must not fly and must consult the Captain or Purser if:",["Medical requirements are not met, duties cannot be accomplished, or there is doubt about a condition that may endanger a flight","Medical requirements are not met, duties can be accomplished, or there is doubt about a condition that may endanger a flight","They are late for lunch","They dislike the route"],0,"On consulte aussi en cas de doute sur l'état d'un collègue. · C01 04 02 · p.139"],
["Cabin crew must be free from:",["Any physical or mental illness that might lead to incapacitation or inability to perform their duties","Any chronic condition, even if controlled, since any treatment prevents duties from being performed","Any physical illness only, since mental conditions are assessed by the operator after an incident","Any illness that has caused absence in the last twelve months, whatever its current effect"],0,"L'alcool et les drogues compromettent toujours la sécurité des vols. · C01 04 02 · p.139","Cabin crew: shall be free from any physical or mental illness, which might lead to incapacitation or inability to perform cabin crew duties. (p.139)"],
["Concerning medication, crew members:",["Must not take any medicine or treatment unless completely sure it has no adverse effect on duties; in doubt, ask the corporate doctor","May take a medicine if the pharmacist says it is safe, without asking the corporate doctor, as long as it is non-prescription","Must not take any medicine on duty unless it is an over-the-counter drug, since only prescription drugs affect performance","Must stop treatment before every flight, and may resume it after landing without medical advice"],0,"Certains effets durent 24 à 48 heures ou plus. · C01 04 02 · p.140","Crew members shall not take any prescription or non-prescription medication or drug, or undergo any other treatment, unless they are completely sure that the medication, drug or treatment will not have any adverse effect on their ability to perform their duties safely. (p.140)"],
["Alcohol and drug effects are strongly enhanced by:",["Hypoxia and jet lag","Cold weather","Short flights","Good sleep"],0,"Pas de drogues de fête, douces ou dures. · C01 04 02 · p.140"],
["After a normal blood donation or recreational diving, a suitable wait before flying is:",["At least 24 hours (and no scuba diving within 24 hours before a flight)","At least 24 hours (and no scuba diving within 13 hours before a flight)","At least 12 hours (and no scuba diving within 24 hours before a flight)","4 hours"],0,"Plongée et vol rapprochés peuvent causer des problèmes de santé graves. · C01 04 02 · p.140","Scuba diving It is not allowed to go (non-decompression) scuba diving within 24 hours before the flight. (p.140)"],
["Meal precaution for flight crew:",["The Captain and first officer must be served different meals","The Purser and first officer must be served different meals","The Captain and first officer must not be served different meals","They eat at the same time only"],0,"Pour éviter une intoxication simultanée. · C01 04 02 · p.140","Meal Precautions The Captain and first officer must be served different meals - including soup, hors d'oeuvre and dessert - during flight. (p.140)"],
["Split duty rules include:",["Only one break per FDP, no combination with augmented or double crew, and a total FDP not exceeding 20 h 30","Only one break per FDP, no combination with augmented or double crew, and a total FDP not exceeding 10 h 30","Only one break per FDP, no combination with augmented or double crew, and a total FDP not exceeding 12 h 30","Several breaks"],0,"Les parties avant et après la pause ne dépassent pas 10 h. · C01 04 03 · p.152"],
["During a split-duty break, suitable accommodation must be provided if:",["The break is 4 hours or more, or covers 3 hours or more of the period 22:00–06:00 local","The break is 4 hours or less, or covers 3 hours or more of the period 22:00–06:00 local","The break is 2 hours or more, or covers 3 hours or more of the period 22:00–06:00 local","The break is 30 minutes"],0,"Sinon, des installations adéquates suffisent. · C01 04 03 · p.152"],
["For cumulative duty hours, a split-duty break counts:",["In full if shorter than 8 hours, 50% if 8 hours or longer","In full if shorter than 13 hours, 50% if 8 hours or longer","In full if shorter than 16 hours, 50% if 8 hours or longer","Always in full"],0,"Un seul break est utilisé par FDP. · C01 04 03 · p.152"],
["When rest is taken away from home base, the company must provide:",["Suitable accommodation","Passenger seats","A private jet","Nothing"],0,"Si le trajet aller-retour dépasse 2 h, l'excédent s'ajoute au repos minimal ; si moins de 1 h 30, on peut déduire mais pas sous 10 h. · C01 04 03 · p.154"],
["Rest at home base after 60 hours or less away is at least:",["24 hours, or four times the time difference (max 12 h), whichever is higher","13 hours, or four times the time difference (max 12 h), whichever is higher","16 hours, or four times the time difference (max 12 h), whichever is higher","12 hours"],0,"Au-delà de 60 h : 48 h ou huit fois le décalage (max 12 h). · C01 04 03 · p.155"],
["Standby forms by place are:",["Airport (STBY-W), suitable accommodation (STBY-B) and at home (STBY-H)","Airport (STBY-A), accommodation (STBY-B) and at home (STBY-H)","Airport (STBY-W), hotel (STBY-H) and at home (STBY-B)","Gate, cabin and home, each credited in full towards the FDP"],0,"Le STBY-W n'offre pas de possibilité de repos en lit. · C01 04 03 · p.156"],
["Airport standby credit toward FDP and cumulative duty:",["One half towards the FDP and in full towards cumulative duty hours","One half towards the FDP and one half towards cumulative duty hours","In full towards the FDP and one half towards cumulative duty hours","One third towards the FDP and in full towards cumulative duty hours"],0,"Accommodation : aucun crédit FDP, moitié du cumul. Domicile : aucun crédit FDP, moitié du cumul sauf les 4 premières heures. · C01 04 03 · p.156–157"],
["Days of standby are considered:",["Days on duty; they cannot count as days off or as a rest period","Days on duty; they can count as days off or as a rest period","Rest periods","Days off"],0,"Une astreinte juste avant ou après un FDP compte en entier dans ce FDP. · C01 04 03 · p.157"],
["If a crew member on home standby arrives late because of late notification or traffic:",["The flight is delayed to allow ample time for pre-flight duties","The crew member is dismissed, and replaced by another crew member","Passengers wait outside the aircraft until the crew member has arrived","The flight leaves on time, and the crew member joins at the next station"],0,"Un délai de notification minimal est défini. · C01 04 03 · p.157–158"],
["In unforeseen circumstances the allowable FDP may be increased, at the Captain's discretion after consulting the crew, by at most:",["2 hours, or 3 hours if the crew is augmented or doubled","2 hours, or 8 hours if the crew is augmented or doubled","4 hours, or 3 hours if the crew is augmented or doubled","30 minutes"],0,"Si les circonstances surviennent après décollage sur le dernier secteur, le vol peut continuer vers la destination ou l'alternat. · C01 04 03 · p.158"],
["A required rest period may be reduced under unforeseen circumstances by:",["At most 2 hours, to not less than 10 h 30, if the previous rest was not reduced, with a sleep opportunity of at least 8 hours","At most 2 hours, to not less than 10 h 30, if the previous rest was not increased, with a sleep opportunity of at least 8 hours","At most 2 hours, to not more than 10 h 30, if the previous rest was not reduced, with a sleep opportunity of at least 8 hours","Any amount"],0,"La réduction est ajoutée au repos suivant, qui ne peut plus être réduit. · C01 04 03 · p.158"]
]},
{n:"C02 – Communication",s:"PDF p.1–37",q:[
["Communication in aircraft operations can be:",["Verbal, non-verbal or electronic","Verbal only, or written when the airline requires it","Electronic only, through the interphone and PA","Written only, in the form of reports and logs"],0,"In aircraft operations, communication is the exchange of information between crew members, between aircraft and ground control, and between crew and passengers. It can be spoken, gestured (non-verbal) or electronic, so no single channel is enough on its own. · C02 01 00 01 · p.6"],
["Which is a physical barrier to communication?",["Poor lighting or acoustics","Cultural differences","Different perceptions","Stress"],0,"Physical barriers are environmental or sensory obstacles: distance, poor lighting, bad acoustics and physical disabilities. Language, culture and stress are non-physical barriers, so do not mix the two groups. · C02 01 00 02 · p.7"],
["Language and level-of-understanding barriers are reduced by:",["Clear, concise language and visual aids","Speaking faster with more technical terms, and ignoring language differences","Using jargon and repeating the message at the same speed without extra context","Using a longer explanation in the speaker's language, without visual aids"],0,"Language and knowledge-level barriers are reduced by simple, concise wording, extra context when needed, and visual aids or non-verbal cues. Speaking faster or using jargon makes them worse. · C02 01 00 02 · p.8"],
["When the flight deck is separated from the cabin, crew should use:",["Intercom, radios or other devices","Passengers as relays","Only gestures","Nothing"],0,"When the flight deck and the cabin are separated, crew replace direct contact with the intercom, radios or other electronic devices. This is the standard answer to the physical barrier created by the cockpit door. · C02 01 00 02 · p.9"],
["Regulation (EU) 965/2012 requires passengers to receive:",["A safety briefing card with picture-type instructions","A written briefing at check-in, with picture instructions for the exits but not for the equipment","A safety briefing card with text-only instructions in the operator's language and in English","A safety briefing given by video only, with picture instructions for the exits used by the crew"],0,"Regulation (EU) 965/2012 requires safety briefings and demonstrations that let passengers apply emergency procedures, plus a briefing card with picture-type instructions for the emergency equipment and exits they may use. · C02 01 01 · p.10"],
["Who chooses the languages used on board?",["The operator","Passengers","Captain only","EASA"],0,"The operator chooses the languages used on its flights, because covering every language on board is impossible. The choice may depend on the destination or on the known passenger profile. · C02 01 01 · p.10"],
["ICAO Doc 10086 recommends announcements in:",["Language of the operator and English","Language of the destination only","English only","Any language"],0,"ICAO Doc 10086 recommends giving briefings, announcements and demonstrations in the operator's language and in English. On international flights the operator should also consider the official language of the State of departure and destination. · C02 01 01 · p.10"],
["'Wilco' means:",["Will comply","Received","Wait","Yes"],0,"'Roger' only confirms that a message was received and understood. 'Wilco' (will comply) goes further: the instruction will be carried out. · C02 01 01 · p.11"],
["'Standby' means:",["Wait for further instructions","Understood or received","Will comply with the instruction","Yes, affirmative"],0,"'Standby' asks the other party to wait for further instructions. It is neither yes nor no; compare with 'Affirmative' (yes) and 'Negative' (no). · C02 01 01 · p.11"],
["'PAN-PAN' indicates:",["An urgent situation, not yet an emergency","Life-threatening distress","A routine check","Evacuation"],0,"PAN-PAN signals an urgent situation concerning the aircraft or its occupants that does not yet need immediate assistance. It ranks below MAYDAY, which means grave and imminent danger. · C02 01 01 · p.11"],
["'MAYDAY' is:",["The international distress call for a life-threatening emergency","The international urgency call for a situation that does not need immediate assistance","A routine call to report position and altitude to air traffic control","A call used by cabin crew only to ask the flight deck for assistance"],0,"MAYDAY is the international distress call for a life-threatening emergency. It has priority over every other radio message, including PAN-PAN. · C02 01 01 · p.12"],
["Unexpected turbulence without the seat belt sign on: who informs the flight deck?",["The purser","The captain","Passengers","Ground staff"],0,"The purser informs the flight deck · C02 01 01 · p.12","The purser when reporting the Captain will also uses the standard phraseology \"cabin ready\" or the \"cabin ready\" switch. (p.12)"],
["'Here's the cockpit, purser is required forward' is used for:",["Serious situations, e.g. flight crew incapacitation","Unplanned strong turbulence, when the Captain wants a PA announcement","An emergency descent, when cabin crew must secure the cabin","The evacuation alert phase, when cabin crew must go to their stations"],0,"'Here's the cockpit, purser is required forward' is used for any serious situation, such as flight crew incapacitation. Turbulence, emergency descent and evacuation alert each have their own phrase. · C02 01 01 · p.12"],
["Which phrase is used for the evacuation alert phase?",["Cabin crew at station","Cabin crew turbulence","Emergency descent","Purser forward"],0,"The evacuation alert phase starts with the Captain's message 'Here's the cockpit, cabin crew at station'. It ends with either the evacuation or its cancellation. · C02 01 01 · p.12"],
["Aviation alphabet: letter Q is:",["Quebec","Queen","Quito","Quartz"],0,"Aviation alphabet: Q is 'Quebec'. Letters often mixed up: J = Juliet, K = Kilo, X = X-ray. · C02 01 01 · p.13"],
["Which message has the highest priority?",["Distress (mayday)","ATC clearances","Flight information","ACARS message"],0,"Message priority order: distress (mayday), emergency (pan pan), ATC clearances, flight information, then operator-to-crew messages such as ACARS. · C02 01 01 · p.13"],
["A thumbs-up through a door window means:",["No problem, the procedure can continue","No problem, the procedure cannot continue","Evacuate","Stop"],0,"A thumbs-up, even through a door window, means there is no problem and the procedure can continue. Gestures reinforce the verbal message and become essential when voice or equipment cannot be used. · C02 01 02 · p.14"],
["If communication equipment is destroyed, the main vector of instructions is:",["Gestures","Written notes","Megaphone","PA"],0,"Communication equipment can be destroyed or inaccessible in an emergency. Gestures then become the main way to give instructions, so they must be precise, fast and expressive. · C02 01 02 · p.14"],
["Gesture 'Recommend stop' (ground staff):",["Arms in front of head, crossed at wrists","Arms outward and down at 45°, brought together until the wrists cross","Right hand fanning from shoulder to knee, left hand pointing to the fire","Arm horizontal with the hand upraised, with a beckoning motion backward"],0,"The 'Recommend stop' signal from rescue staff is made with arms crossed at the wrists in front of the head. It asks the crew to halt an evacuation or movement in progress; at night the same signal is made with wands. · C02 01 02 · p.15"],
["Gesture for 'Fire':",["Right hand fanning shoulder to knee, left hand pointing to the fire","Left hand fanning from shoulder to knee, right hand held raised at eye level","Both hands crossed in front of the head, then pointing toward the area of fire","Right hand beckoning backward, left hand held against the body"],0,"The 'Fire' signal is a fanning motion of the right hand from shoulder to knee while the left hand points to the area of fire. Do not confuse it with 'Recommend stop' (crossed wrists). · C02 01 02 · p.15"],
["Cabin crew communicate with each other mainly by:",["Intercom, megaphone, PA and gestures","Mobile phones and radio, depending on the company policy","Intercom and written notes, with the PA reserved for passengers","Radio and gestures only, with the megaphone reserved for the flight crew"],0,"Between cabin crew members, communication relies on the intercom, megaphone, PA and gestures. A crew member can be isolated, so several channels are needed. · C02 01 03 01 · p.16"],
["Which is NOT a reason cabin crew hesitate to inform the flight deck?",["Doubts about relevance","Fear of being 'put in their place'","Sterile cockpit rule","Lack of equipment"],3,"Cabin crew hesitate to tell the flight deck because of doubts about relevance, fear of being put in their place and worry about breaking the sterile cockpit rule. A lack of equipment is not one of the reasons. CRM training addresses this gap. · C02 01 03 02 · p.18"],
["A PA system is required if maximum approved seating exceeds:",["19","60","100","9"],0,"A public address system is required when the maximum approved passenger seating configuration exceeds 19 seats. Megaphones start higher, at more than 60 seats. · C02 01 03 03 · p.20, p.29"],
["The PA must be usable by a cabin crew member within at most:",["10 s","3 s","30 s","1 min"],0,"The PA must be usable by a cabin crew member within 10 seconds at each cabin crew station where it is available, and must be audible and intelligible from every part of the cabin. · C02 01 03 03 · p.20, p.29"],
["Portable megaphones are required above what seating configuration?",["60","19","100","200"],0,"Battery-powered portable megaphones are required when the maximum approved seating exceeds 60 and passengers are carried. Do not mix this with the PA threshold (more than 19 seats). · C02 01 03 03 · p.21, p.30"],
["Megaphones required for 100+ seats (per passenger deck):",["2","1","3","4"],0,"Per passenger deck: 61 to 99 seats need 1 megaphone, 100 seats or more need 2. With several decks, at least one megaphone is needed if the total seating exceeds 60. · C02 01 03 03 · p.21, p.30"],
["The three types of passenger announcements are:",["Commercial, normal operations, emergency","Boarding, flight, landing","Welcome, safety, goodbye","Written, verbal, gestural"],0,"Announcements fall into three categories: commercial (brand and services), normal operations (routine flight phases) and emergency (unforeseen events). · C02 01 03 05 · p.33"],
["An occurrence report differs from an incident report because it covers:",["More serious events: accidents or injury/damage","Less serious events: accidents or injury/damage","Minor service issues","Meal quality"],0,"An incident report covers events with safety potential but no injury or major damage (medical case, unruly passenger, equipment fault). An occurrence report covers more serious events with injury or damage, such as an accident, fire or significant turbulence. · C02 01 03 06 · p.34"],
["'INOP' on the tech log means:",["Inoperative","Inspected","Informed","In operation"],0,"INOP means 'inoperative': a system or part is not working as intended. It is marked in the technical log, and the aircraft flies only if the defect is repaired or allowed by the MEL. · C02 01 03 07 · p.36"],
["Who signs off the tech log before flight?",["Captain","Purser","Passenger","Ground handler"],0,"Before every flight the Captain signs the tech log, confirming that the aircraft is legally acceptable and safe for the flight. The tech log is exclusive to that aircraft. · C02 01 03 07 · p.36"],
["Dispatch with a defective system is possible if allowed by:",["Minimum Equipment List (MEL)","Maximum Equipment List (MEL)","Passengers","Purser"],0,"The Minimum Equipment List defines which systems may be inoperative while the aircraft is still dispatched safely. Without MEL allowance the defect must be fixed before take-off. · C02 01 03 07 · p.36"],
["Radio contact between aircraft and fire services (SSIS) has:",["No general procedure or designated frequency","A single worldwide frequency","Always the Tower frequency","No role"],0,"In the ground-staff example there is no general procedure or common radio frequency between aircraft, fire services (SSIS) and ATC; only local arrangements exist at some large aerodromes. That is why contact was slow and confusing. · C02 01 03 04 · p.24"],
["Air-to-Ground communication takes place between:",["The aircraft and ground control stations","Pilots and cabin crew","Crew and passengers","Two aircraft"],0,"Air-to-ground communication is the link between the aircraft and ground control stations. It differs from crew-to-crew, crew-to-passenger and emergency communication. · C02 01 00 01 · p.6"],
["The 'feedback loop' means cabin crew can:",["Give feedback to pilots on in-cabin situations or passenger concerns","Give feedback to ground staff on in-cabin situations, who then inform the pilots","Give feedback to the flight deck only after landing, which cannot influence operations","Correct the pilots' decisions in the cabin when passenger concerns are raised"],0,"The feedback loop lets cabin crew pass information on cabin situations or passenger concerns to the pilots, which can influence operational decisions. · C02 01 00 01 · p.6"],
["Different cultures may differ in expectations about:",["Eye contact and personal space","Aircraft weight","Fuel quantity","Cloud types"],0,"Cultures differ in eye contact, personal space and other non-verbal cues. Not knowing this can cause misunderstandings with passengers. · C02 01 00 02 · p.7"],
["Perception barriers can be bridged by:",["Active listening, finding common ground, a neutral third party","Passive listening, finding common ground, a neutral third party","Insisting on your view","Avoiding the person"],0,"Perception barriers are bridged by listening actively, trying to understand the other point of view, finding common ground and, when needed, asking a neutral third party to help. · C02 01 00 02 · p.8"],
["Normal communication refers to:",["Routine standardized exchanges from pre-flight checks to post-landing","Routine standardized exchanges from pre-flight checks to post-take-off","Only emergency calls","Passenger complaints"],0,"Normal communication is routine, standardized exchange during standard operations, from pre-flight checks to post-landing procedures (routine checks, operational updates, service communication). · C02 01 01 · p.10"],
["Standard phraseology on board must be:",["Used by the airline and approved by the authority","Chosen by each crew and approved by the Purser","Used in English only, whatever the operator's language","Optional, and replaced by plain language in emergencies"],0,"The airline must use standard phraseology approved by the authority. Cabin crew learn it during the airline's own training. · C02 01 01 · p.10"],
["The purser reporting to the Captain uses the standard phrase:",["'Cabin ready'","'Mayday'","'Standby'","'Brace'"],0,"When reporting to the Captain that the cabin is ready, the purser uses the standard phrase 'cabin ready', or the 'cabin ready' switch where fitted. · C02 01 01 · p.11"],
["Which is an abnormal communication situation?",["Minor galley or IFE malfunction","A critical engine or electrical failure","A security threat such as a hijacking","A passenger in a life-threatening medical situation"],0,"Abnormal communication covers non-routine situations that are not life-threatening: a galley or IFE fault, a minor medical issue or a small operational discrepancy. · C02 01 01 · p.11"],
["Which is an emergency communication situation?",["Security threat such as a hijacking","A galley or IFE malfunction without any effect on safety","A minor delay caused by ground services","A passenger who feels unwell but is not in a critical condition"],0,"Emergency communication covers exchanges under critical conditions: severe technical failures, life-threatening medical emergencies, security threats such as a hijacking, and severe environmental dangers. · C02 01 01 · p.12"],
["'Brace' is a command:",["For a potential crash","To start boarding","To serve meals","To close doors"],0,"'Brace' is the command given by cabin crew or the flight deck in preparation for a potential crash. It is an emergency term, never a routine one. · C02 01 01 · p.12"],
["During an in-flight incident, if the captain has no time to inform the cabin:",["He gives instructions to the purser","He gives instructions to the Captain","He gives instructions to the commander","He waits for landing"],0,"During an in-flight incident the Captain informs the cabin crew and passengers as soon as possible. If he has no time, he gives instructions to the purser, who relays them. · C02 01 01 · p.12"],
["Radiotelephony allows to obtain:",["Clearances and weather information, and send distress messages","Passenger lists and meal orders, and send routine commercial messages","Clearances and passenger lists, and send commercial messages to the airline","Weather information and catering requests, and send flight plan changes by phone"],0,"Radiotelephony lets crews obtain ATC clearances and weather information for an area, and send emergency or distress messages. It is an important safety feature. · C02 01 01 · p.13"],
["Active listening means:",["Truly understanding the messages being conveyed","Taking notes only, and repeating the orders aloud to the passenger","Speaking louder to make sure the passenger hears the instruction","Waiting for the speaker to finish, then answering as quickly as possible"],0,"Active listening means truly understanding the message, not just hearing it. On board, every directive can have safety consequences, so a misunderstanding is not acceptable. · C02 01 02 · p.14"],
["How something is said in tricky situations:",["Can change how people react","Only matters to pilots","Cannot change how people react","Does not matter"],0,"The way something is said, especially in dangerous situations, changes how people react. A confident, professional manner helps crew and passengers follow instructions at once. · C02 01 02 · p.14"],
["Gesture 'Recommend evacuation':",["Arm horizontal, hand upraised at eye level, beckoning backward","Disarm horizontal, hand upraised at eye level, beckoning backward","Arms crossed at wrists","Arms outward at 45°"],0,"'Recommend evacuation' is shown with the arm extended horizontally, hand upraised at eye level, and a beckoning arm motion angled backward. It follows the rescue and fire-fighting assessment of the outside situation. · C02 01 02 · p.15"],
["Gesture 'Emergency contained' (all-clear):",["Arms outward and down at 45°, brought together until wrists cross, then extended again","Arms extended outward and up at 45°, held for a few seconds, then lowered","Arms crossed in front of the head at the wrists, then lowered together","Arm held horizontal with the hand upraised at eye level, with a beckoning motion backward"],0,"'Emergency contained' (all-clear) tells the crew there is no outside evidence of dangerous conditions: arms outward and down at 45°, brought together below the waist until the wrists cross, then extended again. · C02 01 02 · p.15"],
["At night, the emergency gestures are performed:",["The same way with wands","Only by the pilot","Differently","Not at all"],0,"At night the emergency gestures are identical, performed with lighted wands. Do not assume different signals at night. · C02 01 02 · p.15"],
["During an evacuation, communication between cabin crew mainly ensures that:",["The evacuation order has been given and transmitted, usable exits identified, passengers dispatched","The evacuation order is repeated to passengers by the Captain only, with the crew staying at their stations","Passengers are told to return to their seats, and exits are chosen later by the pilots","The cabin is checked for baggage, exits are blocked and passengers are assembled at the rear"],0,"During an evacuation, communication between cabin crew mainly ensures that the evacuation order has been given and relayed, usable exits are identified, and passengers are dispatched in a way that permits rapid evacuation. · C02 01 03 01 · p.16"],
["Joint training of cabin and flight crew helps:",["Each group know the culture of the other","Reduce training cost only","Skip evacuation drills","Remove CRM"],0,"Joint training in procedures such as emergency evacuation helps cabin and flight crew learn each other's culture, so differences in training do not become a communication barrier. · C02 01 03 02 · p.18"],
["Cabin crew training should make them aware of:",["The pilot's workload for each flight phase","The elements inside the engines and in the cargo hold that affect flight safety","The pilots' personal schedules and rest requirements","The aircraft's weight and balance calculations for each flight"],0,"Cabin crew training should give them a basic understanding of the aircraft elements visible from the cabin that matter for safety, and of the pilot's workload in each phase of flight, including during an evacuation. · C02 01 03 02 · p.18"],
["The PA must operate:",["Independently of the interphone systems (except handsets, headsets, etc.)","Through the interphone systems only, with the same handsets and microphones","Independently of the interphone systems, but only on the ground","Only in an emergency, using the interphone headsets at the flight crew stations"],0,"The PA must work independently of the interphone systems (except shared handsets, headsets, microphones, selector switches and warning devices) and be accessible from each required flight crew station. · C02 01 03 03 · p.20, p.29"],
["The PA must be hearable and intelligible from:",["Passenger seats, lavatories, seats and galleys","Passenger seats and the cockpit, but not the lavatories and galleys","The cockpit and the galleys only, with lavatories excluded","Passenger seats only, with lavatories and galleys covered by the interphone"],0,"The PA must be audible and intelligible from all passenger seats, lavatories, crew seats and galleys, not only from the seating area. · C02 01 03 03 · p.20, p.29"],
["The megaphone is used:",["During a PA failure or evacuations","For service announcements","During boarding only","During taxi"],0,"The megaphone is a battery-powered portable device used when the PA fails or during evacuations to give instructions to passengers. · C02 01 03 03 · p.21, p.30"],
["A required megaphone may be placed where?",["Attached to a cabin crew seat, easily accessible","Anywhere in the cargo hold","In the cockpit only","In a lavatory"],0,"A required megaphone should be easily accessible from a seat assigned to a cabin crew member. It need not be hand-held if it is attached to a cabin crew seat. · C02 01 03 03 · p.21, p.30"],
["Which are commercial announcements?",["Welcome, routing and progress, service offerings","Boarding, take-off preparations","Evacuation orders","Turbulence"],0,"Commercial announcements promote the airline's brand and services: welcome, routing and progress information (e.g. points of interest), and service offerings such as entertainment and duty free. · C02 01 03 05 · p.33"],
["Which are normal operation announcements?",["Boarding, take-off preparations, in-flight safety, descent and landing","Boarding, take-off preparations, in-flight safety, climb and landing","Evacuation orders","Duty-free offers"],0,"Normal operation announcements guide passengers through routine flight phases: boarding, take-off preparations, in-flight safety reminders, and descent and landing preparations. · C02 01 03 05 · p.33"],
["'Remain calm... exit quickly and leave all belongings behind' is:",["An evacuation order (emergency announcement)","A commercial announcement","A boarding call","A service offer"],0,"'Remain calm and listen to the cabin crew. Exit quickly and leave all personal belongings behind' is an evacuation order, which is an emergency announcement. · C02 01 03 05 · p.34"],
["Examples of incidents for an incident report:",["Medical emergencies, unruly passengers, equipment malfunctions","Aircraft accidents, fires or significant turbulence","Serious injury, damage or an accident with a fire","Late boarding, a delayed meal service or a seat change"],0,"Incident report examples: medical emergencies, unruly passengers and equipment malfunctions. Accidents, fires and significant turbulence are occurrence-report examples. · C02 01 03 06 · p.34"],
["Safety checks by cabin crew before take-off may cover:",["Emergency exits, equipment, cabin security, seat belts, lavatories","Engine maintenance, fuel quantity and the flight plan, before engine start","Emergency exits and equipment, with seat belts and lavatories checked by ground staff","Cabin security and seat belts only, with the equipment checked by the flight crew"],0,"Before take-off, cabin crew safety checks may cover emergency exits, emergency equipment, cabin security, seat belts and lavatories. Any problem found is documented and corrected before the aircraft can take off. · C02 01 03 06 · p.35"],
["The tech log is:",["A vital document carried on board, recording the aircraft's maintenance and technical issues","A list of the passengers and crew carried on the flight, kept by the purser","A catering and duty-free record carried on board for each flight","A record of the cabin crew's reports, kept by the airline's safety department"],0,"The tech log is a vital document carried on board each aircraft. It records maintenance history, technical problems and repairs, and is exclusive to that aircraft. · C02 01 03 07 · p.36"],
["In the ground-staff example, direct contact with the SSIS would have:",["Reduced the crew's uncertainty about which side to evacuate","Increased the crew's uncertainty about which side to evacuate","Changed the flight plan","Delayed the evacuation"],0,"In the example, direct contact on an appropriate frequency between the crew and the SSIS would have reduced the crew's uncertainty about which side to evacuate. No general procedure or frequency exists. · C02 01 03 04 · p.24"],
["Communication helps passenger safety because cabin crew:",["Brief passengers on procedures and assist in emergencies","Serve meals and handle luggage during the briefing, leaving safety to the flight crew","Fly the aircraft in an emergency by relaying instructions to passengers","Brief passengers on procedures, but leave the assistance in emergencies to ground staff"],0,"Communication supports passenger safety because cabin crew brief passengers on safety procedures, help during emergencies and ensure overall safety compliance in the cabin. · C02 01 00 01 · p.6"],
["Clear communication in teams ensures:",["Efficient distribution of tasks and effective responses","Longer briefings and fewer crew needed, with each task done by one person","Efficient distribution of tasks, with decisions kept by the Purser alone","Faster boarding, and no need for reports, since tasks are shared verbally"],0,"Clear communication in a team ensures that tasks are distributed efficiently and that the crew responds effectively to different scenarios. · C02 01 00 01 · p.6"],
["Cultural sensitivity in communication helps crew:",["Interact respectfully with a diverse group of passengers","Speak one language, with announcements skipped when passengers are unfamiliar","Avoid direct contact with passengers from other cultures to prevent misunderstandings","Replace safety announcements with commercial announcements for foreign passengers"],0,"Cultural sensitivity helps crew deal respectfully and effectively with passengers of different cultures, languages and backgrounds. · C02 01 00 01 · p.6"],
["Which is a non-physical barrier?",["Emotional or psychological state such as stress","Poor acoustics or lighting that make it hard to see or hear","Distance between the speakers in the cabin","A closed cockpit door between the flight deck and the cabin"],0,"Emotional or psychological states (stress, being upset) are non-physical barriers, like language and cultural differences. Poor acoustics, poor lighting and distance are physical barriers. · C02 01 00 02 · p.7"],
["On specific routes the operator should consider:",["Language-qualified cabin crew or interpreters","Fewer announcements and a shorter briefing, with only the operator's language","Crew who speak only English, since passengers all understand it","Interpreters at the gate instead of language-qualified crew on board"],0,"On specific routes the operator should consider assigning language-qualified cabin crew or interpreters, according to the languages of the passengers on board. · C02 01 01 · p.10"],
["To cover the most passengers on international flights, the operator should consider:",["English and the official language of the State of departure and destination","Only the operator's language and the language of the destination","English and the language of the passengers who ask for it","Only the operator's language, with an interpreter on every flight"],0,"To reach the largest share of passengers on international flights, the operator should consider English plus the official language of the State of departure and destination. · C02 01 01 · p.10"],
["An 'operational update' in normal communication is, for example:",["A change of altitude, route or speed due to traffic or weather","A change to the catering plan, the passenger list or the seat allocation","A passenger complaint about noise, a seat change request or a meal order","A report of a minor galley malfunction without any change to the flight"],0,"An operational update is a routine change communicated in normal operations, such as altitude, route or speed changes due to traffic or weather. · C02 01 01 · p.10"],

["'Affirmative' and 'Negative' mean:",["Yes and No","Received and Wait","Wait and Go","Stop and Go"],0,"'Affirmative' means yes and 'Negative' means no. Both are standard radio words used instead of 'yes' and 'no'. · C02 01 01 · p.11"],
["Arming or disarming the slides is done using:",["A particular phraseology recognized by all crew and a common procedure","A written note passed between crew, and a common procedure shared by all crew","Gestures only, recognised by all crew, with no phraseology","Any words the Purser chooses, with a procedure that varies by door"],0,"When slides must be armed or disarmed, crew use a particular phraseology recognised by all crew members and a common procedure respected by all, so that there is no ambiguity. · C02 01 01 · p.11"],
["An example of a minor medical situation in abnormal communication:",["A passenger feeling unwell, not critical","A passenger with chest pain and shortness of breath, requiring a medical professional","A passenger who has fainted and does not wake up, requiring urgent help","A passenger with a deep burn from hot liquid, requiring first aid and oxygen"],0,"A passenger who feels unwell but is not in a critical state is an abnormal (minor) situation: non-routine, but not life-threatening. · C02 01 01 · p.11"],
