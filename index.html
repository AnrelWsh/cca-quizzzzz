{n:"C04 – Passenger handling",s:"PDF p.7–63",q:[
["Cabin crew must make sure passengers have taken their allocated seats. If in doubt or in case of difficulty, they:",["Inform the Captain, who can decide to modify the load sheet","Move passengers themselves","Ignore it","Call ground staff only"],0,"La répartition des passagers doit correspondre au load sheet pour respecter les limites de centre de gravité. En cas de doute, c'est le commandant qui peut modifier le load sheet. · C04 01 01 01 · p.7"],
["Which is NOT listed as a special category of passenger (SCP)?",["Persons with reduced mobility","Infants and unaccompanied children","Deportees or persons in custody","A passenger with a business-class ticket"],3,"Les SCP sont ceux qui pourraient avoir des difficultés ou gêner une évacuation : PRM, sensoriels, âgés/fragiles, obèses, enfants/bébés, personnes escortées et passagers avec animaux. Le tarif du billet n'entre pas en jeu. · C04 01 01 02 · p.7"],

["A recognised assistance dog travelling in the cabin:",["Is secured with a harness provided by the owner during taxi, take-off, landing and turbulence","Is free to move at any time","Must always be muzzled by EASA rule","Must always sit at a window by EASA rule"],0,"Le propriétaire fournit un harnais adapté ; en croisière, un moindre maintien peut être accepté selon la procédure de la compagnie. L'EASA n'impose ni muselière ni siège hublot universels. · C04 01 01 03 · p.8"],
["Under CAT.OP.MPA.155(d), who must be notified in advance when SCPs are carried?",["The commander","The caterer","The purser only","The passengers"],0,"Le commandant doit être informé à l'avance de la présence de SCP à bord. · C04 01 02 · p.9"],
["Unaccompanied children require special attention from the crew:",["From boarding until they are handed over to the designated guardian or airport official","Only during take-off","Only during meals","Only in an emergency"],0,"La prise en charge couvre tout le vol, de l'embarquement jusqu'à la remise à la personne désignée. · C04 01 02 · p.10"],
["Deportees may require:",["Isolated seating away from other passengers","A seat at an emergency exit","Free upgrades","No special measure"],0,"Ils peuvent être accompagnés par des agents et nécessitent une coordination particulière pour la sécurité de tous. · C04 01 02 · p.10"],

["When children aged 2 to under 12 are grouped together, there must be:",["At least one accompanying adult for every group of up to twelve children","One adult per child","No adult","One adult per two groups"],0,"S'ils sont dispersés, un adulte doit être assis près de chacun. Les deux règles peuvent s'appliquer sur un même vol. · C04 01 02 · p.13"],

["An aborted take-off is identified by:",["Sudden deceleration, variation in engine noise and possible yaws on the runway","Climb","Landing gear retraction","Seat belt sign off"],0,"Décision du commandant pour raison technique. · C04 06 02 · p.49"],
["During an aborted take-off, cabin crew:",["Go to station (alert phase), wait for the flight crew's instructions and prepare for a possible evacuation","Open doors","Stand in the aisle","Serve drinks"],0,"Ils observent l'extérieur pour déterminer les issues utilisables. · C04 06 02 · p.49"],
["The actions taken in the first minutes of cabin preparation for forced landing:",["Ensure the success or failure of the preparation (first 2 minutes)","Are optional","Are only for the Purser","Do not matter"],0,"Le Purser distribue les tâches par zone, puis informe les passagers (préparation psychologique). · C04 06 03 01 · p.51"],
["Assistance planned for passengers: how many persons for a disabled person who can only move with difficulty?",["2","1","3","0"],0,"1 personne par enfant, senior, femme enceinte, obèse ou handicapé mobile ; 2 pour celui qui se déplace difficilement. · C04 06 03 01 · p.52"],
["If no time to stow catering equipment before forced landing:",["Put everything in a blanket and place it in the toilets","Leave in the aisle","Throw it out","Hand it to passengers"],0,"On vérifie aussi que l'éclairage de secours est armé ou allumé et que les issues sont dégagées. · C04 06 03 01 · p.53"],
["The brace command is:",["Repeated by cabin crew until the aircraft has stopped","Said once","Silent","Given after landing"],0,"Chaque compagnie a sa phrase, précisée dans son manuel d'exploitation. · C04 06 03 01 · p.54"],
["Before opening a door in an evacuation, the crew must:",["Make sure there is no external danger and check the slide's armament","Open at once","Hold the handle during opening","Wait for ground staff only"],0,"Ne pas confondre la poignée de désaccouplement et la poignée de percussion d'urgence. · C04 06 03 02 · p.56"],
["The alert phase is the period between:",["'HERE IS THE COCKPIT, CABIN CREW AT STATION' and the start of evacuation or its cancellation","Boarding and take-off","Landing and gate","Engine start and taxi"],0,"Elle est déclenchée par le commandant, ou à la demande du Purser. · C04 06 03 03 · p.57"],
["The decision to launch an evacuation belongs to:",["The Captain, who says 'EVACUATION' three times and activates the evacuation alarm","The ground staff","Passengers","The caterer"],0,"Si le commandant est incapacité, le Purser ou un autre PNC peut l'ordonner en cas d'urgence évidente. · C04 06 03 03 · p.58"],
["Group panic is aggravated by:",["Fire, smoke, lack of clear instructions and contagion of panic","Calm briefing","A good safety demonstration","Uniforms"],0,"La panique positive est une fuite réflexe ; la négative est la sidération. L'assertivité du PNC (rassurant et autoritaire) permet de garder la coopération. · C04 06 04 · p.60"],
["During evacuation orders should be:",["Positive, very short, loud and with firm gestures","Negative and long","Whispered","Written"],0,"Le cerveau enregistre les mots : on dit 'go left' et non 'do not go right'. · C04 06 04 · p.61"],
["Airsickness is caused by:",["Conflicting messages received by the central nervous system (inner ear, eyes, muscles)","Cabin pressure only","Alcohol only","Heat"],0,"Fatigue, stress, anxiété, alcool et médicaments augmentent la sensibilité. · C05 03 01 · p.62"],
["For an airsick passenger, the manual advises to:",["Seat him in the center of the aircraft, open the aerator, close the blind and recline the seatback","Lay him on the aisle floor","Give coffee","Open the window blind"],0,"On réduit aussi les mouvements de tête et on propose un masque de repos. · C05 03 01 · p.63"],
["SCPs must not be allocated seats that permit direct access to emergency exits where their presence could:",["Impede crew duties, obstruct access to emergency equipment or impede evacuation","Reduce comfort","Delay boarding","Increase fuel burn"],0,"Ce sont les trois critères de CAT.OP.MPA.155(c) : gêner l'équipage, bloquer l'accès au matériel de secours ou freiner l'évacuation. · C04 01 02 · p.9"],
["A person with reduced mobility (PRM) can be reduced in mobility because of:",["Physical or intellectual disability, temporary or permanent, or age","Only a permanent disability","Only age","Only a broken leg"],0,"La définition est large : handicap physique, sensoriel, intellectuel, temporaire ou permanent, ou âge. · C04 01 02 · p.9"],
["For a physically disabled passenger (aided walking), the crew advises to:",["Leave the mobility aid behind during an emergency evacuation","Take the aid at all cost","Stay seated","Use the aid as a slide"],0,"Une aide à la mobilité ralentirait l'évacuation et encombrerait les issues. · C04 01 02 · p.11"],
["For a DEAF passenger, the crew offers:",["Accompaniment, individual needs met, and help from staff trained in sign language","A wheelchair only","Nothing","A seat at the exit"],0,"Pour un BLND, on accompagne aussi et on fournit un fauteuil sur demande. · C04 01 02 · p.12"],
["Every child must have:",["An individual seat equipped with a functional seat belt","A shared seat","A seat belt only for infants","A seat at the exit"],0,"Règle de base du transport des enfants. · C04 01 02 · p.13"],
["The presence of PRMs on board must be:",["Reported to the Captain","Hidden","Reported to passengers","Not reported"],0,"L'exploitant doit aussi avoir une procédure dans son manuel d'exploitation. · C04 01 02 · p.14"],
["DPNA covers passengers with:",["Intellectual or developmental disability needing assistance, e.g. dementia, Alzheimer's or Down's syndrome, traveling alone","A broken arm","A fear of flying","A pet"],0,"Ils sont accompagnés et leurs besoins individuels pris en compte. · C04 01 02 · p.15"],
["Inadmissible passengers are:",["Seated separately if possible and monitored, not necessarily escorted","Always handcuffed","Seated at the exit","Free of any briefing"],0,"Ils sont briefés séparément et les autorités du lieu d'arrivée sont informées discrètement. · C04 01 02 · p.16"],
["During descent and landing, the crew:",["Make an announcement to secure belongings and keep aisles and exits clear, then make a final cabin check","Serve a meal","Open the doors","Dim all lights"],0,"Le dernier contrôle de la cabine confirme que tout est conforme. · C04 01 03 · p.18"],
["CAT.OP.MPA.165 requires procedures so that passengers are seated:",["Where they can help and not impede an evacuation","As they like","Near the lavatories","In first class"],0,"Certains passagers (handicapés, âgés, obèses, enfants, escortés, avec animaux) ne doivent pas être placés à côté d'une issue. · C04 01 03 01 · p.18"],
["Why does unsecured cabin baggage matter?",["It can become a projectile in turbulence or sudden deceleration and block evacuation paths","It only looks untidy","It increases noise","It is only a service issue"],0,"Le manuel parle aussi d'équilibre de l'avion, car le poids doit être réparti correctement. · C04 02 01 03 · p.19"],
["Oversized or excessive hand baggage is:",["Flagged and stowed in the cargo area","Left in the aisle","Placed at an exit","Given to a passenger"],0,"Les charges maximales sont indiquées dans les coffres. · C04 02 01 03 · p.20"],
["For overhead compartments the manual advises:",["Placing heavier items at the bottom, securing compartments tightly and double-checking items like strollers or musical instruments","Placing heavy items at the top","Overfilling","Keeping doors open"],0,"Un coffre trop plein empêche la fermeture sûre des portes. · C04 02 01 03 · p.20"],
["Overstuffing lockers can cause:",["An inability to securely latch the doors","Better balance","Less turbulence","Faster boarding"],0,"On évite aussi de bloquer l'accès au matériel de secours. · C04 02 01 03 · p.21"],
["Unsecured service items such as meal carts can:",["Obstruct evacuation routes and become projectiles in turbulence","Improve service","Be left anywhere","Reduce noise"],0,"Ils doivent aussi rester accessibles quand on en a besoin. · C04 02 01 04 · p.22"],
["A bag blocking an emergency exit can:",["Delay its opening or damage its mechanism","Reduce noise","Help balance","Have no effect"],0,"Un objet près d'un extincteur peut le rendre inaccessible en cas de feu. · C04 02 01 05 · p.22"],
["On boarding, in the presence of a clearly pathological attitude:",["Regulations allow the passenger to be disembarked, with the captain and ground staff","Nothing can be done","He must be seated at the exit","He is served alcohol"],0,"C'est préférable à la gestion d'un incident en vol. · C04 03 01 · p.23"],
["A subject under cannabis intoxication typically shows:",["A simple exaltation of mood with euphoria, volubility and loss of inhibitions","Dangerous aggression","Unconsciousness","Fear"],0,"À distinguer des patients psychiatriques. Les amphétamines et hallucinogènes peuvent induire des troubles psychiatriques graves. · C04 03 02 · p.25"],
["Which is a task of cabin crew in managing passenger behavior?",["Effective communication, conflict resolution and continuous monitoring","Imposing penalties","Ignoring complaints","Leaving the cabin"],0,"Le PNC veille à ce que chacun se sente en sécurité et à l'aise. · C04 03 03 · p.27"],
["Refusing to fasten a seat belt or to turn off a PED is classed by IATA as:",["Refusal to comply with safety instructions","A medical issue","A service request","Normal behavior"],0,"La liste IATA inclut aussi menaces, agressions verbales ou physiques, harcèlement et comportement bruyant. · C04 03 03 01 · p.28"],
["Airlines should have a 'Zero Tolerance' SOP, which:",["Emphasizes awareness, early detection, intervention and employee training","Ignores minor behavior","Applies only to crew","Is optional"],0,"Elle inclut l'empêchement d'embarquer des passagers problématiques et l'encouragement aux poursuites. · C04 03 03 01 · p.29"],
["ICAO threat level 3 is:",["Life-threatening behavior or display of a weapon","Verbal abuse","Physical abuse","Attempted breach of the flight crew compartment"],0,"Niveau 4 = tentative ou intrusion dans le cockpit. · C04 03 03 01 · p.29"],
["Prevention of unruly incidents starts:",["At the point of origin: check-in, security, boarding gate, boarding observation","Only in flight","Only on landing","Only at the gate"],0,"Le gate surveille l'état d'ivresse, d'anxiété ou d'agitation. · C04 03 03 01 · p.30"],
["Signs of psychoactive substances include:",["Slurred speech, unsteady walk, dilated pupils, erratic behavior","Calm speech","A steady walk","Good humor"],0,"On approche avec prudence, calmement, sans ton accusateur, on limite la consommation et on demande de l'aide. · C04 03 03 02 · p.31"],
["With an aggressive passenger, crew should:",["Stay calm and confident, listen actively, seek support and use diversion","Respond with aggression","Ignore","Show fear"],0,"Les moyens de contrainte sont le dernier recours, et l'on avertit la sûreté à l'atterrissage. · C04 03 03 02 · p.31"],
["Before travel, acceptance of animals in the cabin depends on:",["National and operator procedures, not universal limits","One worldwide rule","No condition","Passenger preference"],0,"On confirme espèce, caisse, poids, documents et frais avant le voyage. · C04 04 01 · p.36"],
["In light turbulence:",["Unsecured objects remain at rest and walking is easy","Passengers are thrown","Walking is impossible","The aircraft is out of control"],0,"En sévère, les passagers sont projetés contre leur ceinture et l'avion peut être momentanément hors de contrôle. · C04 05 01 · p.37"],
["In expected moderate or severe turbulence the cabin crew:",["Stow catering equipment, check baggage, return to their structural seat and fasten belt and harness","Continue service","Open doors","Stand in the aisle"],0,"Ils informent ensuite l'équipage et attendent la permission pour reprendre. · C04 05 01 · p.38"],
["When the fasten seat belt sign stays on very long, crew must:",["Be very vigilant that the instruction is followed","Switch it off","Stop reminding","Ignore"],0,"Le Purser peut aussi prévenir le commandant des turbulences ressenties. · C04 05 02 · p.39"],
["Firefighting equipment checked before flight includes:",["PBE, fire gloves, BCF or halon extinguishers","Life rafts only","Seat belts only","Flashlights only"],0,"Chaque PNC a un PBE, une lampe et un gilet équipage près de son siège. · C04 05 02 02 · p.40"],
["Oxygen bottles are checked for:",["The pressure gauge being in the correct place and a valid date","Color","Weight","Noise"],0,"Elles servent en décompression ou en urgence médicale. · C04 05 02 02 · p.40"],
["First aid kits must be:",["Sealed and unused so all items are available","Opened","Empty","Used for training"],0,"L'AED doit fonctionner (voyant fixe ou clignotant). · C04 05 02 02 · p.41"],
["Safety equipment checks are done before every flight except:",["A turnaround where the same crew stays on the same aircraft","The first flight of the day","Night flights","Flights over water"],0,"Dans ce cas, le contrôle n'est pas refait. · C04 05 02 02 · p.41"],
["Security checks before boarding include:",["A visual inspection of the cabin and overhead compartments for prohibited items or suspicious activity","Checking tickets only","Cleaning","Refuelling"],0,"On vérifie aussi que portes et issues sont correctement sécurisées avant le décollage. · C04 05 02 04 · p.43"],
["Cabin readiness for moving off stand includes:",["Exits clear, lights and signs working, cabin temperature and pressurization set, masks and life vests in place","Serving meals","Opening doors","Cleaning"],0,"Puis une dernière inspection pour s'assurer que tous sont assis. · C04 05 02 05 · p.44"],
["ABPs near exits are valuable because they:",["Act swiftly without crossing a chaotic cabin and can assess external hazards like fire or water","Are comfortable","Serve food","Sell tickets"],0,"Si l'équipage est incapacité, l'ABP voisin de l'issue peut diriger l'évacuation. · C04 06 01 · p.46"],
["Other ABP tasks include:",["Assistance at the bottom of slides, in rafts, and helping passengers with disabilities, children or special needs","Piloting","Serving drinks","Closing doors"],0,"Ils occupent des places définies dans les manuels près des issues. · C04 06 01 · p.47"],
["In a forced landing preparation, the Captain:",["Turns on seat belt sign, calls the purser forward, gives the time available, and can brief passengers directly in extreme emergency","Waits","Leaves the cockpit","Opens doors"],0,"Phrase type : 'HERE IS THE COCKPIT, THE PURSER IS REQUESTED FORWARD'. · C04 06 03 01 · p.51"],
["The purpose of cabin preparation is to:",["Protect passengers, facilitate evacuation and prepare survival equipment","Serve meals","Save fuel","Delay landing"],0,"C'est une action préventive. · C04 06 03 01 · p.51"],
["During the pre-landing cabin check the crew ensure:",["Seatbacks and shelves up, belts tight, no one in washrooms, exits cleared, ABP in position, emergency light armed","Passengers stand","Service","Doors open"],0,"De nuit, on réduit l'éclairage ; en zone isolée, on donne de l'eau si possible. · C04 06 03 01 · p.53"],
["In the standard brace position the person:",["Places head against or close to the surface likely to strike, feet firmly on floor, hands on head or the seat in front","Stands","Lies flat","Covers eyes"],0,"Avec un enfant : on le berce d'un bras qui protège aussi sa tête. · C04 06 03 01 · p.53–54"],
["The silent checklist helps to:",["Mentally prepare and reduce reaction time and surprise in emergencies","Skip steps","Replace training","Save time at boarding"],0,"Elle combine gestes et mémorisation de l'emplacement du matériel. · C04 06 03 02 · p.55"],
["A fire on board:",["Doubles in intensity quickly if not controlled","Dies out","Stays constant","Is harmless"],0,"Un feu de four ou de toilettes mal maîtrisé peut mener à une descente d'urgence puis à une évacuation. · C04 06 03 02 · p.55"],
["In a ditching, massive movement of passengers:",["Compromises the aircraft's attitude","Helps balance","Has no effect","Speeds the landing"],0,"On vérifie aussi la ligne de flottaison avant d'ouvrir une porte. · C04 06 03 02 · p.56"],
["Evacuations can be:",["Predictable (after in-flight incident with preparation) or unpredictable (ground, take-off, landing)","Only predictable","Only unpredictable","Only at night"],0,"Pendant la phase d'alerte, le pilote peut annuler sans évacuer. · C04 06 03 03 · p.58"],
["Passenger confidence in cabin crew is earned by:",["Rigorous demonstrations, clear announcements, uniform, professional attitude and never leaving passengers without information","Staying silent","Avoiding contact","Using jargon"],0,"Sans information, ils se sentent abandonnés et n'obéissent plus. · C04 06 04 · p.60"],
["Nonverbal communication in an evacuation:",["Is as important as verbal; orders are accompanied by firm gestures","Is unimportant","Is forbidden","Is only for ground staff"],0,"La communication avec les secours augmente aussi les chances d'une évacuation efficace. · C04 06 04 · p.61"]
]},
{n:"C05 – Aero-medical & first aid",s:"PDF p.7–105",q:[
["In-flight medical emergencies are broadly divided into:",["Injury-related and health-related situations","Minor and major only","Crew and passenger only","Ground and flight only"],0,"Blessures : turbulences, chute de bagages, brûlures par liquides chauds ou fours. Problèmes de santé : malaise, allergie, AVC, infarctus, décès. · C05 01 · p.7"],
["The first flight attendant at the scene of a medical emergency normally:",["Takes charge of the patient, alerts the other crew and advises the Captain","Waits for a doctor","Leaves to find the purser","Calls ground staff"],0,"Il garde le patient, demande de l'aide pour le matériel d'urgence et informe le commandant des changements d'état. · C05 01 · p.7"],
["For anything other than a very minor complaint, the Purser:",["Makes a PA announcement asking for a doctor or other medical professional","Moves the patient","Asks the patient to leave","Ignores it"],0,"En l'absence de médecin, beaucoup de compagnies ont un contrat avec un service médical (type MedLink) joignable par radio, satellite ou ACARS. · C05 01 · p.8"],
["Who decides whether to continue to the destination or divert in a medical emergency?",["The Captain","The doctor","The purser","The airline's catering"],0,"Il s'appuie sur les informations du PNC, du médecin à bord ou du service médical. Le choix tient compte de l'urgence médicale, de l'exploitation et du commercial. · C05 01 · p.8–9"],
["The atmosphere contains approximately what % of oxygen at all heights?",["21%","50%","10%","78%"],0,"C'est la pression partielle qui chute avec l'altitude, pas le pourcentage. La cabine est pressurisée à l'équivalent de 8 000 ft maximum. · C05 02 02 · p.11"],
["Signs of sudden decompression include:",["A loud bang, flying debris and unsecured items ejected near the breach","A warm breeze","Silence","Slow noise"],0,"Une fuite lente laisse au pilote le temps de descendre d'urgence vers 8 000–10 000 ft. · C05 02 02 · p.12"],
["The Eustachian tube equalizes ear pressure when you:",["Swallow or yawn","Hold your breath","Cough","Lie down"],0,"Le barotraumatisme de l'oreille vient d'un déséquilibre de pression entre l'oreille moyenne et la cabine, surtout en montée et en descente. · C05 02 03 · p.13–14"],
["Airsickness is caused by:",["Conflicting messages to the central nervous system (inner ear, eyes, muscles)","Only dehydration","Only altitude","Cabin pressure only"],0,"Elle est plus fréquente chez les femmes (règles, grossesse), les jeunes enfants et ceux sensibles à d'autres formes de mal des transports. · C05 03 01 · p.17–18"],
["Signs of SEVERE abdominal pain include:",["Signs of shock, a hard belly and high fever","A mild ache","Hiccups","A full stomach"],0,"Péritonite : choc, douleur diffuse, ventre dur, fièvre 40 °C. Appendicite : douleur permanente fosse iliaque droite. · C05 03 02 · p.20"],
["For severe abdominal pain the cabin crew:",["Do not give food or drink, install an analgesic position, inform the captain, give oxygen","Give a large meal","Make them walk","Give coffee"],0,"Position antalgique : souvent sur le côté ou tête basse, jambes relevées ; possible vessie de glace ; appel d'un médecin et surveillance des constantes. · C05 03 02 · p.21"],
["For hyperventilation the crew should NOT:",["Give oxygen","Reassure","Leave the passenger half-seated","Speak to them"],0,"On fait respirer dans un sac en papier ou un sac de vomissement pour récupérer le CO2, mais avec prudence : asthme ou infarctus peuvent être confondus et la méthode peut être dangereuse. · C05 03 03 · p.23–24"],
["Tetany is characterized by:",["Tingling of fingers, feet and mouth, and muscle contraction especially of the hands","Fever","A rash","Bleeding"],0,"Elle suit une hyperventilation liée à l'anxiété : la baisse de CO2 provoque des contractions musculaires. · C05 03 03 · p.24"],
["The severity of a burn depends on:",["Extent, depth, location and age of the victim","Only the cause","Only the color","Only the time"],0,"Localisations les plus graves : visage, organes génitaux, fesses, articulations. Les âges extrêmes sont plus fragiles. · C05 03 04 · p.25"],
["A third-degree burn may be painless because:",["Nerve damage is extensive","The skin is thick","It is minor","It is cold"],0,"C'est le plus grave (blanc cireux, carbonisé, cuir). Ne pas croire qu'il est forcément le plus douloureux. · C05 03 04 · p.26"],
["Wallace rule of nines: the head represents:",["9% in adults and 18% in children","18% in adults","1% in adults","9% in children"],0,"Chaque bras 9 %, thorax 9 %, abdomen 9 %, dos 18 %, chaque jambe 18 % chez l'adulte (13,5 % chez l'enfant), périnée 1 %. · C05 03 04 · p.27"],
["First-degree burn: first aid includes:",["Cooling with water for 10 to 15 minutes","Piercing blisters","Applying butter","Rubbing it"],0,"Puis pansement occlusif, antalgique, surveillance locale et rapport. · C05 03 04 · p.28"],
["With second-degree burn blisters:",["Be careful not to pierce them","Pierce them","Remove them","Rub them"],0,"Refroidir environ 10 min, déshabiller, pansement occlusif. Si brûlure étendue : risque de choc hypovolémique et possible déroutement. · C05 03 04 · p.28"],
["For a chemical burn the crew:",["Remove clothing promptly and rinse for 10 to 15 minutes; do NOT induce vomiting for ingestion","Leave the clothes","Rub it","Induce vomiting"],0,"Puis pansement stérile, surveillance et information du commandant. · C05 03 04 · p.28"],
["With an electric burn, first:",["Make sure the power is turned off before touching the victim","Touch the victim","Cool with water","Give a drink"],0,"Les lésions profondes peuvent toucher cœur, reins et muscles : risque d'arrêt cardiorespiratoire, d'où surveillance et RCP si besoin. · C05 03 04 · p.28"],
["For an open wound, minor bleeding is controlled by:",["Gentle continuous pressure for 20 to 30 minutes with gloves on","Washing it first","Rubbing","Ignoring"],0,"Gants d'abord, puis nettoyer du centre vers l'extérieur, couvrir avec un pansement, et rédiger un rapport. · C05 03 05 · p.30–31"],
["A contusion or hematoma is classed as:",["A closed wound","An open wound","A burn","A fracture"],0,"Premier geste : compression directe avec de la glace enveloppée dans un tissu, surélévation, surveillance près du hublot. · C05 03 05 · p.31–32"],
["With an object stuck in a deep chest or abdominal wound:",["Do not remove the object","Remove it at once","Pull it gently","Rub the area"],0,"Chest : oxygène et position demi-assise. Abdomen : compresser autour sans retirer l'objet. Informer le commandant. · C05 03 05 · p.32"],
["For a fixed object in the eye (e.g. a piece of glass):",["Do not remove it, do not use saline; apply a sterile binocular occlusive bandage","Rub the eye","Use cotton","Pull it out"],0,"Un objet mobile (poussière) peut se rincer avec du sérum physiologique. · C05 03 05 · p.33"],
["For a snake bite or scorpion sting:",["Do not cut the wound or suck out venom; ask for a doctor and keep the victim lying","Cut the wound","Suck the venom","Run"],0,"On évite aussi de placer un lien entre la plaie et le cœur. Appliquer de la glace et surveiller les constantes. · C05 03 05 · p.34"],
["For a bee sting:",["Do not crush or try to extract the stinger","Crush it","Pull it hard","Rub it"],0,"Surveiller le risque d'allergie : œdème de Quincke ou choc anaphylactique. · C05 03 05 · p.34"],
["For severe bleeding, if a pad is soaked:",["Do not remove it; place another pad on top and keep pressing","Remove it","Wash it","Loosen the pressure"],0,"Si ça saigne toujours, on ajoute une pression sur l'artère (pas plus de 5 minutes une fois le saignement arrêté). · C05 03 05 · p.35"],
["The tourniquet is:",["A last resort, placed between the wound and the heart a few cm above, never on a joint","The first choice","Placed on a joint","Loosened every 10 minutes"],0,"Noter l'heure en UTC sur la victime, ne jamais le desserrer ni le cacher : seul un médecin peut le retirer, car le lever peut provoquer un arrêt cardiaque. · C05 03 05 · p.37–38"],
["DRSABCD stands for:",["Danger, Response, Send for help, Airway, Breathing, CPR, Defibrillation","Doctor, Rescue, Safety, Alarm, Blood, Care, Drug","Danger, Rest, Support, Air, Blood, Call, Dress","Doctor, Response, Stop, Assist, Breathe, Call, Defib"],0,"Le premier D : vérifier le danger pour soi, les témoins et le patient avant d'agir. · C05 03 06 · p.41"],
["When checking breathing in an unconscious person, you look, listen and feel for about:",["10 seconds","30 seconds","1 minute","2 seconds"],0,"Ouvrir les voies aériennes (bascule de la tête, élévation du menton), puis RCP à 100–120 compressions par minute si absence de respiration. · C05 03 06 · p.41–42"],
["An open (compound) fracture is when:",["The bone sticks out through the skin or a wound goes down to the bone","The bone is cracked only","The bone is displaced","There is a bruise"],0,"Premiers secours : arrêter le saignement, immobiliser, froid 10 minutes maximum, traiter le choc. · C05 03 07 · p.44"],
["Applying a sling, the forearm is positioned with:",["The hand slightly higher than the elbow (about 10°)","The hand below the elbow","The arm straight","The hand behind the back"],0,"Le nœud se place dans le creux du cou du côté sain (sling n°1). · C05 03 07 · p.46"],
["In an asthma attack the passenger should take:",["One to two puffs of the reliever inhaler every two minutes, up to 10 puffs","One puff per hour","20 puffs at once","No puffs"],0,"Si c'est la première crise ou si le passager n'a pas d'inhalateur, on informe le commandant. · C05 04 01 · p.51"],
["Anaphylaxis symptoms typically begin:",["5 to 30 minutes after contact with the allergen","After 24 hours","Instantly only","After 1 week"],0,"Elle peut tuer en une demi-heure : ne pas attendre une éventuelle amélioration. · C05 04 02 · p.53–54"],
["For anaphylaxis, an epinephrine autoinjector is pressed against:",["The person's thigh","The arm","The neck","The chest"],0,"Allonger la personne sur le dos, desserrer les vêtements, ne rien donner à boire, RCP si pas de respiration. · C05 04 02 · p.54"],
["The shock position is:",["Flat on the back with the feet raised 8–12 inches (if no back, neck or leg injury)","Sitting upright","On the stomach","Head raised"],0,"On ne met rien dans la bouche (humidifier les lèvres si demandé) et on couvre légèrement sans surchauffer. · C05 04 03 · p.55–56"],
["Normal blood glucose is between:",["4 and 7 mmol/l (80–120 mg/dl)","1 and 2 mmol/l","10 and 14 mmol/l","20 and 30 mmol/l"],0,"Au-delà d'environ 11,1 mmol/l (200 mg/dl), le corps élimine le glucose par les reins. · C05 04 04 · p.57,59"],
["Hypoglycaemia differs from hyperglycaemia because its onset is:",["Fast, with cool clammy skin and shaking","Gradual, with sweet breath","Slow, with thirst","Never fast"],0,"L'hyperglycémie est progressive (soif, nausées, haleine sucrée, peau chaude et sèche). La plus fréquente est l'hypoglycémie. · C05 04 04 · p.59–61"],
["Conscious hypoglycaemic casualty: give:",["15–20 g of fast-acting carbohydrate, reassess after 10 minutes","A full meal","Insulin","Nothing"],0,"Répéter jusqu'à trois fois ; si > 4 mmol/l, donner un sucre lent (biscuits, pain, lait). Inconscient : rien par la bouche et informer. · C05 04 04 · p.61"],

const DESC={
"In straight and level flight at constant speed, the aircraft is in equilibrium":"Les 4 forces s'équilibrent deux à deux : la poussée (Thrust, vers l'avant) compense la traînée (Drag, qui freine) et la portance (Lift, vers le haut) compense le poids (Weight, vers le bas). Piège : Thrust > Drag signifierait que l'avion accélère, donc pas d'équilibre.",
"What share of total lift":"La portance vient surtout de la dépression au-dessus de l'aile : 75 %. Les 25 % restants viennent de l'impact de l'air sous l'aile. À retenir : 3/4 dessus, 1/4 dessous.",
"Which surface controls roll":"Trois axes, trois gouvernes : ailerons = roulis (axe longitudinal, nez-queue) ; elevators = tangage (axe latéral, bout d'aile à bout d'aile) ; rudder = lacet (axe vertical). Les ailerons travaillent en opposition, les elevators ensemble.",
"The rudder moves the aircraft":"Le rudder, articulé à l'arrière de la dérive (vertical stabilizer), fait pivoter le nez de gauche à droite : c'est le lacet (yaw) autour de l'axe vertical. Ne le confonds pas avec les ailerons (roulis) ni les elevators (tangage).",
"Plates on the upper wing surface":"Les spoilers sont des plaques sur le dessus de l'aile qui se relèvent dans le flux d'air pour le perturber et freiner. Slats = bord d'attaque, flaps = bord de fuite (augmentent la portance), trims = petites surfaces sur le bord de fuite d'une grande gouverne.",
"Slats are located on the":"Slats = bord d'attaque (leading edge, à l'avant de l'aile) : sortis, ils permettent à l'aile de voler à plus forte incidence. Mnémo : Slats à l'avant, Flaps à l'arrière.",
"The Protective Breathing Equipment":"Le PBE est une cagoule anti-fumée autonome en circuit fermé : l'oxygène arrive automatiquement dès qu'on l'enfile et le CO2 expiré est neutralisé par une cartouche de chaux sodée. Durée garantie : 15 minutes.",
"How is oxygen produced by most":"Pour les passagers, l'oxygène vient d'un générateur chimique (PSU) : tirer le masque retire une goupille de percussion qui lance une réaction chimique produisant de l'oxygène. Ce ne sont pas des bouteilles dans les sièges ni de l'air des moteurs.",
"Standard atmosphere at sea level":"Atmosphère standard au niveau de la mer : 1013,25 hPa et 15 °C. Ensuite -2 °C par 1000 ft (6,5 °C par 1000 m), jusqu'à -56,5 °C minimum. La pression ne baisse pas linéairement car l'air est compressible.",
"As altitude increases, gas in a closed space":"Loi de Boyle : la pression baisse avec l'altitude, donc le volume d'un gaz enfermé augmente (jusqu'à +20 % à 8 000 ft dans le corps humain). Exemple du manuel : un ballon de 1 L au sol fait 4 L à 35 000 ft.",
"Middle-level clouds form between":"Trois étages : hauts > 20 000 ft (cirro/cirrus, cristaux de glace) ; moyens 6 500–20 000 ft (préfixe alto) ; bas < 6 500 ft (stratus). Les nuages à développement vertical portent le mot cumulus (le Cb en fait partie).",
"Which is NOT required for Cb formation":"Un Cb se forme avec : une couche épaisse d'air instable, de l'air chaud et humide, et un déclencheur (chauffage du sol, relief, front). Un air stable, froid et sec est l'inverse de ces conditions.",
"Clear Air Turbulence mostly occurs":"La CAT survient hors des nuages (donc invisible), au-dessus de 15 000 ft, à cause des forts cisaillements de vent dans le jet stream (vents d'ouest en est). Ne la confonds pas avec la turbulence de Cb ou de montagne.",
"Wingtip vortices can persist":"Les tourbillons de bout d'aile sont stables et durent jusqu'à 3 minutes après le passage de l'avion. Le jetwash (gaz d'échappement) est très turbulent mais très bref.",
"Volcanic ash in the engines":"Les cendres sont avalées par les réacteurs, fondent puis se collent aux composants internes : risque de panne moteur. Elles abîment aussi le pare-brise. Cas cité : KLM 867 (1989, Mont Redoubt), quatre moteurs perdus.",
"De-icing fluid protection time":"Le liquide (glycol + eau, avec colorant) protège de 2 minutes à 2 heures selon le liquide, la température et la météo. Le dégivrage se fait à la porte, après repoussage sur l'aire, ou sur une zone dédiée.",
"Cabin crew training on surface contamination":"Le PNC n'applique pas le liquide et ne décide pas du décollage : il doit connaître les effets de la contamination des surfaces et signaler au pilote toute observation (glace ou givre visible depuis un hublot).",
"'Wilco' means":"Roger = reçu/compris ; Wilco (will comply) = je vais l'exécuter. Affirmative = oui ; Negative = non ; Standby = attendez. Roger ne dit pas qu'on va agir, juste qu'on a reçu.",
"'PAN-PAN' indicates":"PAN-PAN = urgence mais pas de danger vital immédiat (problème avec l'avion ou ses occupants). MAYDAY = détresse, danger de mort. Les deux se disent trois fois.",
"'MAYDAY' is":"MAYDAY est l'appel de détresse international (danger de mort), dit trois fois, et il passe avant tous les autres messages. PAN PAN signale une urgence moins grave.",
"Unexpected turbulence without the seat belt sign on":"Si on ressent des turbulences alors que le signal ceinture n'est pas allumé, c'est le Purser qui informe le poste de pilotage. Phrase type : 'Here's the cockpit, cabin crew turbulence'.",
"Which message has the highest priority":"Ordre de priorité : distress (mayday) > emergency (pan pan) > messages ATC (clearances) > informations de vol > messages compagnie-équipage (ACARS).",
"A PA system is required if":"Chiffres à retenir : PA obligatoire au-delà de 19 sièges ; mégaphones au-delà de 60 sièges (1 pour 61–99 sièges, 2 à partir de 100, par pont) ; PA utilisable en 10 secondes maximum.",
"Portable megaphones are required above":"Mégaphones : au-delà de 60 sièges. Ne confonds pas avec le PA, obligatoire au-delà de 19 sièges.",
"Megaphones required for 100+":"Par pont passagers : 61 à 99 sièges = 1 mégaphone ; 100 sièges et plus = 2.",
"The three types of passenger announcements":"Commerciales (bienvenue, progression, services), opérations normales (embarquement, décollage, descente) et urgence (turbulence, descente d'urgence, évacuation, urgence médicale).",
"An occurrence report differs":"Incident report = événement qui pourrait menacer la sécurité sans blessure ni dommage important (urgence médicale, passager perturbateur, panne). Occurrence report = événement plus grave avec blessure ou dommage (accident, feu, forte turbulence), pour chercher les causes racines.",
"'INOP' on the tech log":"INOP = inoperative : un système ou une pièce ne fonctionne pas comme prévu. Le commandant signe le tech log et l'avion peut partir si le défaut est réparé ou toléré par la MEL.",
"Gesture 'Recommend stop'":"Gestes avec les pompiers : stop = bras croisés aux poignets devant la tête ; feu = main droite en éventail de l'épaule au genou et main gauche qui pointe le feu ; emergency contained = bras à 45° qui se croisent sous la taille ; recommend evacuation = bras horizontal, main levée, mouvement d'appel vers l'arrière. De nuit : pareil avec des bâtons lumineux.",
"Which is NOT a reason cabin crew hesitate":"Trois raisons de réticence à parler au cockpit : doute sur l'importance de l'information, peur d'être remis à sa place ou renvoyé, crainte de violer la règle du sterile cockpit. D'où l'intérêt du CRM.",
"Below 29,000 ft, minimum vertical separation":"Séparation verticale minimale : 1 000 ft en dessous de 29 000 ft ; 2 000 ft (600 m) au-dessus, sauf en espace RVSM.",
"INCERFA is the":"Trois phases SAR, de la moins grave à la plus grave : INCERFA (incertitude), ALERFA (alerte), DETRESFA (détresse). ALERFA est le deuxième niveau, pas le premier.",
"Minimum age for a cabin crew attestation":"CC.GEN.020 : 18 ans minimum. L'attestation est de durée illimitée mais devient invalide si les privilèges ne sont pas exercés pendant 60 mois sur un type d'avion.",
"Cabin crew medical checks are required":"Contrôle médical avant de commencer, puis tous les 5 ans (MED.C.005(b)), uniquement par des professionnels qualifiés. Après chaque contrôle, un rapport médical est remis à la compagnie.",
"A passenger is considered an adult":"Adulte dès 12 ans ; enfant de 2 à 12 ans ; bébé (infant) avant 2 ans. Un siège ne peut être occupé que par une personne, sauf un adulte avec un bébé.",
"Exit row seats may be occupied by":"Un ABP est un passager valide, assez fort et apte à aider à l'évacuation. Interdits en rangée d'issue : enfants de moins de 12 ans, PMR, passagers ne comprenant pas les instructions, personnes avec animaux, personnes escortées.",
"A refuelling 'clear area'":"Une zone dégagée fait au moins 4 x 11 m. L'escape route minimale peut être : un moyen d'embarquement + une zone, deux moyens, ou deux zones (portes fermées seulement).",
"The sterile cockpit threshold":"Sterile cockpit : sous FL100 (10 000 ft) en montée comme en descente, pas de communications ni d'activités non essentielles. Le PNC ne contacte le cockpit que pour une urgence de sécurité.",
"Alcohol: crew should not drink":"Pas d'alcool moins de 8 h avant la prise de service ; taux ≤ 0,2 pour mille en début de service ; aucun alcool pendant le service ni en astreinte. Après un don de sang ou une plongée, attendre au moins 24 h.",
"The maximum basic daily FDP":"FDP de base : 13 h, réduit de 30 min par secteur à partir du 3e (2 h de réduction maximum). Équipage renforcé : 16 h (4 atterrissages max) ; double équipage : 18 h (6 atterrissages max).",
"The reporting time before the first off-block":"Présentation 60 min avant le premier off-block, 90 min s'il y a un secteur ETOPS. Les 30 min de tâches après vol comptent dans le FDP.",
"Rest before an FDP":"Repos avant un FDP : au moins la durée du service précédent ou 12 h à la base (10 h hors base), la plus longue des deux.",
"Cumulative duty hours must not exceed 60":"Limites cumulées : 60 h en 7 jours, 190 h en 28 jours, 1800 h en 12 mois (2000 h pour ceux avec une part importante de travail de bureau).",
"Signs of rapid decompression":"Décompression rapide : bruit fort, froid intense, débris, brouillard dense (condensation, qui peut déclencher les détecteurs de fumée). Réaction du PNC : masque le plus proche, le mettre de façon démonstrative, s'asseoir.",
"The evacuation command is":"Le commandant ordonne 'EVACUATE' trois fois et active le signal d'évacuation. Si rien ne vient du cockpit mais que l'évacuation est évidente, le Purser la déclenche. 'Remain seated' signifie le contraire."
};
const dsc=t=>{for(const k in DESC)if(t.startsWith(k))return DESC[k];return''};
let cp=0,Q=null,used=P.map(()=>new Set());
const $=id=>document.getElementById(id),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function tabs(){$("tabs").innerHTML=P.map((p,i)=>`<button class="tab ${i==cp?'on':''}" onclick="cp=${i};Q=null;tabs();home()"><b>${p.n}</b><small>${p.q.length} questions · ${p.s}</small></button>`).join("")}
function home(){const p=P[cp],n=p.q.length,u=used[cp].size;
$("v").innerHTML=`<div class="card"><h2 style="margin:0">${p.n}</h2><p class="mu">${p.s}</p>`+(n?`<p>Banque : <b>${n}</b> questions · déjà tirées : <b>${u}</b></p><button class="btn" onclick="start()">Lancer un quiz de ${Math.min(25,n)} questions</button>${u?'<button class="btn alt" onclick="used[cp].clear();home()">Réinitialiser les questions tirées</button>':''}`:`<p>Cette banque est en cours de remplissage.</p>`)+`</div>`}
function start(){const p=P[cp],k=Math.min(25,p.q.length);let pool=p.q.map((_,i)=>i).filter(i=>!used[cp].has(i));if(pool.length<k){used[cp].clear();pool=p.q.map((_,i)=>i)}
const ids=sh(pool).slice(0,k);ids.forEach(i=>used[cp].add(i));
Q={l:ids.map(i=>{const q=p.q[i],o=sh(q[1].map((t,j)=>({t,c:j==q[2]})));return{q:q[0],o,e:q[3],d:dsc(q[0])}}),i:0,s:0,a:null,w:[]};show()}
function show(){const x=Q.l[Q.i],n=Q.l.length;
$("v").innerHTML=`<div class="card"><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><div class="mu">Question ${Q.i+1} / ${n} · Score ${Q.s}</div><h3>${x.q}</h3>`+x.o.map((o,j)=>`<button class="opt" onclick="ans(${j})">${o.t}</button>`).join("")+`<div id="fb"></div></div>`}
function ans(j){if(Q.a!==null)return;Q.a=j;const x=Q.l[Q.i],b=document.querySelectorAll(".opt");b.forEach((e,k)=>{if(x.o[k].c)e.classList.add("ok");else if(k==j)e.classList.add("ko")});
if(x.o[j].c)Q.s++;else Q.w.push({q:x.q,g:x.o.find(o=>o.c).t,m:x.o[j].t,e:x.e,d:x.d});
const last=Q.i==Q.l.length-1;$("fb").innerHTML=`<div class="ex">${x.o[j].c?"✅ Correct":"❌ Incorrect — tu as répondu : <b>"+x.o[j].t+"</b>"}<br>${x.e}${x.d?"<br><br>💡 "+x.d:""}</div><button class="btn" onclick="nx()">${last?"Voir mon score":"Suivante →"}</button>`}
function nx(){Q.a=null;Q.i++;Q.i<Q.l.length?show():fin()}
function fin(){const n=Q.l.length,pc=Math.round(Q.s/n*100),p=P[cp],left=p.q.length-used[cp].size;
$("v").innerHTML=`<div class="card"><div class="mu">${p.n}</div><div class="big">${Q.s} / ${n}</div><p>${pc}% de bonnes réponses</p><button class="btn" onclick="start()">Recommencer avec ${Math.min(25,p.q.length)} nouvelles questions</button><button class="btn alt" onclick="Q=null;home()">Retour</button><p class="mu">${left>=25?left+" questions pas encore tirées":"La banque sera remélangée au prochain tirage"}</p></div>`+(Q.w.length?`<div class="card"><b>À revoir (${Q.w.length})</b>`+Q.w.map(w=>`<div class="rv"><b>${w.q}</b><br>❌ ${w.m}<br>✔ ${w.g}<br><span class="mu">${w.e}</span>${w.d?"<br>💡 "+w.d:""}</div>`).join("")+`</div>`:"")}
tabs();home();
</script></body></html>
