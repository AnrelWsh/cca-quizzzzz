["Non-physical barriers include:",["Language and cultural differences, stress or emotion, unequal knowledge and unfamiliar jargon","Distance, noise, poor acoustics and sensory or physical disabilities","Poor lighting, the separation between flight deck and cabin, and noise","Distance, physical disability and a closed cockpit door, but not language"],0,"On adapte les mots ou le canal et on vérifie la compréhension. · C02 01 00 02 · p.7–8"],
["Different perceptions arise from:",["Experience, culture and bias, which change how the same message is interpreted","Hearing loss and distance, which change how the same message is heard","Accents and speed of speech, which change how the same message is understood","Stress and emotional state, which change how the same message is received"],0,"On les réduit par l'écoute active et la recherche d'un terrain commun. · C02 01 00 02 · p.8"],
["Culture-linked factors include:",["Eye contact, personal space, gestures, attitudes to authority, values and communication style","Seat class, age, first language and the length of the flight","Language only, since gestures and attitudes to authority are universal","Eye contact, personal space and gestures, but not values or attitudes to authority"],0,"Sans en tenir compte, des malentendus ou des conflits peuvent naître. · C02 01 00 02 · p.7"],
["To adapt a message across cultures:",["Use clear, concise language, add context and visual or non-verbal cues without weakening the safety action","Use technical terms and speak faster to keep the message short, without extra context","Use a softer message that removes the safety action when passengers seem reluctant","Rely on the passenger's language skills and avoid visual or non-verbal cues"],0,"On reste calme, respectueux et ferme. · C02 01 00 02 · p.8"],
["Respectful verification includes:",["Active listening, seeking the passenger's perspective, confirming understanding and escalating if it cannot be closed safely","Active listening, seeking the passenger's perspective, confirming understanding and escalating if it can be closed safely","Passive listening, seeking the passenger's perspective, confirming understanding and escalating if it cannot be closed safely","Assuming understanding"],0,"La relecture (read back) valide la compréhension. · C02 01 00 02 · p.8"],
["Active listening as a closed loop means:",["Attend, clarify missing information, read back or confirm key facts, act and report","Attend, wait silently, act and report, without clarifying or confirming key facts","Attend, clarify, give the instruction again louder, and wait for the passenger to react","Attend, read back the message to yourself, and report only if the passenger asks"],0,"Le sens partagé est vérifié, pas supposé. · C02 01 02 01 · p.14"],
["Written communication gives:",["A traceable factual record for handover, follow-up and safety management","A private record for the crew member's own training, kept outside the airline's safety system","A passenger-facing receipt of any incident, handed over at disembarkation","A verbal handover to the next crew, with no written trace required"],0,"Les rapports aident aussi à la formation. · C02 01 03 06 · p.34"],
["A good report contains:",["Flight, date and time, who or what, location, observations, actions, outcome and follow-up in chronological factual language","Flight and date, the crew member's opinion of who was at fault, and a summary of the outcome","Location, observations and actions in the order the crew member remembers them, with the date added later","Flight, date and time, a diagnosis of the cause, and the crew member's personal view of the outcome"],0,"Les défauts techniques entrent dans la chaîne du carnet technique (INOP, MEL). · C02 01 03 06 · p.34–36"],
["Passenger communication relies on:",["Briefings, demonstrations and announcements through direct speech, PA, safety card or megaphone with the required action clear","Written notes and gestures only, since the PA and megaphone are for the flight crew","Safety briefings given once at boarding and announcements in the operator's language only","Demonstrations and the safety card only, with the PA used only for commercial announcements"],0,"Les gestes deviennent le moyen principal si l'équipement est inutilisable. · C02 01 03 03 · p.20–23"]
]},
{n:"C04 – Passenger handling",s:"PDF p.7–63",q:[
["Cabin crew must make sure passengers have taken their allocated seats. If in doubt or in case of difficulty, they:",["Inform the Captain, who can decide to modify the load sheet","Inform the Purser, who can decide to modify the load sheet","Inform the Captain, who cannot decide to modify the load sheet","Move passengers themselves"],0,"La répartition des passagers doit correspondre au load sheet pour respecter les limites de centre de gravité. En cas de doute, c'est le commandant qui peut modifier le load sheet. · C04 01 01 01 · p.7","In case of doubt or difficulty in applying this measure, inform the Captain who can decide to modify the load sheet. - Restrictions for Special Categories of Passengers Seat allocation in an aircraft is a procedure carried out with precision, ensuring both comfort and safety. (p.7)"],
["Which is NOT listed as a special category of passenger (SCP)?",["Persons with reduced mobility","Infants and unaccompanied children","Deportees or persons in custody","A passenger with a business-class ticket"],3,"Les SCP sont ceux qui pourraient avoir des difficultés ou gêner une évacuation : PRM, sensoriels, âgés/fragiles, obèses, enfants/bébés, personnes escortées et passagers avec animaux. Le tarif du billet n'entre pas en jeu. · C04 01 01 02 · p.7"],
["Seat restrictions for SCPs mainly mean:",["Avoiding emergency exit rows and keeping access to aisles","Seating them in first class, where there is more space","Seating them at the back, away from the exits","No restriction, as long as they are accompanied"],0,"Un SCP ne doit pas occuper un siège donnant accès direct à une issue de secours ni gêner l'accès aux allées, afin de ne pas ralentir l'évacuation. · C04 01 01 02 · p.8"],
["A recognised assistance dog travelling in the cabin:",["Is secured with a harness provided by the owner during taxi, take-off, landing and turbulence","Must always sit at a window by EASA rule, harnessed and muzzled","Must always be muzzled by EASA rule, wherever it sits","Is free to move in the aisle, supervised by the owner"],0,"Le propriétaire fournit un harnais adapté ; en croisière, un moindre maintien peut être accepté selon la procédure de la compagnie. L'EASA n'impose ni muselière ni siège hublot universels. · C04 01 01 03 · p.8","The dog is secured during taxi, take-off, landing and turbulence; less restraint may be acceptable in cruise under the operator procedure. · Seating and evacuation A passenger travelling with an animal must not occupy a seat with direct access to an emergency exit. (p.8)"],
["Under CAT.OP.MPA.155(d), who must be notified in advance when SCPs are carried?",["The commander","The caterer","The purser only","The passengers"],0,"Le commandant doit être informé à l'avance de la présence de SCP à bord. · C04 01 02 · p.9","(d) The commander shall be notified in advance when SCPs are to be carried on board. 1. (p.9)"],
["Unaccompanied children require special attention from the crew:",["From boarding until they are handed over to the designated guardian or airport official","Only during take-off, landing and emergencies, with a guardian watching the rest of the flight","From the gate until the aircraft doors close, then handed to the purser for the rest of the flight","Only during meal service and disembarkation, with the guardian responsible during the flight"],0,"La prise en charge couvre tout le vol, de l'embarquement jusqu'à la remise à la personne désignée. · C04 01 02 · p.10","Unaccompanied minors require special attention from the crew, from boarding until they are handed over to the designated guardian or airport official upon landing. (p.10)"],
["Deportees may require:",["Isolated seating away from other passengers","A seat at an emergency exit","No special measure","Free upgrades"],0,"Ils peuvent être accompagnés par des agents et nécessitent une coordination particulière pour la sécurité de tous. · C04 01 02 · p.10","They may require isolated seating away from other passengers. (p.10)"],
["For an adult travelling with an infant, cabin crew must:",["Demonstrate the brace position for a lap-held infant, explain the loop belt, and tell the adult to put their own oxygen mask on first","Demonstrate the brace position for a lap-held infant, explain the loop belt, and tell the child to put their own oxygen mask on first","Tell them to hold the infant tightly with no brace","Seat them at the exit"],0,"L'adulte doit d'abord assurer sa propre protection (masque) avant d'aider le bébé ; on explique aussi la ceinture-boucle et l'évacuation avec un bébé. · C04 01 02 · p.11","Unaccompanied child - Inform the neighboring passenger to assist the child in specific situations like fitting an oxygen mask or calling for a crew member. - Demonstrate the brace position for an adult with a lap-held infant. - Provide information on the loop belt usage. - Prioritize own oxygen mask before assisting the infant. (p.11)"],
["Briefing an unaccompanied child includes:",["Seat belt, oxygen mask, safety card, and asking an adult neighbor to help","Seat belt, oxygen mask, safety card, and asking an child neighbor to help","Nothing, they are too young","Only the brace position"],0,"Le neighbor adulte est informé pour aider l'enfant (masque, appel d'un PNC). · C04 01 02 · p.11","SCP Category Type of Information Cabin Crew Must Provide - Inform the child about seat belt operation and oxygen mask usage. - Explain the passenger safety briefing card. - In case of evacuation, advise to seek the assistance of adult passengers or contact a crew member. (p.11)"],
["When children aged 2 to under 12 are grouped together, there must be:",["At least one accompanying adult for every group of up to twelve children","At least one accompanying child for every group of up to twelve children","One adult per two groups","One adult per child"],0,"S'ils sont dispersés, un adulte doit être assis près de chacun. Les deux règles peuvent s'appliquer sur un même vol. · C04 01 02 · p.13","When these children are grouped together in the cabin, there should be at least one accompanying adult for every group of up to twelve children, irrespective of whether the group has the full count of 12 or fewer. (p.13)"],
["An accompanying passenger for children can be:",["A person 18 or older without responsibility for a child under 2","A person 18 or older without responsibility for a adult under 2","A person over 70 only","Any person over 12"],0,"Des membres d'équipage supplémentaires peuvent aussi jouer ce rôle. L'accompagnateur doit connaître consignes, issues et équipements. · C04 01 02 · p.13"],
["WCHR means a passenger who needs assistance:",["Up to the ramp of the aircraft, then walks up the stairs and to the seat unassisted","Up to the cabin seat, with the passenger unable to walk any distance","Up to the aircraft door, then walks to the seat unassisted","Only inside the cabin, with ground staff assisting up to the aircraft"],0,"WCHR = Ramp ; WCHS = Stairs (jusqu'à la porte de l'avion) ; WCHC = Cabin (jusqu'au siège). · C04 01 02 · p.14","Type of Assistance and Corresponding Level of Mobility for Passengers with Reduced Mobility (PRM) Type of Assistance Level of Mobility Wheelchair to the ramp WCHR Assistance is provided up to the ramp of the aircraft where the passenger walks up the stairs and to the seat unassisted. (p.14)"],
["WCHC means:",["Wheelchair assistance up to the passenger's seat in the cabin","Wheelchair assistance up the stairs to the aircraft door","Wheelchair assistance to the ramp, then walking to the seat","A blind passenger needing a guide dog to the seat"],0,"C comme Cabin : le passager est accompagné jusqu'à son siège. · C04 01 02 · p.14","Wheelchair to the cabin seat WCHC Assistance is provided up to the passenger's seat on board the aircraft. (p.14)"],
["Prisoners in custody are:",["Escorted at all times, restrained as necessary, seated away from exits","Seated at an emergency exit and escorted by a crew member","Not escorted, but monitored by the nearest crew member","Free to move around, with their restraints removed after take-off"],0,"Les déportés sont assis séparément, les inadmissibles surveillés ; la sécurité est la priorité absolue pour les prisonniers. · C04 01 02 · p.16"],
["CAT.OP.MPA.230 requires procedures ensuring that exits and escape paths are clear:",["Before taxiing, take-off and landing","Only after landing","Only at the gate","Only in cruise"],0,"C'est la base réglementaire du maintien des allées et issues dégagées. · C04 01 03 · p.17","This objective is further fortified by CAT.OP.MPA.230, mandating operators to have procedures in place ensuring all exits and escape paths are clear before taxiing, take-off, and landing. (p.17)"],
["During boarding, bulky items that cannot be safely stowed are:",["Tagged for gate check-in or placed in designated stowage areas","Taken by the passenger to the seat and held on the lap","Placed at the exit and secured with a seat belt","Left in the aisle with the crew's agreement until the end of boarding"],0,"On surveille le placement des bagages pour que rien ne dépasse dans l'allée. · C04 01 03 · p.17","Check for large or bulky items that cannot be safely stowed and tag them for gate check-in or place them in designated stowage areas. (p.17)"],
["CAT.OP.MPA.160 requires that:",["Only hand baggage that can be adequately and securely stowed is taken into the cabin, and baggage that might cause injury or obstruct is stowed to prevent movement","Only hand baggage that cannot be adequately and securely stowed is taken into the cabin, and baggage that might cause injury or obstruct is stowed to prevent movement","All baggage is in the cargo hold","Passengers choose where to stow"],0,"Deux exigences : bagages à main correctement arrimables, et tout objet dangereux ou gênant arrimé. · C04 02 01 02 · p.19","(a)only hand baggage that can be adequately and securely stowed is taken into the passenger compartment; and (b)all baggage and cargo on board that might cause injury or damage, or obstruct aisles and exits if displaced, is stowed so as to prevent movement. (p.19)"],
["Under-seat stowage is allowed only if:",["The seat has a restraint bar","The passenger agrees","The bag is small","Never"],0,"On ne met jamais d'objets dans les toilettes ni contre des cloisons non étiquetées. · C04 02 01 03 · p.20","Only use under-seat stowage if the seat has a restraint bar, ensuring the item can be adequately restrained. (p.20)"],
["Stowage checks must be made:",["Before take-off, before landing and when the seat belt sign is on","Only at the end of the flight, once the passengers have left","Only at boarding, then at the end of the flight","Never, if the aircraft is full and the crew are busy"],0,"Des contrôles réguliers évitent les projectiles et les obstructions. · C04 02 01 03 · p.21","Regular checks are essential. . . . . before take-off, before landing, when the 'fasten seat belts' sign is on to confirm all items are securely stowed. (p.21)"],
["In the passenger compartment, cargo carriage:",["Allows no dangerous goods, and only guide dogs and pets under 8 kg","Allows dangerous goods in the aisle","Allows any pet","Has no limit"],0,"Le fret ne doit pas dépasser les limites de charge du sol ou des sièges ni gêner issues ou vision de l'équipage. · C04 02 01 03 · p.21"],
["With a passenger who has drunk too much, the first reaction is to:",["Use a considerate and friendly tone, notify the purser and maintain discreet surveillance","Use a considerate and friendly tone, notify the Captain and maintain discreet surveillance","Use a considerate and friendly tone, notify the commander and maintain discreet surveillance","Serve more alcohol"],0,"L'alcool est interdit au passager, que l'on cherche à isoler en restant disponible mais autoritaire. · C04 03 01 · p.23","In flight, when faced with a passenger who has been drinking too much, the first thing to do is to adopt a considerate and friendly tone, notify the purser and maintain discrete surveillance. (p.23)"],
["With a psychiatric patient under drug influence, the crew should:",["Stay calm, be persuasive, inform the captain; physical restraint only as the ultimate resource","Stay calm, be persuasive, inform the Purser; physical restraint only as the ultimate resource","Use physical restraint immediately","Leave him alone"],0,"Son agressivité est souvent une réaction impulsive à l'anxiété ; on évite toute action répressive. Une déviation peut être envisagée. · C04 03 02 · p.25"],
["Annex 17 to the Chicago Convention and the Tokyo Convention (1963) define disruptive passengers as people who:",["Fail to respect rules of conduct or follow instructions, disturbing good order and discipline","Are rude or noisy only at the airport, without disturbing the crew or good order and discipline","Are anxious or afraid of flying and so disturb good order and discipline on board","Disturb only ground staff at the airport, with no effect on the aircraft or its occupants"],0,"Ils menacent l'ordre et la sécurité à bord. · C04 03 03 01 · p.28","The Annex 17 to the International Civil Aviation Organisation (ICAO) Chicago Convention and The Tokyo Convention (1963) both define disruptive passengers as individuals who fail to respect rules of conduct or follow instructions on board an aircraft or at an airport, and thereby disturb the good order and discipline. (p.28)"],
["The single factor that triggers the majority of unruly passenger events is:",["Intoxication","Long queues","Baby crying","Noise"],0,"Parmi les causes (fatigue, anxiété, files d'attente, etc.), l'ivresse est la première. · C04 03 03 01 · p.29"],
["ICAO threat levels: Level 2 is:",["Physically abusive behavior","Verbal disruptive behavior","Life-threatening behavior","Breach of the flight crew compartment"],0,"Niveau 1 = verbal ; 2 = physique ; 3 = danger de mort ou arme ; 4 = tentative ou intrusion dans le cockpit. · C04 03 03 01 · p.29","Level 2 — Physically abusive behavior; . (p.29)"],
["At threat levels 1 or 2 cabin crew should:",["Inform the passenger of the consequences, verbally or with a warning card, and that no more alcohol will be served","Inform the passenger of the consequences, verbally or with a warning card, and that no less alcohol will be served","Restrain immediately","Ignore the passenger"],0,"Le message demande de cesser sous peine de refus de transport ou de poursuites. · C04 03 03 01 · p.30"],
["Restraining devices are considered:",["Only when all conciliatory approaches have failed, and then stay on for the flight","As a first step with any passenger who refuses an instruction, and removed once the passenger calms down","Only on the ground after landing, by security staff, and never while the aircraft is in flight","Only when conciliatory approaches have failed, and removed after thirty minutes if the passenger is calm"],0,"Toute intervention est documentée avec des témoignages. · C04 03 03 01 · p.30","Restraining devices should only be considered when all conciliatory approaches have failed. (p.30)"],
["With passengers who ignore instructions, the 'demonstrative approach' means:",["Physically showing them, e.g. how to fasten a seat belt","Calling security and the captain at once, without speaking to the passenger","Shouting the instruction louder, then ignoring the passenger if they do not react","Ignoring the passenger until the end of the flight, then reporting"],0,"Approche progressive : message poli, démonstration, ton ferme, intervention du chef de cabine ou du commandant, puis documentation. · C04 03 03 02 · p.32"],
["Passengers with a medical condition who informed the airline before the flight fall into:",["Advance notice conditions","In-flight emergent conditions","Unruly passengers","SCP with animals"],0,"Contrairement aux urgences en vol, qu'on ne peut pas préparer à l'avance. · C04 03 03 03 · p.33","Advance Notice Conditions Passengers who've informed the airline in advance about their medical conditions. (p.33)"],
["EASA's main PED precaution is to:",["Switch them off during critical phases such as take-off and landing","Ban them for the whole flight, whether or not they are approved","Use them freely during the flight, except for radio transmitting functions","Charge them during critical phases to keep the batteries safe"],0,"Les appareils émettant des ondes radio sont interdits sauf s'ils sont approuvés pour l'avion. · C04 03 03 04 · p.34","In summary, the main precaution to use of PEDs on aircraft according to EASA is to switch them off during critical phases of flight, such as takeoff and landing. (p.34)"],
["In moderate turbulence:",["Walking through the cabin is not recommended unless necessary","Walking is impossible, and unsecured items are thrown across the cabin","Liquids stay still in containers, and walking is easy","Nothing is felt, and passengers may walk without restrictions"],0,"En sévère, on marche impossiblement et les objets deviennent des projectiles. · C04 05 01 · p.37","Walking through the cabin is not recommended unless necessary.  Severe turbulence: (p.37)"],
["The phrase for unexpected severe turbulence is:",["'HERE IS THE COCKPIT, cabin crew seated and fastened, severe turbulence'","'HERE IS THE COCKPIT, cabin crew at station, severe turbulence'","'HERE IS THE COCKPIT, cabin crew seated and fastened, moderate turbulence'","'HERE IS THE COCKPIT, purser is required forward, severe turbulence'"],0,"Les PNC informent vite les passagers, sécurisent le matériel (cafetières au sol) et s'attachent au siège le plus proche. · C04 05 01 · p.38","\"HERE IS THE COCKPIT, cabin crew seated and fastened, severe turbulence\". (p.38)"],
["After turbulence, the cabin crew return to duty:",["With the permission of the flight crew","Whenever they want, once the sign is off","After 10 minutes, whatever the flight crew say","After landing, with the flight crew's permission"],0,"Ils attendent le feu vert du cockpit. · C04 05 01 · p.38","To return to duty, the cabin crew must have the permission of the flight crew. - Unexpected severe turbulence: (p.38)"],
["During light turbulence:",["Service continues and the Purser reports to the flight crew","Service continues and the Commander reports to the flight crew","Service continues and the Captain reports to the flight crew","Passengers evacuate"],0,"Les PNC annoncent le port de la ceinture et vérifient aussi les toilettes. · C04 05 01 · p.38"],
["During night flights cabin crew must be especially vigilant to:",["Check the seat belts of sleeping passengers","Turn all lights on to wake sleeping passengers","Serve meals to passengers who are awake and keep the aisle clear","Open the doors to check outside before landing"],0,"Le signal ceinture longtemps allumé peut provoquer de la négligence. · C04 05 02 · p.39"],
["Fire prevention duties include:",["Monitoring lavatories, checking ovens and galleys, enforcing no smoking","Monitoring lavatories, checking ovens and galleys only after take-off, and ignoring electrical faults","Monitoring the cabin for smokers only, checking the ovens at the end of the flight and keeping the galley closed","Checking the ovens and galleys, monitoring lavatories only on request and enforcing no smoking in the cockpit"],0,"On reste attentif aux odeurs, bruits ou comportements anormaux des systèmes. · C04 05 02 01 · p.39"],
["In galleys, crew make sure that:",["No flammable materials such as napkins are left near or in heated equipment","No flammable materials such as napkins are right near or in heated equipment","Circuit breakers are ignored","Paper is stored in ovens"],0,"On surveille aussi les tableaux électriques et les disjoncteurs. · C04 05 02 01 · p.40","Galleys, ensuring that no flammable materials, such as paper napkins, and towels are not left near or in heated galley equipment. (p.40)"],
["A fire containment bag may be carried in case of:",["A mobile phone, laptop or power bank catching fire","A galley oven failure or an engine fire","A cabin fire caused by a lavatory waste bin","Turbulence that causes passengers' items to spill"],0,"On vérifie aussi que l'AED fonctionne (voyant fixe ou clignotant) et que l'ELT est armée avec antenne. · C04 05 02 02 · p.41","A fire containment bag may also be carried in case of a mobile phone, laptop or power bank catching fire. (p.41)"],
["If a baggage compartment malfunctions, the cabin crew:",["Report it to the captain","Report it to the Purser","Leave it open","Ignore it"],0,"Avant le décollage, tous les compartiments doivent être fermés et verrouillés. · C04 05 02 06 · p.44","In case of any malfunction of the compartments, the cabin crew will report it to the captain to take the necessary action. (p.44)"],
["Before moving off stand, lavatories must be:",["Checked unoccupied, properly secured, with the 'occupied' sign off","Checked occupied, properly secured, with the 'occupied' sign on, to prevent passengers from entering","Checked unoccupied, left unlocked and open so that the lights stay on during taxi","Checked unoccupied and properly secured, with the 'occupied' sign on, so that no passenger can use them"],0,"Tout dysfonctionnement est signalé au commandant. · C04 05 02 07 · p.45","They will also ensure that all lavatories are properly secured and that the \"occupied\" sign is turned off. (p.45)"],
["An able-bodied passenger (ABP) is chosen because he/she is:",["Physically and mentally capable, ideally with the same mother tongue as the crew and motivated","Seated closest to the exit and the first to board, regardless of language or motivation","An adult travelling with children, capable and willing, and ideally speaking the same language as the crew","A crew member's relative who is physically fit, seated at the back, and who has agreed to help in an emergency"],0,"Il se place en bas du toboggan comme point d'assistance. · C04 06 01 · p.46"],
["ABPs open exits in case of crew incapacitation only after:",["Checking the external conditions and on the order of the crew","Immediately, without checking, once the aircraft has stopped","Only after the flight crew have left the cockpit","Only after the cabin crew have confirmed that the engines are shut down, without checking outside"],0,"Son briefing porte d'abord sur la gestion du flux de passagers et la protection du PNC à l'ouverture. · C04 06 01 · p.47","Opening of exits in case of incapacitation of the cabin crew (Only do so after checking the external conditions and on the order of the crew). (p.47)"],
["An aborted take-off is identified by:",["Sudden deceleration, variation in engine noise and possible yaws on the runway","Landing gear retraction, a climb attitude and the seat belt sign switching off","A gentle climb with a steady engine noise and the aircraft yawing to the left","A smooth acceleration with the engine noise increasing and no braking"],0,"Décision du commandant pour raison technique. · C04 06 02 · p.49","Sudden deceleration due to sudden and prolonged braking A variation in engine noise A series of possible yaws on the runway The cabin crew will have to expect: . (p.49)"],
["During an aborted take-off, cabin crew:",["Go to station (alert phase), wait for the flight crew's instructions and prepare for a possible evacuation","Remain secured, face the passengers and, once the aircraft stops, begin an evacuation without waiting for cockpit instructions","Go to station and wait for instructions, but avoid observing the outside to limit distraction from the cockpit orders","Go to the cockpit and ask the flight crew whether to evacuate, leaving the doors unattended"],0,"Ils observent l'extérieur pour déterminer les issues utilisables. · C04 06 02 · p.49","Evacuation could take place as soon as the aircraft comes to a complete stop and the engines are shut down, if there is an imminent danger. - Cabin Crew At Station (alert phase). - Be vigilant to any order coming from the cockpit. - Wait for instructions from the flight crew. - Prepare for a possible evacuation. (p.49)"],
["The actions taken in the first minutes of cabin preparation for forced landing:",["Ensure the success or failure of the preparation (first 2 minutes)","Are only for the Purser, who briefs the other crew afterwards","Do not matter, since the last minutes decide the preparation","Are optional, since the evacuation depends on the flight crew"],0,"Le Purser distribue les tâches par zone, puis informe les passagers (préparation psychologique). · C04 06 03 01 · p.51","The actions taken in the first 2 minutes ensure the success or failure of the cabin preparation. (p.51)"],
["Assistance planned for passengers: how many persons for a disabled person who can only move with difficulty?",["2","1","3","0"],0,"1 personne par enfant, senior, femme enceinte, obèse ou handicapé mobile ; 2 pour celui qui se déplace difficilement. · C04 06 03 01 · p.52"],
["If no time to stow catering equipment before forced landing:",["Put everything in a blanket and place it in the toilets","Hand it to passengers to hold until landing","Leave it in the aisle, secured by the brace position","Throw it out of the exit once the cabin is evacuated"],0,"On vérifie aussi que l'éclairage de secours est armé ou allumé et que les issues sont dégagées. · C04 06 03 01 · p.53","If there is not enough time, put everything in a blanket and place it in the toilets (especially objects that can become projectiles). . (p.53)"],
["The brace command is:",["Repeated by cabin crew until the aircraft has stopped","Given after landing, once the aircraft has stopped","Said once by the Purser, then repeated by the cabin crew","Silent, with crew showing the position instead"],0,"Chaque compagnie a sa phrase, précisée dans son manuel d'exploitation. · C04 06 03 01 · p.54","Immediately before an emergency landing, the cockpit usually gives a pre-arranged signal (such as the command \"Brace for impact\" or \"Cabin crew and passengers, brace brace”, whereupon the cabin crew shouts commands to passengers and repeat them until the plane has safely landed on the ground or ditch. (p.54)"],
["Before opening a door in an evacuation, the crew must:",["Make sure there is no external danger and check the slide's armament","Hold the handle during opening and check the slide afterwards","Wait for ground staff only, then open the door","Open at once, then check the slide's armament"],0,"Ne pas confondre la poignée de désaccouplement et la poignée de percussion d'urgence. · C04 06 03 02 · p.56"],
["The alert phase is the period between:",["'HERE IS THE COCKPIT, CABIN CREW AT STATION' and the start of evacuation or its cancellation","'HERE IS THE COCKPIT, CABIN CREW AT STATION' and the passengers' next meal service","The first sign of fire and 'HERE IS THE COCKPIT, CABIN CREW AT STATION'","The 'cabin crew at station' message and the arrival of rescue services at the aircraft"],0,"Elle est déclenchée par le commandant, ou à la demande du Purser. · C04 06 03 03 · p.57","\"HERE IS THE COCKPIT, CABIN CREW AT STATION\" and the initiation of the evacuation, or the end of the alert phase without evacuation. (p.57)"],

["Where is an ABP placed?",["At the operator-defined position near the relevant exit, e.g. at the bottom of a usable slide","Next to the cockpit door, ready to assist the flight crew","Anywhere in the cabin chosen by the passenger, with a briefing at the exit","In the galley, next to the crew, to help with the equipment"],0,"La position permet d'aider sans délai, par exemple au pied du toboggan ou avec un groupe de passagers précis. · C04 06 01 · p.46–47"],
["An ABP briefing includes:",["One task and position, a trigger, a stopping condition and a teach-back; an exit is opened only after checking outside conditions on crew order or defined crew incapacitation","One task and position, a trigger, a stopping condition and a teach-back; an exit is opened only after checking inside conditions on crew order or defined crew incapacitation","Leaving the aircraft first","Opening any exit at once"],0,"Une seule tâche claire, la démonstration de l'action sur cet avion, et la vérification de la compréhension. · C04 06 01 · p.47"],
["A rejected take-off is recognised by:",["Abrupt sustained braking or deceleration, a change in engine noise and possible yaw on the runway","Abrupt sustained braking or deceleration, a change in engine noise and possible roll on the runway","The seat belt sign switching off","The landing gear retracting"],0,"On anticipe aussi un dépassement de piste ou une position anormale de l'avion. · C04 06 02 · p.49"],
["During a rejected take-off the cabin crew:",["Remain secured at the station, face the cabin, listen for cockpit orders and treat it as an alert, not an automatic evacuation","Stay secured, face the passengers, wait for instructions and treat it as an automatic evacuation once the aircraft stops","Move to the nearest door, prepare to open it and ask passengers to unfasten their belts as soon as braking starts","Remain secured at the station, ignore the cabin, and start the evacuation as soon as the engines are shut down"],0,"L'événement déclenche la phase d'alerte : on reste à son poste et on attend les ordres. · C04 06 02 · p.49"],
["From the station, during a rejected take-off, crew assess:",["Fire, smoke, engines and aircraft position, to use or block the assigned exit if an evacuation is ordered","Hazards inside the cabin only, to decide which passengers to seat at the exit","The aircraft's attitude and the position of the sun, to choose between a night or day evacuation","Only the cabin and the passengers, leaving the outside assessment to the pilots, then opening the exit when ordered"],0,"On observe l'extérieur et la cabine pour choisir les issues utilisables. · C04 06 02 · p.49"],
["Cabin crew act on their own during a rejected take-off only when:",["The aircraft has stopped, engines are shut down, danger is imminent or manifest, and communication or the pilot's capability prevents the normal command","The aircraft has stopped and a passenger reports smoke, even if the cockpit can still be contacted","The engines are shut down and the pilot is able to communicate, but the aircraft has not yet stopped completely","The aircraft is slowing down, danger is imminent and the cabin crew have not yet been told what to do"],0,"Sinon on attend les instructions du commandant et on se prépare à une éventuelle évacuation. · C04 06 02 · p.49"],
["In the forced-landing briefing, NITS stands for:",["Nature, Intention, Time, Special instructions (specificities)","Notice, Information, Tasks, Safety","Name, Incident, Timing, Security","Number, Item, Time, Station"],0,"Le commandant donne la situation d'urgence, son intention, le temps disponible et les instructions spécifiques. · C04 06 03 01 · p.51"],
["After the Captain's briefing, the Purser:",["Listens, confirms (reads back), then assigns cabin zones and tasks","Starts the evacuation, then briefs the crew from the doors","Waits for passengers' questions, then briefs the crew at the galley","Calls the ground to confirm the instructions, then assigns tasks"],0,"Les deux premières minutes sont déterminantes : les priorités vitales sont organisées tout de suite. · C04 06 03 01 · p.51"],
["To protect passengers before a forced landing, the crew:",["Inform and prepare them psychologically, prohibit unnecessary movement, select and brief ABPs and plan help for children and PRMs","Make a PA announcement to calm them, let them move to the exits and select ABPs after landing","Prepare them psychologically, stop movement, and let passengers select their own helpers and assistance for children","Inform them, prohibit unnecessary movement, select ABPs, and leave help for children and PRMs to other passengers"],0,"On détecte les signes de panique (positive ou négative) et on organise l'aide pour enfants, PRM, femmes enceintes et personnes âgées. · C04 06 03 01 · p.51–54"],
["Brace and survival readiness before a forced landing include:",["Briefing and verifying the brace, reminding exit locations, preparing post-evacuation equipment and giving water if time allows in an isolated area","Briefing the brace and reminding exit locations, but preparing survival equipment only after the evacuation is complete","Reminding exit locations and giving water to every passenger, without checking the brace position","Briefing the brace and preparing equipment, while passengers keep belongings and move to the exits for a faster evacuation"],0,"Eau, matériel de survie et gilets sont prévus selon le temps disponible, sans passer avant les priorités. · C04 06 03 01 · p.52–54"],
["Which two types of skills does the manual say are needed to react efficiently and quickly in an emergency?",["Technical skills in rapid equipment handling, and human factor skills (synergy, communication, risk management)","Technical skills in rapid equipment handling and medical skills in first aid","Language skills and legal skills, to explain emergency procedures to passengers","Physical strength and endurance, with equipment handling left to the Purser"],0,"Être efficace, c'est traiter vite l'information, prendre la bonne décision et exécuter correctement. · C04 06 03 02 · p.55","Two types of skills are required in order to react efficiently and quickly: - Technical skills in the rapid handling of equipment... - Human factor skills: synergy, communication and risk management. (p.55)"],
["What does the silent checklist do?",["It lets crew mentally rehearse their station (restraint, outside hazards, exit, commands, ABP, equipment within reach), shortening reaction time and surprise","It lets crew mentally rehearse their station (restraint, inside hazards, exit, commands, ABP, equipment within reach), shortening reaction time and surprise","It is read aloud to passengers","It is only for the Purser"],0,"Elle prépare mentalement à l'urgence et réduit le temps de surprise. · C04 06 03 02 · p.55"],
["Which door-use decisions does the manual list?",["Check no external danger before opening, check slide armament, remember the emergency inflation handle, do not confuse the uncoupling and percussion handles, do not hold the handle when opening, check the waterline for ditching","Open the door as soon as the aircraft stops, hold the handle while opening, and rely on the automatic slide without checking its mode","Check outside only if smoke is visible, check the slide mode after opening, and always prefer the door nearest to the cockpit","Check no external danger, pull the percussion handle before opening, hold the assist handle to step out first, and ignore the waterline in ditching"],0,"Chaque décision d'ouverture est une prise de risque : il faut comprendre la situation avant d'agir. · C04 06 03 02 · p.56"],
["A predictable evacuation follows:",["An in-flight incident (fire, smoke, technical problem) leading to a planned forced landing or ditching, with time for cabin preparation","An in-flight incident (fire, smoke, technical problem) leading to a planned forced take-off or ditching, with time for cabin preparation","A rejected take-off with fire","A sudden take-off event"],0,"À l'inverse, l'évacuation imprévisible résulte d'un événement soudain au sol, au roulage, au décollage ou à l'atterrissage. · C04 06 03 03 · p.57–58"],
["An unpredictable evacuation is:",["A sudden ground, taxi, take-off or landing event with little or no preparation time","An evacuation planned for hours, after an in-flight incident","An evacuation at the gate, with the doors open","An evacuation only after a ditching, with the rafts launched"],0,"Exemples : décollage interrompu, feu évident, danger manifeste. · C04 06 03 03 · p.57–58","Evacuations can be: - predictable: when an incident happens in flight, a cabin preparation will have been carried out. - unpredictable: when an incident happens on the ground, during take-off or landing, no preparation is made. - The flight crew may have to consider evacuation without making an immediate decision. (p.58)"],
["Who orders an evacuation, and when may cabin crew do it?",["The Captain normally; cabin crew only if danger is manifest and urgent and pilot incapacitation or no communication prevents the command","The Purser normally; cabin crew only if danger is manifest and urgent and pilot incapacitation or no communication prevents the command","The Purser always","Any passenger"],0,"Dans ce cas, chaque issue est évaluée avant d'être utilisée. · C04 06 03 03 · p.58"],
["Assertive and reassuring leadership means:",["Showing determination, confidence and authority, staying reassuring and repeating instructions continuously","Showing determination, shouting different orders each time and leaving the cabin once passengers move","Staying silent after the first announcement, with passengers expected to follow the crowd","Leaving the cabin to assess outside, then repeating the instructions only once"],0,"Les passagers ne doivent jamais se sentir abandonnés. · C04 06 04 · p.60"],
["Which commands suit crowd management?",["Positive, very short, loud, rhythmic and repeated, such as 'COME THIS WAY', 'LEAVE EVERYTHING', 'MOVE'","Positive, short and calm commands in a low voice, said once so that passengers can hear them clearly","Detailed explanations of the situation, spoken calmly and repeated only when passengers ask","Short negative commands such as 'DON'T RUN', 'DON'T PUSH', said loudly and repeated"],0,"On dit 'go left' plutôt que 'don't go right'. · C04 06 04 · p.61"],
["Non-verbal direction in an evacuation means:",["Firm arm and hand gestures synchronised with the voice, eye contact, forward posture and an authoritative face, facing the flow","Firm disarm and hand gestures synchronised with the voice, eye contact, forward posture and an authoritative face, facing the flow","Firm arm and hand gestures synchronised with the voice, eye contact, aft posture and an authoritative face, facing the flow","Looking at the floor"],0,"Les gestes renforcent l'ordre et restent lisibles dans le bruit. · C04 06 04 · p.61"],
["Directing passengers to exits means:",["Using only usable exits, blocking and redirecting from an unsafe exit, keeping the flow moving without baggage, and sharing exit status with crew and rescue teams","Using the nearest exit for every passenger, keeping the flow moving, and letting them collect their baggage if time allows","Using only usable exits, blocking unsafe exits without redirecting, and keeping passengers in the cabin until rescue teams arrive","Using only the exits chosen by passengers, keeping the flow moving, and sharing exit status with ground staff only"],0,"Le leadership continue après l'évacuation (regroupement, mise à l'écart). · C04 06 04 · p.61"],
["A pet accepted in the cabin must be:",["Non-dangerous, without strong odour, within the 8 kg limit and accepted by operator and route conditions","Non-dangerous, under 8 kg, carried on the passenger's lap during cruise and in the carrier for take-off and landing","Non-dangerous and without strong odour, with no weight limit if the carrier fits under the seat","Under 8 kg and accepted by the operator, even if it is dangerous or has a strong odour, as long as it stays in the carrier"],0,"Il faut d'abord identifier la catégorie : animal de compagnie, chien d'assistance reconnu ou autre animal de soutien. · C04 04 · p.35–36"],
["The carrier for a cabin pet must be:",["Suitable, closed, ventilated and within cabin-baggage dimensions, with health, vaccination, route and quarantine rules checked","Closed, ventilated and of any size as long as it fits under the seat, with vaccination checked only for international flights","Open at the top for visibility, within cabin-baggage dimensions, with health and quarantine rules checked only on arrival","Suitable and closed, but with no limit on ventilation or dimensions, and no check of health or route documents"],0,"Les règles dépendent du pays et de l'exploitant. · C04 04 · p.35–36"],
["A cabin pet normally stays:",["In its carrier under the seat in front, never in an overhead locker or the aisle, restrained during take-off, landing and turbulence","In its carrier in the overhead locker during take-off and landing, and under the seat in cruise","In its carrier under the seat in front, and released on the passenger's lap during turbulence to reassure it","In its carrier in the aisle by the exit row, secured with the restraint harness during take-off and landing"],0,"Sinon, option soute : conteneur agréé de la compagnie et remise contrôlée. · C04 04 · p.35–36"],
["If cabin conditions for a pet are not met:",["Use the approved hold container with a controlled handover, or refuse the cabin arrangement","Let the passenger decide where to put the pet, with the crew checking later","Put it in an exit row, away from the passenger","Improvise a place in the galley, with the owner's agreement"],0,"Aucun animal, caisse ou harnais ne doit gêner l'accès à une issue, une allée ou le matériel de secours. · C04 04 · p.35–36"],
["A recognised assistance dog is:",["Task-trained, travelling with its passenger under advance notification and the operator's procedure, and not subject to the 8 kg pet limit","A dog with a doctor's prescription and a carrier within the 8 kg pet limit, accepted without advance notification","Any dog trained to be calm, which travels with the passenger under the same procedure as a pet over 8 kg","A task-trained dog, which must travel in an approved carrier in the cargo hold, with the passenger's authorisation"],0,"Il est distingué d'un animal de compagnie. · C04 04 · p.35–36"],
["The course example for a dog too large for a pet carrier is:",["A window seat, harnessed (and muzzled), subject to the actual operator and national procedure","An aisle seat with a harness and muzzle, away from the window, subject to the actual operator procedure","A seat in the exit row so that the dog can be evacuated quickly, harnessed and muzzled, with operator approval","A window seat in a carrier on the passenger's lap, with the dog released once the seat belt sign goes off"],0,"L'EASA n'impose pas de règle universelle sur le siège hublot ou la muselière : c'est l'exploitant et la réglementation nationale qui précisent. · C04 04 · p.35–36"],
["An emotional-support dog with a doctor's prescription:",["Is not automatically a recognised assistance dog and needs explicit operator and destination acceptance and documents","Always travels in the cabin with its owner, since the prescription gives it recognised status","Is exempt from the pet rules, but must travel in a carrier under the seat","Is always accepted by the operator if the destination State has agreed to receive it"],0,"Son statut est séparé de celui du chien d'assistance. · C04 04 · p.35–36"],
["Whatever the animal's status, its position or restraint must not:",["Obstruct an aisle, direct exit access, an escape route, emergency equipment or crew action","Obstruct an aisle or exit access, except during cruise, when the animal can sit on the passenger's lap","Obstruct a window seat, except during critical phases when it must be restrained","Obstruct the aisle only, as long as it does not touch emergency equipment or an exit"],0,"Le passager et l'équipage conviennent de la manière de garder le contrôle. · C04 04 · p.35–36"],
["With a passenger showing a clearly pathological attitude at boarding, airline procedures allow:",["Refusing carriage or disembarking, coordinated with the Captain and ground staff, based on observable behaviour and not a medical diagnosis","Refusing carriage or disembarking, coordinated with the Purser and ground staff, based on observable behaviour and not a medical diagnosis","Treating them as a patient","Seating them at an exit"],0,"On reste calme, on protège les autres passagers, on évite la confrontation et on consigne les faits. · C04 03 01 · p.23"],
["Approaching a passenger who drank too much, the crew should be:",["Considerate, friendly and calm, stop further alcohol, isolate or relocate if appropriate, and stay available but authoritative","Firm and authoritative, stopping alcohol and confronting the passenger in front of other passengers to set an example","Considerate and friendly, but continuing alcohol service to keep the passenger calm and avoiding any mention to the purser","Calm, stopping alcohol and isolating the passenger, but avoiding surveillance so as not to provoke them"],0,"On observe les signes réels avant d'agir. · C04 03 01 · p.23"],
["After alcohol is stopped, the crew:",["Notify the Purser and maintain discreet surveillance, escalating proportionately with one coordinated crew response","Notify the Commander and maintain discreet surveillance, escalating proportionately with one coordinated crew response","Notify the Captain and maintain discreet surveillance, escalating proportionately with one coordinated crew response","Let the passenger roam"],0,"Si la situation monte : informer le poste selon le niveau de menace, prévoir un besoin médical, ne recourir qu'à des mesures autorisées et proportionnées. · C04 03 01 · p.23"],
["With an aggressive passenger on drugs, the crew first:",["Observe aggression, speech, balance, consciousness and breathing, without guessing the substance","Name the substance from the symptoms, inform the captain and restrain the passenger at the first sign of aggression","Show authority, persuade the passenger to calm down and inform the captain only if the aggression continues","Observe symptoms and guess the drug involved, to tell the medical service which treatment to give"],0,"On distingue les besoins de sécurité immédiats et médicaux. · C04 03 02 · p.25"],
["De-escalation with a drug-intoxicated passenger means:",["Staying calm, showing no fear, avoiding repressive confrontation, using persuasion as an ally but firm, and informing the Captain early with medical help","Staying calm, showing no fear, avoiding repressive confrontation, using persuasion as an ally but firm, and informing the Purser early with medical help","Mirroring aggression","Threatening"],0,"Le passager doit sentir un allié ferme, à bonne distance. · C04 03 02 · p.25"],
["Physical restraint is:",["Exceptional and the last authorised resort after conciliatory measures fail; diversion may be considered","Used as soon as a passenger refuses an instruction, and removed once the passenger has calmed down","Exceptional and authorised only by the ground security staff after landing, and never during the flight","A routine measure used with any unruly passenger, with diversion mandatory every time"],0,"Aucune contention improvisée. · C04 03 02 · p.25"],
["The ICAO definition of a disruptive passenger is a person who:",["Fails to respect rules of conduct at an airport or aboard an aircraft, or to follow staff or crew instructions, thereby disturbing good order and discipline","Refuses to follow crew instructions once, but without disturbing any other passenger or the crew's duties","Shows anxiety or fear of flying, which is enough on its own to disturb good order and discipline","Fails to respect rules of conduct on board an aircraft only, and never at the airport or towards ground staff"],0,"L'anxiété seule ne suffit pas : il faut l'effet sur l'ordre et la discipline, avec une menace possible pour la sécurité. · C04 03 03 · p.28","The Annex 17 to the International Civil Aviation Organisation (ICAO) Chicago Convention and The Tokyo Convention (1963) both define disruptive passengers as individuals who fail to respect rules of conduct or follow instructions on board an aircraft or at an airport, and thereby disturb the good order and discipline. (p.28)"],
["Which is an IATA example of unruly behaviour?",["Refusal to comply with safety instructions, such as seat belt, no smoking or PED rules","Complaining politely about a delay, asking to change seats or sleeping through the safety demonstration","Asking for an extra drink, reading a magazine or requesting a different meal during service","Being late at the gate, queuing without a boarding pass or asking questions at the check-in desk"],0,"Autres exemples : stupéfiants illégaux, confrontations verbales ou physiques, gêner l'équipage, menaces, abus sexuels ou harcèlement. · C04 03 03 · p.28"],
["Kicking seat backs or banging tray tables is classed as:",["Other riotous behaviour","A safety instruction refusal","A medical issue","An uncooperative boarding"],0,"Avec crier ou les comportements gênants répétés. · C04 03 03 · p.28"],
["A company policy on unruly passengers starts with:",["A preventive SOP, awareness, staff education and a zero-tolerance approach","Passenger surveys, staff incentives and a focus on punishment of repeat offenders","A reactive procedure for after incidents, with prevention left to ground staff","Only a fines scheme applied after landing, with prosecution discouraged"],0,"On prévient par la détection précoce et l'éducation du personnel. · C04 03 03 · p.29–30","To do this, airlines should develop a Standard Operating Procedure (SOP) for a preventive strategy that emphasizes increased awareness of passenger behavior and education of all employees on the implementation of a \"Zero Tolerance\" policy, the airline's response to disruptive acts, and the consequences of unruly behavior. (p.29)"],
["Early detection must cover:",["The whole journey from check-in and security to the gate, boarding and flight, including monitoring groups and preventing unsuitable passengers from boarding","The flight only, from boarding to landing, with information shared between crew only after take-off","The boarding gate and the flight only, since check-in staff do not observe passenger behaviour","Check-in and security only, since passengers who pass them are no longer monitored in flight"],0,"Les informations sont partagées entre les équipes. · C04 03 03 · p.29–30"],
["Intervention procedures include:",["Clear warnings, stopping alcohol, defusing levels 1–2, crew and Captain coordination, and restraint only after conciliatory approaches fail","Clear warnings, stopping alcohol, defusing levels 1–2, crew and Purser coordination, and restraint only after conciliatory approaches fail","Immediate restraint","Public humiliation"],0,"Avertissement verbal ou carte d'avertissement. · C04 03 03 · p.29–30"],
["Employee support in the policy includes:",["Empowering and supporting crew, conflict and aftermath training, lawful follow-up, and full incident documentation with witness statements","Empowering crew to act alone, short conflict training, avoiding prosecution, and keeping incident records only for serious injuries","Supporting crew only after an injury, with conflict training offered on request and no obligation to document the incident","Training crew on prevention only, discouraging lawful follow-up, and a verbal report with no witness statements"],0,"La trace factuelle est indispensable. · C04 03 03 · p.29–30"],
["The operator must ensure weight and balance stay:",["Within the CG limits of the approved flight manual, or the operations manual if more restrictive, in all operations and flight phases","Within the CG limits of the approved flight manual, or the operations manual if less restrictive, in all operations and flight phases","Within any limits","Only at take-off"],0,"Cela passe par un load sheet fidèle à la réalité. · C04 01 01 · p.7"],
["The load sheet distribution must:",["Match the passengers' actual positions in the cabin","Be changed by passengers who prefer other seats","Be approximate, since small differences have no effect","Be ignored when the cabin is not full"],0,"Les PNC veillent à ce que chacun occupe son siège attribué. · C04 01 01 · p.7","Moreover, it is important that the passenger distribution matches the load sheet. (p.7)"],
["An apparently empty seat is:",["Not automatically available to passengers","Always for children, who need extra space","Reserved for crew, when they are off duty","Free to use, as soon as the doors are closed"],0,"Tout changement important est signalé au commandant pour corriger le load sheet. · C04 01 01 · p.7"],
["For a PRM, the individual safety briefing covers:",["Seat belt, oxygen mask, life jacket, nearest suitable exit and crew assistance, adapted to be understood and checked","A written leaflet and a seat belt reminder, given to the companion rather than to the passenger, with no check of understanding","The seat belt and oxygen mask only, in standard wording, given to the whole group once the safety demonstration is finished","The exit route and life jacket only, delivered by the ground staff at the gate before boarding with no briefing on board"],0,"Le briefing est adapté et on vérifie la compréhension. · C04 01 02 · p.11–12"],
["Assistance to PRMs is planned:",["From boarding to disembarkation according to the passenger's actual mobility and needs (WCHR, WCHS, WCHC)","From the aircraft door to the seat only, according to the WCHR, WCHS or WCHC code without checking the passenger's needs","From check-in to the aircraft only, by ground staff, with no further assistance once on board","In emergency situations only, by capable passengers, and not during boarding and disembarkation"],0,"Le code seul ne décrit pas les besoins réels. · C04 01 02 · p.9–15"],
["The PRM emergency plan includes:",["Evacuation without blocking the main flow, mobility aids possibly left behind, and capable passengers or companions given defined assistance tasks","Evacuation without blocking the main flow, mobility aids possibly right behind, and capable passengers or companions given defined assistance tasks","Leaving them last in the aisle","Carrying everything out"],0,"L'équipage reste informé de la situation. · C04 01 02 · p.9–15"],
["Cabin surveillance is:",["A structured scan of passengers, bins, equipment, aisles and exits, galleys, lavatories and the cabin environment","A scan of the passengers only, repeated every ten minutes, with equipment checks left to the ground crew","A walk through the cabin at set times, checking the seat belts, bins and lavatories but not the galleys","A structured scan of the cabin done once at boarding, with continuous monitoring left to the flight crew"],0,"Elle change avec chaque phase de vol. · C04 01 03 · p.17–18"],
["Before taxi, take-off and landing the crew verify:",["Clear aisles and exits, secured baggage, suitable exit-row occupants and accessible emergency equipment","Free aisles and exits, baggage allowed in the aisle if stowed securely, exit-row occupants chosen by passengers, and equipment checked after take-off","Closed lavatories only, cabin lights dimmed and passengers' meals stowed, with the exits and equipment checked at the gate","Clear aisles and exits, secured baggage, exit-row seats given to passengers who ask for extra legroom, and equipment checked only at the gate"],0,"La surveillance continue en croisière et au débarquement. · C04 01 03 · p.17–18"],
["A surveillance finding is reported with:",["Exact location, observable facts, immediate risk, action taken and updates, through the crew chain to the flight deck","The location of the passengers and a diagnosis of the cause, sent to the flight deck only if the risk is already high","Observable facts and the risk, given orally to the purser after landing in the crew debrief","The suspected cause, the passenger's name and a request for approval, passed to ground staff before the flight deck"],0,"Boucle fermée : le poste de pilotage et la cabine coordonnent la réponse. · C04 01 03 · p.17–18"]
]},
{n:"C05 – Aero-medical & first aid",s:"PDF p.7–105",q:[
["In-flight medical emergencies are broadly divided into:",["Injury-related and health-related situations","Crew and passenger only","Ground and flight only","Minor and major only"],0,"Blessures : turbulences, chute de bagages, brûlures par liquides chauds ou fours. Problèmes de santé : malaise, allergie, AVC, infarctus, décès. · C05 01 · p.7","General In-flight medical emergencies can be broadly divided into two categories – injury-related or healthrelated situations. (p.7)"],
["The first flight attendant at the scene of a medical emergency normally:",["Takes charge of the patient, alerts the other crew and advises the Captain","Takes charge of the patient, alerts the other crew and advises the Purser","Leaves to find the purser","Waits for a doctor"],0,"Il garde le patient, demande de l'aide pour le matériel d'urgence et informe le commandant des changements d'état. · C05 01 · p.7","The first flight attendant at the scene will normally take charge of the patient and alert other cabin crew members, who will, in turn, provide any required assistance. (p.7)"],
["For anything other than a very minor complaint, the Purser:",["Makes a PA announcement asking for a doctor or other medical professional","Asks the patient to go to the galley and informs the captain after landing","Moves the patient to a seat near the cockpit and waits for symptoms to worsen","Calls the ground by satellite phone, without asking for a doctor on board"],0,"En l'absence de médecin, beaucoup de compagnies ont un contrat avec un service médical (type MedLink) joignable par radio, satellite ou ACARS. · C05 01 · p.8","Diagnosis For anything other than a very minor medical complaint, the Purser, or In-Charge Flight Attendant, will normally make a PA announcement asking if there is a doctor or other qualified medical professional (nurse, paramedic etc) on board. (p.8)"],
["Who decides whether to continue to the destination or divert in a medical emergency?",["The Captain","The doctor","The purser","The airline's catering"],0,"Il s'appuie sur les informations du PNC, du médecin à bord ou du service médical. Le choix tient compte de l'urgence médicale, de l'exploitation et du commercial. · C05 01 · p.8–9","Decision The Captain will make the decision to either continue the flight to the planned destination or to divert to a closer, or otherwise more suitable, aerodrome based on the information provided by the flight attendants, by an onboard medical professional or by a contracted agency. (p.8)"],
["The atmosphere contains approximately what % of oxygen at all heights?",["21%","50%","10%","78%"],0,"C'est la pression partielle qui chute avec l'altitude, pas le pourcentage. La cabine est pressurisée à l'équivalent de 8 000 ft maximum. · C05 02 02 · p.11"],
["Signs of sudden decompression include:",["A loud bang, flying debris and unsecured items ejected near the breach","A gentle hiss, warm air and a slow drift of dust toward the breach, with no loose items moving","A gradual drop in cabin temperature, fogging windows and ears that pop slowly over several minutes","A sudden smell of burning, smoke from the vents and flickering cabin lights"],0,"Une fuite lente laisse au pilote le temps de descendre d'urgence vers 8 000–10 000 ft. · C05 02 02 · p.12","Signs of sudden decompression include “a loud bang, thump or clap” as air inside and outside the plane meet, debris flying around the cabin, and “unsecured items in the immediate area” near the breach being “ejected” from the aircraft. (p.12)"],
["The Eustachian tube equalizes ear pressure when you:",["Swallow or yawn","Hold your breath","Lie down","Cough"],0,"Le barotraumatisme de l'oreille vient d'un déséquilibre de pression entre l'oreille moyenne et la cabine, surtout en montée et en descente. · C05 02 03 · p.13–14","Swallowing or yawning opens the eustachian tube and allows the middle ear to get more air, equalizing the air pressure. (p.14)"],
["Airsickness is caused by:",["Conflicting messages to the central nervous system (inner ear, eyes, muscles)","Cabin pressure changes alone, which affect the inner ear","Dehydration and low blood sugar, which affect the brain","Altitude and low oxygen, which affect the stomach"],0,"Elle est plus fréquente chez les femmes (règles, grossesse), les jeunes enfants et ceux sensibles à d'autres formes de mal des transports. · C05 03 01 · p.17–18","Airsickness occurs when the central nervous system receives conflicting messages from the body (including the inner ear, eyes and muscles) affecting balance and equilibrium. (p.17)"],
["Signs of SEVERE abdominal pain include:",["Signs of shock, a hard belly and high fever","Signs of shock, a hard belly and low fever","A full stomach","A mild ache"],0,"Péritonite : choc, douleur diffuse, ventre dur, fièvre 40 °C. Appendicite : douleur permanente fosse iliaque droite. · C05 03 02 · p.20"],
["For severe abdominal pain the cabin crew:",["Do not give food or drink, install an analgesic position, inform the captain, give oxygen","Do not give food or drink, install an analgesic position, inform the Purser, give oxygen","Give a large meal","Make them walk"],0,"Position antalgique : souvent sur le côté ou tête basse, jambes relevées ; possible vessie de glace ; appel d'un médecin et surveillance des constantes. · C05 03 02 · p.21","In most cases, do not give food or drink Install pax in an analgesic position (often on the side or head down, legs raised) Inform the captain (possible diversion) Give oxygen Possibly an ice pack Make a doctor call Monitor vital constants “BANAL” abdominal pain: (p.21)"],
