["Cabin crew in a crisis should always remember that sleep and vigilance:",["Are vital for safety; a crew can only be fully attentive if well rested","Are vital for safety; a crew cannot only be fully attentive if well rested","Only matter for pilots","Do not matter"],0,"Vous devenez, en pratique, un travailleur posté. · C05 07 01 · p.89"],
["Air at altitude is:",["Dry compared to the ground","The same as the ground","Heavier","Humid"],0,"C'est pourquoi on boit régulièrement de l'eau. · C05 07 01 · p.89","You will be working at altitude, where the air is dry compared to the ground, so make a conscious habit to drink plenty of water on the plane, whenever you are away. (p.89)"],
["The kit must also be:",["Complemented by the operator according to flight duration, number and demographics of passengers","Fixed by the authority with identical contents for every aircraft, whatever the duration or passengers","Limited to the items listed in the regulation, with no additions allowed","Replaced by the crew after every flight, whether or not any item was used"],0,"Les besoins varient selon l'exploitation. · C05 05 02 · p.77","However, these kits should be complemented by the operator according to the characteristics of the operation (scope of operation, flight duration, number and demographics of passengers, etc.). (p.77)"],
["Sudden decompression, unlike a slow leak, is typically recognized by:",["A loud bang or thump","A gentle hiss","Nothing","A smell"],0,"Les objets non fixés près de la brèche sont éjectés. · C05 02 02 · p.12","Signs of sudden decompression include “a loud bang, thump or clap” as air inside and outside the plane meet, debris flying around the cabin, and “unsecured items in the immediate area” near the breach being “ejected” from the aircraft. (p.12)"],
["During the in-flight oxygen use, the mask is placed:",["Over nose and mouth with the headband adjusted","On the forehead, with the headband adjusted","Around the neck, ready to be raised if needed","Over the eyes and nose, with the headband adjusted"],0,"On dit au patient de respirer normalement. · C05 05 01 · p.74"],
["Immunization against influenza is recommended annually for:",["Workers in the tourism industry","Only children and the elderly, who are the most at risk","Only pilots, since they must be fit to fly","Nobody, since the vaccine is only for people who have a chronic illness"],0,"C'est la mesure de prévention principale. · C05 07 02 · p.94","Immunization is the primary method used to prevent influenza infection and its complications Annual influenza immunization has been recommended for workers in the tourism industry. (p.94)"],
["The AED on board is used for:",["Heart-related emergencies, by cabin crew trained and qualified in its use and in CPR","Severe allergic reactions, by any crew member after reading the instructions on the device","Respiratory emergencies such as asthma, by crew qualified in oxygen administration only","Burns and shock, by crew trained in first aid, to stabilise the patient before landing"],0,"Le défibrillateur automatisé est présent sur la plupart des avions commerciaux. · C05 01 · p.10"],
["Because pressure falls when climbing, the cabin of an aircraft is:",["Made airtight and pressurised to the equivalent of 8,000 ft or less","Made airtight and pressurised to the equivalent of 10,000 ft or less","Made airtight and pressurised to the equivalent of 8,000 ft or more","Filled with pure oxygen"],0,"L'air est comprimé par les moteurs ou d'autres moyens puis envoyé dans la cabine et le cockpit. · C05 02 02 · p.11","To address the issue, the cabin and cockpit of a plane is made airtight and pressurized forcibly until the air pressure inside is equivalent to the air pressure present at 8 000 ft or less. (p.11)"],
["What happens at altitude as partial pressure drops?",["Breathing more air becomes difficult beyond a certain point, because the air inhaled lacks the required oxygen","Breathing less air becomes difficult beyond a certain point, because the air inhaled lacks the required oxygen","The oxygen percentage falls to zero","Breathing becomes easier"],0,"Le pourcentage d'oxygène reste d'environ 21 % à toute altitude : c'est la pression qui baisse. · C05 02 02 · p.11","However, beyond a certain point, pressure falls to a level when breathing more air becomes difficult, meaning that there is a lack of required oxygen in the air inhaled. (p.11)"],
["Cabin pressure can be lost:",["Slowly or suddenly, for example through a pressurisation fault, cracked window or fuselage, an incorrectly sealed door or an explosion","Only suddenly, for example through an explosion or a structural break in the fuselage","Only slowly, through a gradual leak at a door seal or a pressurisation fault","Only above 30,000 ft, when the engines can no longer supply enough compressed air to the cabin"],0,"La vitesse de la perte dépend de la taille de la brèche. · C05 02 02 · p.11–12"],
["Ear barotrauma is the stress on the eardrum that occurs when:",["Middle-ear pressure and environmental pressure are out of balance, during climb or descent","Air in the middle ear expands faster than the throat can release it, during level cruise at altitude","Cold dry cabin air irritates the eardrum and swells the outer ear, during climb or descent","Pressure inside the inner ear exceeds cabin pressure because of loud engine noise, during take-off"],0,"On parle d'oreille de l'avion (airplane ear). · C05 02 03 · p.13"],
["The eustachian tube:",["Is a narrow passage connected to the middle ear that regulates air pressure; it often cannot react fast enough in rapid pressure changes","Is a narrow passage connected to the middle ear that regulates air pressure; it often can react fast enough in rapid pressure changes","Is in the throat only","Is a nose valve"],0,"Avaler ou bâiller l'ouvre et équilibre la pression. · C05 02 03 · p.14","A narrow passage called the eustachian tube, which is connected to the middle ear, regulates air pressure. (p.14)"],
["Which is a risk factor for airplane ear?",["A small eustachian tube (infants), cold, sinus infection, hay fever, otitis, or sleeping during ascent and descent","A small eustachian tube (infants), warm, sinus infection, hay fever, otitis, or sleeping during ascent and descent","A small eustachian tube (infants), cold, sinus infection, hay fever, otitis, or sleeping during ascent and climb","Good hearing"],0,"Dormir empêche de bâiller ou d'avaler. · C05 02 03 · p.15"],
["To prevent airplane ear:",["Yawn and swallow, suck a sweet or chew gum, use the Valsalva manoeuvre, do not sleep during take-off and landing, and avoid flying with a cold or ear infection if possible","Yawn and swallow, suck a sweet or chew gum, use the Valsalva manoeuvre, do not sleep during take-off and landing, and avoid flying with a hot or ear infection if possible","Yawn and swallow, suck a sweet or chew gum, use the Valsalva manoeuvre, do not sleep during take-off and landing, and avoid flying with a warm or ear infection if possible","Sleep through descent"],0,"Valsalva : souffler doucement narines pincées, bouche fermée. · C05 02 03 · p.15–16"],
["Severe airplane ear can include:",["Severe pain, hearing loss, tinnitus, vertigo or bleeding from the ear","A mild fullness and muffled hearing that clears quickly after swallowing, with no pain or dizziness","A high fever, a rash behind the ear and swelling of the neck glands after landing","Itching of the ear canal, a runny nose, watering eyes and a sore throat during cruise"],0,"Les formes légères : gêne, sensation d'oreille bouchée, audition étouffée. · C05 02 03 · p.13"],
["Airsickness is:",["A specific form of motion sickness and a normal response in healthy individuals","A bacterial infection of the inner ear, usually caused by a cold","A serious disease needing a doctor on board","A reaction to food, always caused by a heavy meal before the flight"],0,"Le système nerveux central reçoit des messages contradictoires (oreille interne, yeux, muscles). · C05 03 01 · p.17","It is a specific form of motion sickness and is considered a normal response in healthy individuals. (p.17)"],
["Common symptoms of airsickness include:",["Nausea, vomiting, vertigo, cold sweating, pallor, difficulty concentrating, headache and fatigue","Nausea, vomiting, vertigo, warm sweating, pallor, difficulty concentrating, headache and fatigue","Nausea, vomiting, vertigo, hot sweating, pallor, difficulty concentrating, headache and fatigue","Chest pain"],0,"Fatigue, stress, anxiété, alcool et médicaments augmentent la sensibilité. · C05 03 01 · p.17","Nausea, . vomiting, . vertigo, . loss of appetite, . cold sweating, . skin pallor, . difficulty concentrating, . confusion, . drowsiness, . headache, . increased fatigue. (p.17)"],
["Airsickness is more common in:",["Women (especially during menstruation or pregnancy), young children and people prone to motion sickness","Men over 60, frequent flyers and people with a heightened sense of balance, mainly in cruise","Pilots and crew, who are more exposed to turbulence, and adults who travel in the evening","Athletes and people who have eaten a light meal, mainly during the cruise phase"],0,"Une forme sévère peut rendre la personne complètement incapable d'agir. · C05 03 01 · p.18"],
["For an airsick passenger the manual advises:",["Tranquilise, open the aerator, seat at the centre of the aircraft, fasten the belt, reduce head movements, close the curtains, propose a resting mask and recline the backrest","Seat at the rear of the aircraft, open the window shade to watch the horizon, give a light meal and encourage walking","Offer coffee to refocus, keep the aerator closed, seat near the wing and lower the backrest","Isolate in the lavatory, dim the lights, give oxygen at 4 L/min and ask the captain for a diversion"],0,"Avant le départ : antinaupathique ou antiémétique une demi-heure avant. · C05 03 01 · p.18"],
["Observed signs of hyperventilation are:",["Distress, panting breathing, dizziness, sweat and pallor","Slow breathing, a rash on the chest and cold dry skin","Fever, wheezing, grey-blue lips and short sentences","Blue lips, a slow pulse, and sleepiness with normal breathing"],0,"Elle est souvent déclenchée par l'anxiété, l'excitation ou la peur de voler. · C05 03 03 · p.23","Observed signs: - distressed - panting breathing - feeling of dizziness - sweat, pallor What to do: (p.23)"],
["What to do for hyperventilation:",["Do not give oxygen, leave half-seated, speak and reassure, have the person breathe into a vomit bag or paper bag","Give oxygen at 4 L/min, lay the person flat and ask them to hold their breath as long as possible","Do not give oxygen, lay flat with the legs raised and ask them to breathe as deeply and quickly as possible","Give oxygen, leave half-seated, reassure, and have the person breathe into a paper bag"],0,"Le but est d'augmenter le CO2 en respirant l'air expiré. · C05 03 03 · p.23"],
["Why can breathing into a bag be dangerous?",["Asthma or a heart attack can be confused with hyperventilation, and lowering oxygen while raising CO2 can be deadly","Asthma or a heart attack cannot be confused with hyperventilation, and lowering oxygen while raising CO2 can be deadly","The bag may tear","It is noisy"],0,"La méthode doit être appliquée avec prudence. · C05 03 03 · p.24"],
["Tetany follows an uncomplicated hyperventilation and is shown by:",["Tingling of fingers, feet and mouth, tachycardia, muscle cramps especially in the hands, and possibly unconsciousness","A high fever, a slow pulse, muscle weakness in the legs and a rash around the mouth","Chest tightness, blue lips, wheezing and short sentences with each breath","Swelling of the face and throat, hives, vomiting and a sudden drop in blood pressure"],0,"Si la crise persiste, on demande un médecin par annonce ; position latérale de sécurité si inconscient ET respire. · C05 03 03 · p.24","Observed signs: - the same observation as a hyperventilation - tingling, tingling fingers, feet, mouth - visual discomfort - tachycardia, hyperpnea - muscle contraction especially hands = cramps - unconsciousness It can last from a few seconds to a few minutes. (p.24)"],
["Unconsciousness is:",["A sudden inability to respond to stimuli, the person appearing to be asleep, for seconds (fainting) or longer","A gradual loss of alertness lasting hours, with the person still able to answer simple questions","A state of deep sleep from which the person wakes easily when spoken to","A sudden loss of balance with dizziness, in which the person stays fully aware and responds to questions"],0,"Elle appelle une attention immédiate : plus les gestes de premiers secours sont précoces, meilleur est le pronostic. · C05 03 06 · p.39","Unconsciousness is when a person suddenly becomes unable to respond to stimuli and appears to be asleep. (p.39)"],
["Which are common causes of temporary unconsciousness (fainting)?",["Low blood sugar, low blood pressure, syncope, dehydration, heartbeat problems, straining or hyperventilating","High blood sugar, low blood pressure, syncope, dehydration, heartbeat problems, straining or hyperventilating","Good sleep","Walking"],0,"Les causes plus graves : accident, perte de sang, coup à la tête, surdose, intoxication alcoolique. · C05 03 06 · p.39–40"],
["Warning signs that unconsciousness may occur include:",["Sudden inability to respond, slurred speech, rapid heartbeat, confusion, dizziness or lightheadedness","Sudden thirst, a slow strong pulse, shivering, red cheeks and an urge to move around the cabin","Loud coughing, wheezing, grey-blue lips and speaking in very short sentences","Itching skin, hives, swollen lips and a hoarse voice after eating"],0,"On agit tout de suite. · C05 03 06 · p.40","Symptoms that may indicate that unconsciousness is about to occur include: . sudden inability to respond . slurred speech . a rapid heartbeat . confusion . dizziness or lightheadedness (p.40)"],
["In DRSABCD, the first D (Danger) means:",["Check for actual or potential dangers to yourself, bystanders and the patient before acting","Defibrillation: check that the AED is available and charged before approaching the patient","Doctor: ask over the PA for a doctor before touching the patient","Dress: expose the chest and remove clothing to prepare for CPR"],0,"Si c'est trop dangereux, on reste en retrait et on appelle les secours. · C05 03 06 · p.41","Before jumping into action you should check for any actual or potential dangers to yourself, bystanders or the patient. (p.41)"],
["When checking for a response in an adult:",["Shout and gently shake the shoulders, not violently","Slap the face firmly and shout loudly","Shake hard and pour water on the face","Pinch the skin and shout, then lift the eyelids"],0,"Sans réponse, la victime est inconsciente : c'est une urgence médicale. · C05 03 06 · p.41"],
["If the unconscious person is not breathing:",["Start CPR immediately, compressions at 100–120 per minute, call for a defibrillator, and use the AED as soon as it arrives following the voice prompts","Place in the recovery position, give small sips of water and monitor until the person wakes up","Shake firmly, slap the face to wake them and give oxygen at 4 L/min while waiting for a doctor","Give five back blows, then abdominal thrusts, and use the AED only once the person is conscious"],0,"C'est le D de défibrillation du plan DRSABCD. · C05 03 06 · p.42"],
["An asthma attack is when:",["The muscles of the air passages go into spasm, narrowing the airways","The throat swells from a bee sting","The lungs fill with fluid","The heart stops"],0,"Déclencheurs possibles : rhume, médicament, fumée de cigarette, allergie, ou aucun. · C05 04 01 · p.51","During an asthma attack, the muscles of the air passages in the lungs go into spasm. (p.51)"],
["For an asthma attack the crew:",["Reassure, ask for the usual reliever inhaler dose and slow deep breathing, sit them comfortably; if no inhaler, inform the captain","Reassure, ask for the usual reliever inhaler dose and slow deep breathing, sit them comfortably; if no inhaler, inform the Purser","Lay them down flat","Use a paper bag"],0,"Si pas d'amélioration : 1 à 2 bouffées toutes les 2 minutes jusqu'à 10 bouffées ; prévenir le commandant si crise grave ou première crise. · C05 04 01 · p.51"],
["Shock is:",["A medical emergency where blood flow through the body is reduced, limiting oxygen to the cells","A medical emergency where blood flow through the body is increased, limiting oxygen to the cells","A mild faint","A fever"],0,"Causes : baisse du débit ou du volume sanguin, chaleur ou froid extrême, stress sur l'organisme. · C05 04 03 · p.55"],
["Questions to ask a conscious shock victim are:",["What happened, medical problems, medications and allergies to medications","Name, age, destination and seat number, then whether the travel insurance is valid","Occupation, last meal, previous flights and whether alcohol was consumed","What happened, the time of the last meal, the home address and the passport details"],0,"Elle peut perdre connaissance : on note les réponses. Rien dans la bouche (on peut humidifier les lèvres). · C05 04 03 · p.56"],
["A choking adult who can cough forcefully should:",["Keep coughing","Lie down","Drink water","Be hit on the back at once"],0,"Si la personne ne peut ni parler, ni pleurer, ni rire : 5 claques dans le dos puis 5 compressions abdominales en alternance. · C05 04 05 · p.63"],
["For back blows, the rescuer:",["Stands to the side and just behind, supports the chest with one arm, bends the person at the waist and delivers five blows between the shoulder blades with the heel of the hand","Stands to the side and just behind, supports the chest with one disarm, bends the person at the waist and delivers five blows between the shoulder blades with the heel of the hand","Hits the stomach","Hits the chest"],0,"Pour un enfant, on s'agenouille. · C05 04 05 · p.63"],
["For abdominal thrusts:",["Stand behind, wrap arms around the waist, fist slightly above the navel, press hard with a quick upward thrust","Stand behind, wrap arms around the waist, fist slightly above the navel, press hard with a quick upward weight","Stand behind, wrap arms around the waist, fist slightly above the navel, press hard with a quick downward thrust","Press the chest"],0,"Si la victime devient inconsciente, commencer la RCP : les compressions peuvent déloger l'objet. · C05 04 05 · p.64"],
["Epilepsy is:",["A common brain condition with recurrent unprovoked seizures; about 70% of people control them with medication","A common brain infection with fever and neck stiffness; about 70% of patients recover with antibiotics","A common heart rhythm disorder with sudden fainting; about 70% of people are controlled with a pacemaker","A common condition of the inner ear with vertigo; about 70% of people control it with rest"],0,"Les crises tonico-cloniques mal contrôlées présentent le risque le plus élevé. · C05 04 06 · p.65"],
["During a tonic-clonic seizure the crew:",["Stay calm, protect from injury, place something soft under the head, loosen tight clothing, time the seizure, and put nothing in the mouth or restrain","Restrain the person firmly, place an object between the teeth, give water afterwards and lay flat on the aisle floor","Stay calm, hold the limbs still, place a rolled item between the teeth, loosen clothing and time the seizure","Stay calm, move the person to the aisle, give a drink after the seizure and put a pillow under the shoulders"],0,"Si la personne a du liquide dans la bouche, la rouler sur le côté. · C05 04 06 · p.65"],
["On a seat during a seizure:",["Leave the person seated with the belt on, tilt and lock the seat, support the head; after the seizure use the recovery position if breathing is difficult","Move the person to the floor in the aisle, remove the belt and hold the limbs still until the seizure ends","Keep the person seated with the belt on, recline the seat fully and tilt the head back to open the airway","Take the person to the galley, place a rolled item between the teeth and hold the head still"],0,"Informer l'équipage et se préparer à la RCP si la respiration s'arrête. · C05 04 06 · p.66"],
["Signs of forthcoming childbirth include:",["Contractions two minutes apart or less, the urge to push, 'the baby is coming', or crowning","Contractions two minutes apart or more, the urge to push, 'the baby is coming', or crowning","A headache","Chest pain"],0,"Le rôle principal est le confort et le soutien. · C05 04 07 · p.67"],
["During childbirth the crew should:",["Ask for consent, clear bystanders, create a hygienic area, support the head and not push or pull the baby","Ask for consent, use the lavatory for privacy, pull gently on the baby's head and cut the cord with scissors from the kit","Clear bystanders, create a hygienic area, guide the baby out by pulling steadily and cutting the cord at once","Ask for consent, create a hygienic area, delay the delivery by crossing the legs and wait for landing"],0,"Le bébé est gardé au chaud sur la poitrine de la mère ; noter l'heure de naissance. · C05 04 07 · p.67–68"],
["What must NOT be done in childbirth?",["Let the woman go to the toilet, delay delivery, cut the cord, or touch without consent","Ask for consent","Offer water","Provide a blanket"],0,"Ne jamais introduire les doigts. · C05 04 07 · p.68"],
["For a conscious stroke victim:",["Head and shoulders elevated and supported, comfortable temperature, clear airway, nothing to eat or drink","Lay flat with the head lowered, give water to sip and keep the person walking to improve circulation","Sit upright, give aspirin from the kit and offer a warm drink to calm the person","Lay on the left side with the legs raised, loosen clothing and give small amounts of food"],0,"Test FAST : Face, Arms, Speech, Time. · C05 04 01 07 · p.70"],
["For a heart attack the crew first:",["Inform the crew, have the victim stop all activity, reassure and loosen restrictive clothing, then monitor for CPR","Lay the victim flat, loosen clothing, give water and a small snack, and start CPR at once","Keep the victim active to prevent fainting, give an analgesic and wait until landing to inform the flight crew","Inform the crew, have the victim sit upright and drink water, and start CPR immediately without checking breathing"],0,"Signes : douleur ou serrement thoracique, irradiation bras/épaules/mâchoire, essoufflement, pâleur, sueurs, nausées. · C05 04 07 · p.71"],
["Signs of cardiac arrest include:",["Sudden unconsciousness, no carotid or femoral pulse, no breathing or only gasps (agonal), bluish or grey skin, possibly convulsions","Gradual drowsiness, a strong rapid pulse, normal breathing, flushed warm skin and slurred speech only","Sudden chest pain with a normal pulse, rapid deep breathing, red skin and a clear response to voice","Fainting that resolves within seconds, a rapid pulse, regular breathing and pale cool skin"],0,"Ces signes ne sont pas toujours tous présents. Chaque seconde compte. · C05 06 03 · p.81"],
["Cardiopulmonary resuscitation should start with:",["Patient on the back on a firm surface, heel of the hand on the centre of the chest, interlocked fingers, straight arms, pressing about two inches","Patient sitting upright in the seat, heel of the hand on the lower abdomen, bent arms, pressing about one inch","Patient on the back on a firm surface, two fingers on the centre of the chest, bent elbows, pressing about half an inch","Patient on the side in the recovery position, fist on the breastbone, straight arms, pressing about four inches"],0,"On relâche la pression sans retirer les mains. · C05 06 04 · p.82–83"],
["Rescue breaths are given by:",["Tilting the head, lifting the chin, pinching the nostrils, blowing until the chest rises, then watching the chest fall","Tilting the head forward, pinching the mouth shut, blowing through the nose until the stomach rises, then covering the mouth","Lifting the chin with the head neutral, pinching the nostrils, blowing for 10 seconds, then pressing on the chest","Tilting the head, lifting the chin, leaving the nose open, blowing quickly twice without watching the chest"],0,"Cycle : 30 compressions puis 2 insufflations. · C05 06 04 · p.83–85"],
["For a child, CPR compressions are done:",["With one hand, about 1/3 the depth of the chest, at 100–120 per minute, then two breaths after every 30","With two hands to the same depth as an adult, then one breath after every 30","With one hand, about 1/3 the depth of the chest, at 60 per minute, then two breaths after every 15","With one hand, about 1/3 the depth of the chest, at 100–120 per minute, with no breaths"],0,"Nourrisson : deux doigts au centre du thorax, même profondeur de 1/3. · C05 06 06 · p.86","Push on the child's chest with one hand, at a depth of about 1/3 the depth of the chest at the rate of 100-120 compressions per minute. 3. (p.86)"],
["Coordination of CPR with a doctor includes:",["Announcing for a medical professional, coordinating care with them, and contacting the flight crew for radio medical help","Announcing for a doctor, handing the patient to them and informing the airline office only after landing","Asking passengers to take turns on compressions and contacting the ground by satellite phone only","Starting CPR only after the doctor arrives, and contacting the flight crew once the AED is attached"],0,"Sans professionnel de santé, l'équipage fait de son mieux, y compris la RCP. · C05 06 06 · p.87"],
["Disinsection means:",["Health measures to control or kill the insect vectors of human diseases in baggage, cargo, containers and conveyances (mandated by the IHR)","Cleaning surfaces with disinfectant to kill bacteria in the cabin and galleys","Testing passengers for viruses before boarding, mandated by the IHR","Washing the aircraft and baggage with water and detergent to remove insects"],0,"La désinfection vise les agents infectieux sur surfaces ou personnes. · C05 07 03 · p.96"],
["After a person is declared dead on board, the crew first:",["Advise the captain, who informs the destination airport","Advise the Purser, who informs the destination airport","Disembark the body at once","Ask passengers"],0,"Puis déplacer la personne sur un siège, la sangler, la couvrir, demander les coordonnées des accompagnants. · C05 07 04 · p.97"],
["After the flight lands with a death on board:",["Other passengers disembark first, the family stays with the body, and the body is removed only when the proper authority has arrived","The body leaves first with the crew, and the other passengers wait until the family has been escorted off","Everyone disembarks together, and the family accompanies the body once the cabin is cleaned","The crew moves the body to the galley during descent, and the family disembarks first with the other passengers"],0,"Une politique DNR (do not resuscitate) est recommandée aux compagnies. · C05 07 04 · p.97"]

{n:"C06 – Dangerous Goods",s:"PDF p.9–66",q:[

["In which three contexts may crew meet Dangerous Goods?",["Declared cargo, permitted passenger or crew articles, and undeclared material hidden in ordinary belongings","Declared cargo, forbidden passenger or crew articles, and undeclared material hidden in ordinary belongings","Only passenger items","Only crew items"],0,"La voie d'entrée légale ne change pas le besoin de reconnaître les signes anormaux. · C06 01 01 01 · p.13"],
["A permitted item can become unsafe when it is:",["Damaged, leaking, overheating, incorrectly stowed or used contrary to its conditions","Labelled with its correct class, packed in its original box and stowed in the permitted location","New, unused and carried in its original packaging with all conditions of carriage respected","Declared to the operator before boarding and approved, whatever its later condition or use"],0,"Le caractère autorisé n'est pas permanent. · C06 01 01 01 · p.13","A permitted item can become unsafe when it is damaged, leaking, overheating, incorrectly stowed or used contrary to its conditions. (p.13)"],
["Hazard is:",["The intrinsic ability of an article or substance to cause harm","The likelihood of harm in a given situation","A report","A label"],0,"Le risque est la probabilité et la gravité du dommage dans la situation réelle. · C06 01 02 · p.13"],
["Risk changes with:",["Condition, quantity, location, protection and control","Hazard class, colour of the label, brand and the passenger's seat","Price, brand, class and the number of other passengers nearby","Class and Wh rating only, since these never change with condition or location"],0,"Une batterie de 74 Wh intacte et protégée n'a pas le même risque qu'une batterie gonflée, brûlante et coincée sous un siège. · C06 01 02 01 · p.13–14","Dangerous Goods C06 - Risk changes with condition quantity location and control Hazard describes the inherent potential to cause harm. (p.14)"],

const DESC={
"In straight and level flight at constant speed, the aircraft is in equilibrium":"Les 4 forces s'équilibrent deux à deux : la poussée (Thrust, vers l'avant) compense la traînée (Drag, qui freine) et la portance (Lift, vers le haut) compense le poids (Weight, vers le bas). Piège : Thrust > Drag signifierait que l'avion accélère, donc pas d'équilibre.",
"What share of total lift":"La portance vient surtout de la dépression au-dessus de l'aile : 75 %. Les 25 % restants viennent de l'impact de l'air sous l'aile. À retenir : 3/4 dessus, 1/4 dessous.",
"Which surface controls roll":"Trois axes, trois gouvernes : ailerons = roulis (axe longitudinal, nez-queue) ; elevators = tangage (axe latéral, bout d'aile à bout d'aile) ; rudder = lacet (axe vertical). Les ailerons travaillent en opposition, les elevators ensemble.",
"The rudder moves the aircraft":"Le rudder, articulé à l'arrière de la dérive (vertical stabilizer), fait pivoter le nez de gauche à droite : c'est le lacet (yaw) autour de l'axe vertical. Ne le confonds pas avec les ailerons (roulis) ni les elevators (tangage).",
"Plates on the upper wing surface":"Les spoilers sont des plaques sur le dessus de l'aile qui se relèvent dans le flux d'air pour le perturber et freiner. Slats = bord d'attaque, flaps = bord de fuite (augmentent la portance), trims = petites surfaces sur le bord de fuite d'une grande gouverne.",
"Slats are located on the":"Slats = bord d'attaque (leading edge, à l'avant de l'aile) : sortis, ils permettent à l'aile de voler à plus forte incidence. Mnémo : Slats à l'avant, Flaps à l'arrière.",
"The Protective Breathing Equipment":"Le PBE est une cagoule anti-fumée autonome en circuit fermé : l'oxygène arrive automatiquement dès qu'on l'enfile et le CO2 expiré est neutralisé par une cartouche de chaux sodée. Durée garantie : 15 minutes.",
"How is oxygen produced by most":"Pour les passagers, l'oxygène vient d'un générateur chimique (PSU) : tirer le masque retire une goupille de percussion qui lance une réaction chimique produisant de l'oxygène. Ce ne sont pas des bouteilles dans les sièges ni de l'air des moteurs.",
"Standard atmosphere at sea level":"Atmosphère standard au niveau de la mer : 1013,25 hPa et 15 °C. Ensuite -2 °C par 1000 ft (6,5 °C par 1000 m), jusqu'à -56,5 °C minimum. La pression ne baisse pas linéairement car l'air est compressible.",
"As altitude increases, gas in a closed space":"Loi de Boyle : la pression baisse avec l'altitude, donc le volume d'un gaz enfermé augmente (jusqu'à +20 % à 8 000 ft dans le corps humain). Exemple du manuel : un ballon de 1 L au sol fait 4 L à 35 000 ft.",
"Middle-level clouds form between":"Trois étages : hauts > 20 000 ft (cirro/cirrus, cristaux de glace) ; moyens 6 500–20 000 ft (préfixe alto) ; bas < 6 500 ft (stratus). Les nuages à développement vertical portent le mot cumulus (le Cb en fait partie).",
"Which is NOT required for Cb formation":"Un Cb se forme avec : une couche épaisse d'air instable, de l'air chaud et humide, et un déclencheur (chauffage du sol, relief, front). Un air stable, froid et sec est l'inverse de ces conditions.",
"Clear Air Turbulence mostly occurs":"La CAT survient hors des nuages (donc invisible), au-dessus de 15 000 ft, à cause des forts cisaillements de vent dans le jet stream (vents d'ouest en est). Ne la confonds pas avec la turbulence de Cb ou de montagne.",
"Wingtip vortices can persist":"Les tourbillons de bout d'aile sont stables et durent jusqu'à 3 minutes après le passage de l'avion. Le jetwash (gaz d'échappement) est très turbulent mais très bref.",
"Volcanic ash in the engines":"Les cendres sont avalées par les réacteurs, fondent puis se collent aux composants internes : risque de panne moteur. Elles abîment aussi le pare-brise. Cas cité : KLM 867 (1989, Mont Redoubt), quatre moteurs perdus.",
"De-icing fluid protection time":"Le liquide (glycol + eau, avec colorant) protège de 2 minutes à 2 heures selon le liquide, la température et la météo. Le dégivrage se fait à la porte, après repoussage sur l'aire, ou sur une zone dédiée.",
"Cabin crew training on surface contamination":"Le PNC n'applique pas le liquide et ne décide pas du décollage : il doit connaître les effets de la contamination des surfaces et signaler au pilote toute observation (glace ou givre visible depuis un hublot).",
"'Wilco' means":"Roger = reçu/compris ; Wilco (will comply) = je vais l'exécuter. Affirmative = oui ; Negative = non ; Standby = attendez. Roger ne dit pas qu'on va agir, juste qu'on a reçu.",
"'PAN-PAN' indicates":"PAN-PAN = urgence mais pas de danger vital immédiat (problème avec l'avion ou ses occupants). MAYDAY = détresse, danger de mort. Les deux se disent trois fois.",
"'MAYDAY' is":"MAYDAY est l'appel de détresse international (danger de mort), dit trois fois, et il passe avant tous les autres messages. PAN PAN signale une urgence moins grave.",
"Unexpected turbulence without the seat belt sign on":"Si on ressent des turbulences alors que le signal ceinture n'est pas allumé, c'est le Purser qui informe le poste de pilotage. Phrase type : 'Here's the cockpit, cabin crew turbulence'.",
"Which message has the highest priority":"Ordre de priorité : distress (mayday) > emergency (pan pan) > messages ATC (clearances) > informations de vol > messages compagnie-équipage (ACARS).",
"A PA system is required if":"Chiffres à retenir : PA obligatoire au-delà de 19 sièges ; mégaphones au-delà de 60 sièges (1 pour 61–99 sièges, 2 à partir de 100, par pont) ; PA utilisable en 10 secondes maximum.",
"Portable megaphones are required above":"Mégaphones : au-delà de 60 sièges. Ne confonds pas avec le PA, obligatoire au-delà de 19 sièges.",
"Megaphones required for 100+":"Par pont passagers : 61 à 99 sièges = 1 mégaphone ; 100 sièges et plus = 2.",
"The three types of passenger announcements":"Commerciales (bienvenue, progression, services), opérations normales (embarquement, décollage, descente) et urgence (turbulence, descente d'urgence, évacuation, urgence médicale).",
"An occurrence report differs":"Incident report = événement qui pourrait menacer la sécurité sans blessure ni dommage important (urgence médicale, passager perturbateur, panne). Occurrence report = événement plus grave avec blessure ou dommage (accident, feu, forte turbulence), pour chercher les causes racines.",
"'INOP' on the tech log":"INOP = inoperative : un système ou une pièce ne fonctionne pas comme prévu. Le commandant signe le tech log et l'avion peut partir si le défaut est réparé ou toléré par la MEL.",
"Gesture 'Recommend stop'":"Gestes avec les pompiers : stop = bras croisés aux poignets devant la tête ; feu = main droite en éventail de l'épaule au genou et main gauche qui pointe le feu ; emergency contained = bras à 45° qui se croisent sous la taille ; recommend evacuation = bras horizontal, main levée, mouvement d'appel vers l'arrière. De nuit : pareil avec des bâtons lumineux.",
"Which is NOT a reason cabin crew hesitate":"Trois raisons de réticence à parler au cockpit : doute sur l'importance de l'information, peur d'être remis à sa place ou renvoyé, crainte de violer la règle du sterile cockpit. D'où l'intérêt du CRM.",
"Below 29,000 ft, minimum vertical separation":"Séparation verticale minimale : 1 000 ft en dessous de 29 000 ft ; 2 000 ft (600 m) au-dessus, sauf en espace RVSM.",
"INCERFA is the":"Trois phases SAR, de la moins grave à la plus grave : INCERFA (incertitude), ALERFA (alerte), DETRESFA (détresse). ALERFA est le deuxième niveau, pas le premier.",
"Minimum age for a cabin crew attestation":"CC.GEN.020 : 18 ans minimum. L'attestation est de durée illimitée mais devient invalide si les privilèges ne sont pas exercés pendant 60 mois sur un type d'avion.",
"Cabin crew medical checks are required":"Contrôle médical avant de commencer, puis tous les 5 ans (MED.C.005(b)), uniquement par des professionnels qualifiés. Après chaque contrôle, un rapport médical est remis à la compagnie.",
"A passenger is considered an adult":"Adulte dès 12 ans ; enfant de 2 à 12 ans ; bébé (infant) avant 2 ans. Un siège ne peut être occupé que par une personne, sauf un adulte avec un bébé.",
"Exit row seats may be occupied by":"Un ABP est un passager valide, assez fort et apte à aider à l'évacuation. Interdits en rangée d'issue : enfants de moins de 12 ans, PMR, passagers ne comprenant pas les instructions, personnes avec animaux, personnes escortées.",
"A refuelling 'clear area'":"Une zone dégagée fait au moins 4 x 11 m. L'escape route minimale peut être : un moyen d'embarquement + une zone, deux moyens, ou deux zones (portes fermées seulement).",
"The sterile cockpit threshold":"Sterile cockpit : sous FL100 (10 000 ft) en montée comme en descente, pas de communications ni d'activités non essentielles. Le PNC ne contacte le cockpit que pour une urgence de sécurité.",
"Alcohol: crew should not drink":"Pas d'alcool moins de 8 h avant la prise de service ; taux ≤ 0,2 pour mille en début de service ; aucun alcool pendant le service ni en astreinte. Après un don de sang ou une plongée, attendre au moins 24 h.",
"The maximum basic daily FDP":"FDP de base : 13 h, réduit de 30 min par secteur à partir du 3e (2 h de réduction maximum). Équipage renforcé : 16 h (4 atterrissages max) ; double équipage : 18 h (6 atterrissages max).",
"The reporting time before the first off-block":"Présentation 60 min avant le premier off-block, 90 min s'il y a un secteur ETOPS. Les 30 min de tâches après vol comptent dans le FDP.",
"Rest before an FDP":"Repos avant un FDP : au moins la durée du service précédent ou 12 h à la base (10 h hors base), la plus longue des deux.",
"Cumulative duty hours must not exceed 60":"Limites cumulées : 60 h en 7 jours, 190 h en 28 jours, 1800 h en 12 mois (2000 h pour ceux avec une part importante de travail de bureau).",
"Signs of rapid decompression":"Décompression rapide : bruit fort, froid intense, débris, brouillard dense (condensation, qui peut déclencher les détecteurs de fumée). Réaction du PNC : masque le plus proche, le mettre de façon démonstrative, s'asseoir.",
"The evacuation command is":"Le commandant ordonne 'EVACUATE' trois fois et active le signal d'évacuation. Si rien ne vient du cockpit mais que l'évacuation est évidente, le Purser la déclenche. 'Remain seated' signifie le contraire."

let pick;
if(WEIGHTS){const sw=WEIGHTS.reduce((a,b)=>a+b,0),cnt=WEIGHTS.map(w=>Math.floor(k*w/sw)),r=k-cnt.reduce((a,b)=>a+b,0),ord=WEIGHTS.map((w,i)=>[k*w/sw-Math.floor(k*w/sw),i]).sort((a,b)=>b[0]-a[0]);for(let j=0;j<r;j++)cnt[ord[j][1]]++;pick=[];cnt.forEach((c,pi)=>pick.push(...sh(pool.filter(x=>x[0]==pi)).slice(0,c)));pick=sh(pick)}
else pick=sh(pool).slice(0,k);
pick.forEach(([p,i])=>usedG.add(p+":"+i));return pick}
function resetUsed(){if(cp<0)usedG.clear();else used[cp].clear();setup()}
function home(){Q=null;const tot=total();
$("app").innerHTML=`<p class="mu" style="margin:0 0 12px">${tot} questions réparties en ${P.length} manuels. Choisis un manuel, ou lance le mode aléatoire.</p><div class="grid"><button class="pass" onclick="setup(-1)"><div class="main"><div class="code">Tous</div><div class="name">Mode aléatoire</div><div class="meta">${tot} questions · tous les manuels mélangés</div></div><div class="stub"><b>${usedG.size}</b><span>tirées</span></div></button>`+P.map((p,i)=>{const c=p.n.split(" – ");return `<button class="pass" onclick="setup(${i})"><div class="main"><div class="code">${c[0]}</div><div class="name">${c[1]||""}</div><div class="meta">${p.q.length} questions · ${p.s}</div></div><div class="stub"><b>${used[i].size}</b><span>tirées</span></div></button>`}).join("")+`</div>`;scrollTo(0,0)}
function setup(i){if(i!=null)cp=i;Q=null;const g=cp<0,n=g?total():P[cp].q.length,s=ST[key()]||{},u=g?usedG.size:used[cp].size,k=Math.min(len,n);
$("app").innerHTML=`<button class="back" onclick="home()">‹ Tous les manuels</button><section class="card" style="margin-top:0"><h2>${label()}</h2><p class="mu" style="margin:0">${g?"Questions tirées au hasard dans tous les manuels, sans distinction de module":P[cp].s}</p><div class="facts"><div><b>${n}</b><span>questions</span></div><div><b>${u}</b><span>déjà tirées</span></div><div><b>${s.best!=null?s.best+"%":"–"}</b><span>meilleur score</span></div><div><b>${s.plays||0}</b><span>quiz terminés</span></div></div><div class="lbl">Nombre de questions</div><div class="seg">${[10,25,50].map(v=>`<button class="${v==len?"on":""}" onclick="len=${v};setup()">${v}</button>`).join("")}</div><button class="btn" onclick="start()">Lancer le quiz (${k} questions)</button>${u?`<button class="btn ghost" onclick="resetUsed()">Remettre toutes les questions en jeu</button>`:""}</section>`;scrollTo(0,0)}
function start(ids){let l;if(ids)l=ids;else if(cp<0)l=drawAll(Math.min(len,total()));else{const p=P[cp];let pool=p.q.map((_,i)=>i).filter(i=>!used[cp].has(i));const k=Math.min(len,p.q.length);if(pool.length<k){used[cp].clear();pool=p.q.map((_,i)=>i)}l=sh(pool).slice(0,k).map(i=>[cp,i]);l.forEach(([,i])=>used[cp].add(i))}
Q={l:l.map(([p,i])=>mk(p,i)),i:0,s:0,a:null,w:[],done:false};show()}
function show(){const x=Q.l[Q.i],n=Q.l.length;
$("app").innerHTML=`<div class="qbar"><button class="x" onclick="quit()" aria-label="Quitter le quiz">✕</button><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div><span>${Q.i+1}/${n}</span><span>✔ ${Q.s}</span></div><section class="card" style="margin-top:4px"><div class="mu" style="font-size:.88rem">${P[x.p].n}</div><h3>${x.q}</h3><div>${x.o.map((o,j)=>`<button class="opt" onclick="ans(${j})"><span class="k">${LET[j]}</span><span>${o.t}</span></button>`).join("")}</div><div id="fb" aria-live="polite"></div></section>`;scrollTo(0,0)}
function ans(j){if(Q.a!==null)return;Q.a=j;const x=Q.l[Q.i],ok=x.o[j].c,g=x.o.find(o=>o.c).t;
document.querySelectorAll(".opt").forEach((e,k)=>{e.disabled=true;e.classList.add(x.o[k].c?"ok":k==j?"ko":"dim")});
if(ok)Q.s++;else Q.w.push({...x,m:x.o[j].t,g});
const r=ref(x.e),last=Q.i==Q.l.length-1;
$("fb").innerHTML=`<div class="fb ${ok?"":"bad"}"><div class="fbh">${ok?"Bonne réponse":"Pas tout à fait"}</div>${ok?`<p class="keep">À retenir : <b>${g}</b></p>`:`<p>Ta réponse : <s>${x.o[j].t}</s><br>Bonne réponse : <b>${g}</b></p>${dh(x.o[j].t,g)}`}<p>${r.t}</p>${x.d?`<p class="tip">💡 ${x.d}</p>`:""}${x.x?`<p class="ext">📖 Extrait du manuel : « ${x.x} »</p>`:""}${r.r?`<span class="src">${r.r}</span>`:""}</div><div class="nextbar"><button class="btn" onclick="nx()">${last?"Voir mon score":"Question suivante"}</button></div>`;
document.querySelector(".nextbar").scrollIntoView({block:"nearest",behavior:"smooth"})}
function dh(w,g){const a=w.split(/\s+/),b=g.split(/\s+/);let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;const A=a.slice(i,a.length-j),B=b.slice(i,b.length-j);if(!A.length||!B.length||A.length>10||B.length>10||(i+j)<Math.max(a.length,b.length)*0.4)return"";return `<p class="cmp">Ce qui change : « ${A.join(" ")} » dans ta réponse, « ${B.join(" ")} » dans la bonne.</p>`}
function nx(){Q.a=null;Q.i++;Q.i<Q.l.length?show():fin()}
function quit(){if($("dlg"))return;const d=document.createElement("div");d.id="dlg";d.className="dlg";d.innerHTML='<div class="box" role="alertdialog" aria-label="Quitter le quiz"><h3>Quitter ce quiz ?</h3><p class="mu">Ta progression sera perdue.</p><button class="btn" onclick="closeDlg()">Continuer le quiz</button><button class="btn ghost" onclick="closeDlg();setup()">Quitter</button></div>';document.body.appendChild(d)}
function closeDlg(){const d=$("dlg");if(d)d.remove()}
function fin(){Q.done=true;const n=Q.l.length,pc=Math.round(Q.s/n*100),s=ST[key()]||{best:null,plays:0};s.plays++;if(s.best==null||pc>s.best)s.best=pc;ST[key()]=s;save();
const msg=pc>=90?"Excellent":pc>=75?"Très bien":pc>=50?"Pas mal, continue":"À retravailler",C=2*Math.PI*52;
$("app").innerHTML=`<section class="card res" style="margin-top:4px"><svg viewBox="0 0 120 120" class="ring" role="img" aria-label="${pc}%"><circle cx="60" cy="60" r="52" class="trk"/><circle cx="60" cy="60" r="52" class="val" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/><text x="60" y="68" text-anchor="middle">${pc}%</text></svg><h2>${Q.s} sur ${n}</h2><p class="mu">${msg} · ${label()}</p><button class="btn" onclick="start()">Nouveau quiz avec d'autres questions</button>${Q.w.length?`<button class="btn alt" onclick="start(Q.w.map(w=>[w.p,w.i]))">Refaire mes ${Q.w.length} erreurs</button>`:""}<button class="btn ghost" onclick="setup()">Retour</button></section>`+(Q.w.length?`<section class="card"><h3>À revoir (${Q.w.length})</h3>`+Q.w.map(w=>{const r=ref(w.e);return `<details class="rv"><summary>${w.q}</summary><p class="mu">${P[w.p].n}</p><p>Ta réponse : <s>${w.m}</s></p><p>Bonne réponse : <b>${w.g}</b></p>${dh(w.m,w.g)}<p>${r.t}</p>${w.d?`<p class="tip">💡 ${w.d}</p>`:""}${w.x?`<p class="ext">📖 Extrait du manuel : « ${w.x} »</p>`:""}${r.r?`<span class="src">${r.r}</span>`:""}</details>`}).join("")+`</section>`:"");scrollTo(0,0)}
addEventListener("keydown",e=>{if(!Q||Q.done||$("dlg"))return;if(Q.a===null){const k="1234abcd".indexOf(e.key.toLowerCase());if(k>=0&&k%4<Q.l[Q.i].o.length)ans(k%4)}else if(e.key=="Enter"||e.key==" "){e.preventDefault();nx()}});
home();
</script></body></html>
